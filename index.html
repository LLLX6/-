<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#090807"><title>Virtual Mall v0.9</title><style>html,body{margin:0;height:100%;background:#090807;color:#f5f1ea;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.boot{height:100%;display:grid;place-items:center;text-align:center;padding:24px}.boot b{display:block;font-size:22px;letter-spacing:2px}.boot span{display:block;color:#d9b06f;margin-top:10px;font-size:12px}.boot i{display:block;width:34px;height:34px;border:2px solid #33291f;border-top-color:#d9b06f;border-radius:50%;margin:24px auto;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="boot"><div><b>VIRTUAL MALL</b><span>PLAYER RUNTIME v0.9</span><i></i><small>جاري تشغيل العالم…</small></div></div><script>(async()=>{try{const ps=Array.from({length:7},(_,i)=>`vm09/part${String(i).padStart(2,'0')}.txt`);const rs=await Promise.all(ps.map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(p+' '+r.status);return r.text()})));document.open();document.write(rs.join(''));document.close()}catch(e){document.body.innerHTML='<div class="boot"><div><b>تعذر تشغيل العالم</b><span>أعد تحميل الصفحة أو افتحها في Safari / Chrome</span><small>'+String(e)+'</small></div></div>'}})();</script></body></html>
