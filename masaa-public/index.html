/* === طبعة الهواتف: هوية رصينة وتنقل واضح === */
:root{--ink:#173f39;--moss:#416f5b;--paper:#fffdf7;--bg:#f6f4ed;--gold:#ae8b55;--soft:#eff4ed;--line:#e5e7dc;--muted:#60766b}
body{overflow-x:hidden;max-width:100%;background:radial-gradient(ellipse at 0% 0%,#f2eee0 0%,transparent 45%),var(--bg)}
.top{position:sticky;top:0;z-index:35;max-width:100%;height:65px;display:grid;grid-template-columns:1fr auto 1fr;padding:8px max(14px,env(safe-area-inset-right));gap:7px;border-bottom:1px solid #dde5d9;background:rgba(250,250,246,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.top-side{display:flex;align-items:center;gap:4px;min-width:0}.top-right{justify-self:start}.top-left{justify-self:end}.top .brand{justify-self:center;white-space:nowrap;font-family:'Amiri','Noto Naskh Arabic',serif;font-size:23px;font-weight:700;padding:2px 8px;margin:0}
.icon-button{display:inline-flex;align-items:center;justify-content:center;min-width:43px;min-height:43px;border:1px solid transparent;border-radius:12px;color:#315a48;background:transparent;transition:background .15s,transform .15s;flex:0 0 auto}
.icon-button:hover,.icon-button:focus-visible{background:#eaf1e6;border-color:#dde7d9}
.ui-icon{display:inline-block;vertical-align:middle;flex-shrink:0}
.button .ui-icon{margin-inline-end:7px}
.button{display:inline-flex;justify-content:center;align-items:center;gap:7px;border-radius:14px;font-size:calc(15.5px * var(--text-scale));letter-spacing:0;padding:11px 19px;min-height:53px}
.button .ui-icon{margin-inline-end:0}
.cover{border-radius:0 0 16px 16px;max-width:990px;box-shadow:0 20px 80px #0d312a20;min-height:min(930px,calc(100dvh - 26px))}
.cover:before{background:linear-gradient(180deg,rgba(255,250,237,.90) 0%,rgba(255,251,232,.60) 28%,rgba(255,244,220,.08) 57%,rgba(16,47,39,.72) 100%)}
.cover-head{padding-top:clamp(72px,12vh,126px);padding-inline:20px}
.cover-title{font-family:'Amiri','Noto Naskh Arabic',Georgia,serif;font-size:clamp(51px,10vw,89px);line-height:1.35;max-width:650px;margin:3px auto 18px;font-weight:700;text-shadow:0 3px 20px #fff7eccc}
.cover-sub{font-size:clamp(17px,2.8vw,25px);font-weight:500;color:#335c4c;max-width:600px;margin:0 auto;line-height:1.9}
.author{font-size:clamp(15px,2vw,18px);margin:18px 0 0;color:#50665c}
.cover-foot{display:grid;grid-template-columns:1fr 1fr;max-width:610px;width:100%;margin:0 auto;padding:24px 18px max(46px,calc(env(safe-area-inset-bottom) + 32px));gap:12px}
.cover .button{width:100%;min-width:0;min-height:58px;box-shadow:0 6px 23px #132e2325;font-size:16px;border-radius:15px}
.cover .light{background:#fffdf7;color:#17443a}.cover .secondary{background:rgba(250,249,243,.93);color:#2c5145}
.wrap{min-height:calc(100dvh - 65px)}
.question-page{min-height:calc(100dvh - 163px);max-width:840px}
.question-top{margin-top:clamp(22px,5vh,65px)}.question-title{line-height:1.65;font-size:clamp(30px,5vw,45px);margin-top:15px;margin-bottom:7px}
.num{font-size:13px;letter-spacing:.05em;color:#a17b43}
.rail{background:#e0e6dd;height:5px;margin-top:20px;margin-bottom:22px}
.choicegrid{gap:12px}.choice{position:relative;min-height:78px;padding:18px 21px;border:1px solid #e4e7df;background:#fffef9;border-radius:16px;color:#274e40;box-shadow:0 7px 24px rgba(40,71,54,.035);font-size:calc(17px * var(--text-scale));font-weight:600;display:flex;justify-content:flex-start;text-align:right;transition:background .12s,box-shadow .12s,transform .12s}
.choice:hover{background:#f3f7ee;border-color:#b8cfb8;box-shadow:0 8px 27px #244b2811}.choice:active{transform:scale(.991)}
.choice-label{display:block;line-height:1.75}
.quizfoot{margin-top:22px;justify-content:flex-start}.quizfoot .previous-button{min-width:130px}
.paper{border:1px solid #e7eadf;border-radius:20px;background:linear-gradient(145deg,#fffef9,#fffdf5);box-shadow:0 18px 50px #25453912;padding:clamp(25px,5vw,58px)}
.title{font-family:'Amiri','Noto Naskh Arabic',serif;line-height:1.45}
.result-p{font-family:'Amiri','Noto Naskh Arabic',Georgia,serif;line-height:2.08;font-size:calc(20px * var(--text-scale))}
.result-meta .pill{font-size:14px;background:#eef3e9;border:1px solid #d9e6d7;padding:8px 15px}
.scripture{background:#f3f5eb;border:1px solid #e5e5d5;border-right:3px solid #a78a55;border-radius:12px;padding:20px 23px;margin:23px 0}
.verse{font-size:calc(27px * var(--text-scale));line-height:2.05}
.result-nav{direction:rtl;display:flex;justify-content:space-between;align-items:stretch;gap:12px}
.result-nav .nav-next{order:0}.result-nav .nav-prev{order:10}
.result-nav .button{flex:0 1 48%;min-width:0}
.library-grid{gap:12px}.library-item{border-radius:15px;box-shadow:0 7px 23px #214e3610;min-height:96px}.library-item:hover{background:#f1f7ee}
.feedback{border-top-color:#d9e2d3}.footer{padding-inline:16px;justify-content:center}
@media(max-width:660px){
 .wrap{padding:10px 13px 45px}.top{height:60px;padding-inline:9px}.icon-button{min-width:40px;min-height:40px}.top .brand{font-size:19px;padding-inline:2px}.top-side{gap:0}
 .cover{min-height:100dvh;border-radius:0}.cover-head{padding-top:clamp(66px,11vh,104px)}.cover-title{font-size:clamp(51px,10.5vw,72px)}
 .cover-foot{padding-inline:16px;gap:9px}.cover .button{min-height:55px;font-size:14px;padding:11px 9px;gap:5px}.cover .button .ui-icon{width:18px;height:18px}
 .question-title{font-size:clamp(29px,8vw,40px)}.question-top{margin-top:clamp(22px,4vh,45px)}
 .choicegrid,.library-grid{grid-template-columns:1fr}.choice{min-height:65px;padding:13px 18px;font-size:calc(17px * var(--text-scale))}
 .paper{margin:14px 0 20px;padding:25px 20px}.verse{font-size:calc(23px * var(--text-scale))}.result-p{font-size:calc(19px * var(--text-scale))}
 .result-nav{flex-direction:row;flex-wrap:wrap}.result-nav .button{min-height:52px;font-size:14px;flex:1 1 42%}
}

تدت وجوده فيها؛ اطلب صحبة مأمونة في الأوقات الأصعب.","خوفك من نسيان صوته يدل على مكانة الذكرى؛ يمكنك حفظ صورة أو حكاية عنه إن كان ذلك يريحك."]},{"feeling":"حزن وفقد","label":"غياب شخص أترقب عودته","chapter":9,"opening":"للغائب حضور غريب؛ تفتقده في مكانه المعتاد، وفي كل خبر تتمنى أن تسمعه عنه. وطول الانتظار قد يرهق القلب من غير أن يغيّر حقيقة المحبة.","action":"تحقق مما تستطيع معرفته بطريق موثوق، واتفق مع شخص يساعدك في المتابعة دون تعريض نفسك للخطر.","alert":null,"id":"s2","pains":["يطول انتظاري ولا يصلني خبر","أتخيل الأسوأ كلما تأخر","تؤلمني قلة ما أستطيع فعله"],"warm":"الغياب من غير جواب مُتعب؛ فهو يترك القلب بين الاحتمالات. لا يصير أسوأ احتمال حقيقة لمجرد أن الخوف تكرر.","closing":"ما لا تعرفه اليوم لا يلزم أن تملأه بأقسى الظنون.","theme":"absence","verseKeys":["يوسف:٨٦"],"verseScope":"صلة موضوعية محددة","isRisk":false,"painGuidance":["غياب الخبر يفتح أبواب الظن؛ اتفق مع شخص موثوق على طريقة محددة للتحقق بدل البحث المتواصل.","ليس كل احتمال مخيف خبراً صحيحاً؛ ميز ما ثبت مما تخشاه.","قلة ما تستطيع فعله لا تعني قلة اهتمامك؛ اكتب خطوة متابعة واحدة في حدود قدرتك."]},{"feeling":"حزن وفقد","label":"فراق أو انتهاء علاقة","chapter":13,"opening":"قد يؤلم الفراق حتى حين تعرف أن العلاقة لم تعد ممكنة. تشتاق إلى تفاصيل صغيرة، وربما تسأل نفسك إن كنت ستستعيد هدوءك يوماً.","action":"امنح نفسك مساحة لتهدأ، ولا تتخذ قرار تواصل أو مواجهة تحت ضغط عاطفي شديد.","alert":null,"id":"s3","pains":["أشتاق إلى العلاقة كما كانت","أشعر أنني رُفضت","أخشى الوحدة بعد الانفصال"],"warm":"انتهاء علاقة لا يلغي المحبة التي كانت، ولا يختصر قيمة أي إنسان في قرار الطرف الآخر.","closing":"ليس عليك أن تنكر حزنك حتى تبدأ حياة جديدة.","theme":"separation","verseKeys":[],"verseScope":"لا استشهاد قبل الأمان","isRisk":false,"painGuidance":["قد تشتاق إلى ما كان جميلاً دون أن تكون العودة صالحة؛ امنح الاشتياق مكاناً دون أن تجعله قراراً.","قرار الآخر قد يوجع، لكنه لا يحدد قيمتك؛ خذ مسافة قبل الحكم على نفسك.","الخوف من الوحدة مفهوم بعد القرب؛ ابقِ صلة بمن يأمنهم قلبك خارج تلك العلاقة."]},{"feeling":"حزن وفقد","label":"خبر صادم لم أستوعبه","chapter":9,"opening":"بعض الأخبار تدخل القلب أسرع من قدرة الإنسان على فهمها. قد تعود الجملة إلى ذهنك مرات، ولا تجد تفسيراً لما تشعر به.","action":"تأكد من المعلومات الأساسية، واطلب من شخص موثوق أن يساعدك فيما لا يحتمل التأجيل.","alert":null,"id":"s4","pains":["لا أستطيع استيعاب الخبر","أخشى ما سيحدث بعده","عجزت عن إبلاغ من أحب"],"warm":"للخبر الصادم وقع يجعل الكلمات بطيئة. ليس مطلوبًا منك أن تفهم كل نتائجه في الساعة نفسها.","closing":"يكفي اليوم أن تمضي بما تقدر عليه من غير محاكمة لقلبك.","theme":"shock","verseKeys":[],"verseScope":"لا شاهد مباشر","isRisk":false,"painGuidance":["قد تحتاج إلى سماع المعلومة مرة ثانية بهدوء؛ اطلب شرحاً واضحاً ممن يعرف الوقائع.","الخبر شيء وما سيقع بعده شيء آخر؛ اجمع ما تعرفه قبل بناء أسوأ الاحتمالات.","إبلاغ الآخرين خبر مؤلم عبء شديد؛ يمكنك طلب المساندة من شخص مأمون في نقله."]},{"feeling":"حزن وفقد","label":"اشتياق إلى بيت أو وطن","chapter":19,"opening":"قد يكون الحنين إلى المكان حنيناً إلى نفسك كما كنت فيه: أصوات مألوفة، ووجوه، وطرقات تعرفها دون أن تفكر.","action":"حافظ على صلة آمنة بمن تحب، وابحث عن شخص أو خدمة محلية تساعدك على الاستقرار حيث أنت.","alert":null,"id":"s5","pains":["أشتاق إلى مكان لا أستطيع زيارته","فقدت شعوري بالانتماء","أخاف ألا أستقر مجددًا"],"warm":"قد يصبح المكان جزءًا من الذاكرة لا تعوّضه صورة جديدة بسهولة. الاشتياق لا يعني أنك عاجز عن بناء حياة في مكان آخر.","closing":"للبيت القديم مكانه في القلب، ولحياتك الحاضرة حق عليك أيضًا.","theme":"exile","verseKeys":[],"verseScope":"عام في المعنى","isRisk":false,"painGuidance":["قد يؤلمك مكان لا تستطيع بلوغه؛ حافظ على ما يصلك به دون أن تلوم نفسك على البعد.","الغربة قد تُضعف الإحساس بالانتماء؛ ابحث عن علاقة أو عادة صغيرة تربطك بمكانك الحالي.","الاستقرار قد يحتاج وقتاً وظروفاً؛ ركز على ما يجعل أيامك أكثر أماناً الآن."]},{"feeling":"حزن وفقد","label":"خيبة أمل كبيرة","chapter":8,"opening":"تعبت في أمر وأخذ من قلبك مساحة واسعة، ثم لم يأت كما تمنيت. قد يحزنك ضياع الوقت بقدر ما يحزنك ضياع النتيجة.","action":"سمّ الشيء الذي لم يتحقق بدقة، وافصل بين سبب يمكنك مراجعته ونتيجة لم تكن كلها بيدك.","alert":null,"id":"s6","pains":["تعبت من خيبة متكررة","أشعر أن جهدي لم يُر","أخاف محاولة شيء جديد"],"warm":"الخيبة موجعة، لكنها لا تخبر وحدها عن قيمتك أو عن كل الاحتمالات التي بقيت.","closing":"خذ وقتك قبل أن تحكم على بقية الطريق من محطة واحدة.","theme":"uncertainty","verseKeys":[],"verseScope":"لا شاهد مباشر","isRisk":false,"painGuidance":["تكرار الخيبة مرهق؛ اترك مساحة لفهم السبب قبل أن تطلب من نفسك محاولة جديدة.","ربما لم يظهر أثر عملك للناس؛ افصل قيمة الجهد عن مقدار ما ناله من تقدير.","التردد بعد الخيبة ليس كسلاً؛ ابدأ بمحاولة محدودة المخاطر إن توافرت لها أسباب معقولة."]},{"feeling":"حزن وفقد","label":"حزن لا أستطيع تفسيره","chapter":15,"opening":"أحياناً يضيق القلب ولا تجد له قصة واحدة. لا تحتاج إلى اختراع سبب حتى تكون مشاعرك جديرة بالإنصات.","action":"إن استمر الحزن وأثّر في يومك، تحدث مع شخص تثق به أو مختص يمكنه الإنصات.","alert":null,"id":"s7","pains":["أحزن ولا أعرف لماذا","أجد صعوبة في شرح شعوري","أخشى ألا يفهمني أحد"],"warm":"أحيانًا يأتي الحزن بلا اسم واضح. عدم قدرتك على شرحه لا يجعله أقل حقيقة.","closing":"لا تحتاج إلى تفسير كامل كي تستحق اللطف والمساعدة.","theme":"sadness","verseKeys":[],"verseScope":"لا شاهد مباشر","isRisk":false,"painGuidance":["قد يحزن القلب دون سبب تعرفه؛ لا تلزمه بتفسير جاهز، وإذا استمر الألم وعرقل حياتك فاطلب دعماً مناسباً.","بعض المشاعر يصعب وصفها؛ يكفي أن تقول لمن تثق به إنك لست بخير دون شرح كامل.","ليس مطلوباً من الجميع فهمك فوراً؛ اختر شخصاً يحسن الاستماع أو مختصاً عند الحاجة."]},{"feeling":"خوف وتهديد","label":"خوف من المستقبل","chapter":8,"opening":"قد يبدو الغد كأنه يحمل أسئلة أكثر من الإجابات. والمجهول حين نحدق فيه طويلاً يكبر حتى يغطّي ما نعرفه اليوم.","action":"اكتب أمرًا واحدًا يمكنك الاستعداد له الآن، واترك ما لا دليل على وقوعه في دائرة الاحتمال.","alert":null,"id":"s8","pains":["أتخيل احتمالات سيئة للمستقبل","أخاف اتخاذ خطوة جديدة","أشعر أن الغد خارج قدرتي"],"warm":"الغد لم يأت بعد، وما يُخيفك منه ليس بالضرورة ما سيحدث. التوكل لا يلغي النظر في الأسباب.","closing":"لا تحمل يومك جميع أيامك القادمة.","theme":"future","verseKeys":["لقمان:٣٤"],"verseScope":"صلة موضوعية محددة","isRisk":false,"painGuidance":["الاحتمالات ليست أحداثاً وقعت؛ ميّز بين ما تستطيع الاستعداد له وما لا تملكه.","قد تخاف الخطوة الجديدة لأنها مجهولة؛ اجمع معلومة واحدة تقلل الغموض قبل القرار.","لا تستطيع التحكم في الغد كله؛ أعطِ الضرورات القريبة حقها دون استعجال جواب نهائي."]},{"feeling":"خوف وتهديد","label":"تهديد مباشر لسلامتي","chapter":1,"opening":"ليس الخوف هنا مجرد فكرة مزعجة؛ قد تكون سلامتك تحتاج إلى فعل عاجل. لا يطلب منك هذا الكتاب أن تواجه الخطر لتثبت قوتك.","action":"إذا كان الخطر حاضرًا، ابتعد إلى مكان آمن إن استطعت واتصل بالطوارئ المحلية أو بمن يستطيع حمايتك مباشرة.","alert":"خطر","id":"s9","pains":["أخشى أن يصل إليّ الأذى الآن","لا أعرف إلى أين أذهب بأمان","أخاف طلب النجدة"],"warm":"حين تكون السلامة مهددة، لا تحتاج إلى إثبات صبرك بالمواجهة. حاجتك الأولى هي الحماية.","closing":"سلامتك أسبق من إكمال أي قراءة.","theme":"safety","verseKeys":[],"verseScope":"السلامة مقدمة","isRisk":true,"painGuidance":["إذا كان الأذى قريباً الآن فاترك القراءة واطلب النجدة المحلية في مكان آمن.","إذا لم تعرف أين تذهب، اتصل بجهة طوارئ أو شخص موثوق يستطيع تحديد مكان حماية آمن.","الخوف من طلب النجدة لا يلغي حقك فيها؛ إن أمكن اطلب من شخص مأمون أن يتصل نيابة عنك."]},{"feeling":"خوف وتهديد","label":"أخاف ممن يعيش معي","chapter":10,"opening":"حين يصبح مكان الراحة سبباً للخوف، قد يتغير نومك وحديثك وثقتك بنفسك. الأذى ليس أمراً صغيراً لأنه وقع داخل البيت.","action":"اتصل بشخص أو جهة حماية مأمونة، وضع خطة خروج آمنة إذا خشيت تصاعد الأذى، ولا تواجه المعتدي وحدك.","alert":"خطر","id":"s10","pains":["أراقب تصرفاتي خوفًا من رد الفعل","لا أشعر بالأمان في البيت","أخاف ألا يصدقني أحد"],"warm":"الخوف من شخص قريب قد يكون شديدًا لأنه يقع في المكان الذي يفترض أن يمنح الأمان. لا يوجب القرب السكوت عن الأذى.","closing":"لا تُطالب بإثبات المحبة بتحمل الخطر.","theme":"injustice","verseKeys":[],"verseScope":"السلامة مقدمة","isRisk":true,"painGuidance":["مراقبة كل كلمة خوفاً من رد فعل الآخر مُنهكة؛ أولويتك سلامتك لا إثبات أنك محق أثناء الخطر.","حين لا يكون البيت آمناً، ابحث عن طريق مساعدة لا يعرّضك لمزيد من الأذى.","قد تخشى ألا يصدقك الآخرون؛ اختر جهة مختصة أو شخصاً أميناً واخبره بما تحتاجه للحماية."]},{"feeling":"خوف وتهديد","label":"أخاف أن يمرض من أحب","chapter":6,"opening":"قد يخيفك احتمال المرض حتى قبل أن تتضح الوقائع، لأن من تحبه عزيز عليك. ومحبتك لا تمنحك معرفة ما سيأتي.","action":"اسأل مقدم الرعاية عن الأمر المؤكد والخطوة الطبية التالية، وشارك ما تستطيع من دعم.","alert":null,"id":"s11","pains":["أخاف على صحة شخص عزيز","أخشى وصول خبر مؤلم","أشعر بالعجز عن مساعدته"],"warm":"خوفك على من تحب مفهوم، لكنه لا يمنحك معرفة بما سيحدث. تستطيع أن تعتني دون أن تملك كل النتائج.","closing":"رعايتك لها قيمة، حتى حين لا تملك جوابًا للمستقبل.","theme":"illness","verseKeys":[],"verseScope":"لا شاهد مباشر","isRisk":false,"painGuidance":["القلق على شخص عزيز قد يلازم يومك؛ ساعد في الرعاية الممكنة دون أن تتحمل مسؤولية النتيجة.","انتظار الخبر قد يرهقك؛ اتفق مع من يتابع حالته على طريقة موثوقة للحصول على المعلومات.","قد لا تستطيع تغيير المرض؛ اسأل المريض أو فريق رعايته عن مساعدة محددة تستطيع تقديمها."]},{"feeling":"خوف وتهديد","label":"أحد يهددني عبر الإنترنت","chapter":22,"opening":"قد تتحول شاشة صغيرة إلى مصدر خوف كبير حين يهددك أحد بالنشر أو الفضح أو المال. ليس مطلوباً منك أن تخوض الأمر وحدك.","action":"احتفظ بأدلة التهديد بأمان، ولا تدفع المال تحت الضغط، وتواصل مع جهة مختصة أو شخص مأمون بحسب سلامتك.","alert":"خطر","id":"s12","pains":["أخاف أن تُنشر معلومات عني","يطلب أحدهم مني مالًا بالتهديد","أشعر بالخجل من إخبار شخص"],"warm":"التهديد عبر الشاشة أذى حقيقي، والخجل الذي يريده المعتدي لا ينبغي أن يمنعك من طلب الحماية.","closing":"المسؤولية على من يهددك، لا على من يطلب النجدة.","theme":"blackmail","verseKeys":[],"verseScope":"السلامة مقدمة","isRisk":true,"painGuidance":["إذا خفت نشر معلوماتك فلا تدخل في مواجهة قد تزيد التهديد؛ احفظ الأدلة واطلب مساعدة أمنية موثوقة.","لا تدفع مالاً أو ترسل مزيداً من البيانات تحت ضغط التهديد دون استشارة جهة مختصة.","الابتزاز يستعمل الخجل لعزلك؛ اختيار شخص مأمون لإخباره خطوة حماية لا سبب للخزي."]},{"feeling":"خوف وتهديد","label":"أخشى نتيجة اختبار","chapter":12,"opening":"حين تربط قلبك بنتيجة واحدة، قد يبدو يوم الانتظار أطول مما يحتمل. لكن النتيجة لا تختصر ما بذلته ولا كل ما تستطيع تعلمه.","action":"راجع ما تستطيع الاستعداد له، ونظم وقتًا للراحة، واطلب شرح موضع التعثر بعد ظهور النتيجة.","alert":null,"id":"s13","pains":["أخشى الرسوب بعد جهدي","أنسى ما ذاكرت من القلق","أربط درجتي بقيمتي"],"warm":"قد تكون نتيجة الاختبار مهمة لدراستك، لكنها لا تقيس كل ما تعلمته ولا كل ما يمكنك تعلمه بعد ذلك.","closing":"درجتك لا تختصر ما فيك.","theme":"study","verseKeys":[],"verseScope":"لا شاهد مباشر","isRisk":false,"painGuidance":["إن كنت تخشى الرسوب بعد جهدك، راجع أولويات المذاكرة واترك مجالاً للنوم قبل الاختبار.","نسيان المعلومات تحت القلق شائع؛ جرّب التدريب على أسئلة قصيرة في ظروف هادئة.","درجتك تقيس أداءً في اختبار، لا مقدار قيمتك؛ اطلب شرحاً لما لم تفهمه."]},{"feeling":"خوف وتهديد","label":"أخاف من خبر سيصلني","chapter":9,"opening":"قد يصبح صوت الهاتف أو ظهور إشعار سبباً لانقباض قلبك. الانتظار بين احتمالين مرهق، حتى عندما لا يقع شيء بعد.","action":"حدد وقتًا معقولًا للتحقق من الأخبار ومصدرًا موثوقًا، واطلب صحبة إن اشتد عليك الانتظار.","alert":null,"id":"s14","pains":["أراقب الهاتف في خوف","أتخيل أخبارًا سيئة","لا أقدر على الانتظار وحدي"],"warm":"انتظار خبر مجهول قد يجعل القلب يتعامل مع الاحتمال كأنه واقع. لا يلزم أن تصدق كل فكرة يثيرها الخوف.","closing":"ليس كل ما تخشاه سيقع، وليس عليك أن تعرف الغيب.","theme":"future","verseKeys":[],"verseScope":"لا شاهد مباشر","isRisk":false,"painGuidance":["الخوف يجعل الهاتف مركز يومك؛ ضع مواعيد محددة للتحقق من الأخبار إن لم تكن هناك حالة طارئة.","الخيال قد يضيف تفاصيل لم تقع؛ عُد إلى المصدر الموثوق ولا تعامل الظن كخبر.","إن كان الانتظار يرهقك وحدك، أخبر شخصاً تثق به أنك تحتاج إلى وجوده."]},{"feeling":"قلق وضغط","label":"لا يتوقف التفكير في رأسي","chapter":8,"opening":"قد تكون مرهقاً من التفكير نفسه؛ كلما هدأ سؤال ظهر بعده آخر. هذا التعب حقيقي، ولو لم يره أحد في وجهك.","action":"خفف المثيرات التي تستطيع ضبطها، واطلب تقييماً متخصصًا إذا أصبح التفكير مستمرًا ومُعطِّلًا.","alert":null,"id":"s15","pains":["تتكرر الأفكار رغم محاولتي إيقافها","تمنعني الأفكار من النوم","أعجز عن التركيز في يومي"],"warm":"انشغال الذهن لا يعني أنك ضعيف. وقد تحتاج إلى مساعدة حين تستمر الأفكار وتؤثر في النوم والعمل.","closing":"لا يجب أن تحسم كل فكرة لتستحق الراحة.","theme":"worry","verseKeys":[],"verseScope":"لا شاهد مباشر","isRisk":false,"painGuidance":["الأفكار المتكررة مرهقة؛ اكتب ما تستطيع اتخاذ إجراء بشأنه، وأجّل الباقي إن أمكن.","إذا منعك التفكير من النوم مراراً، فاستشارة مختص قد تعينك مع تحسين عادات النوم.","إذا عرقل التفكير يومك ودراستك أو عملك، لا تكتفِ بلوم نفسك؛ اطلب تقييماً ودعماً."]},{"feeling":"قلق وضغط","label":"انتظار جواب مهم","chapter":8,"opening":"ليس الانتظار فراغاً؛ فيه محاولات متكررة للاتصال والتخيل والحساب. وربما تتعب من سؤال نفسك متى ينتهي.","action":"حدد وقت متابعة مناسبًا إذا كان ذلك ممكنًا، ثم انتقل إلى أمر آخر تقدر عليه.","alert":null,"id":"s16","pains":["أتعب من الانتظار بلا موعد واضح","أفحص الرسائل مرارًا","أخشى أن أُرفض بعد الأمل"],"warm":"غياب الجواب قد يتركك معلقًا. لكن تأخر رسالة لا يكفي للحكم على النتيجة ولا على مكانتك.","closing":"ليس عليك أن تقضي اليوم كله أمام باب لم يُفتح بعد.","theme":"uncertainty","verseKeys":[],"verseScope":"لا شاهد مباشر","isRisk":false,"painGuidance":["التأخر دون موعد واضح متعب؛ حاول معرفة قناة متابعة رسمية وتوقيت معقول للتواصل.","تفقد الرسائل باستمرار يزيد الإنهاك؛ حدد أوقاتاً قليلة للمراجعة إن أمكن.","الرفض احتمال وليس يقيناً؛ استعد لخيارات أخرى دون الحكم مسبقاً على النتيجة."]},{"feeling":"قلق وضغط","label":"مسؤوليات كثيرة في الوقت نفسه","chapter":14,"opening":"حين يحتاجك أكثر من شخص وأكثر من أمر، قد تشعر أنه لا يحق لك أن تتعب. لكنك إنسان محدود الطاقة مهما صدقت نيتك.","action":"اختر مسؤولية واحدة يمكن مشاركتها اليوم، وحدد ما لا يحتمل التأخير وما يمكن تأجيله.","alert":null,"id":"s17","pains":["أحمل مسؤوليات أكثر مما أطيق","لا أجد من يشاركني الحمل","أشعر بالذنب حين أرتاح"],"warm":"كثرة ما يُطلب منك قد تُنسيك أن للقدرة حدًا. طلب العون ليس فشلًا في المحبة أو الواجب.","closing":"الراحة جزء من القدرة على المواصلة، لا نقيض لها.","theme":"capacity","verseKeys":[],"verseScope":"لا شاهد مباشر","isRisk":false,"painGuidance":["قد يكون الحمل أكبر من قدرة شخص واحد؛ اكتب أكثر مسؤوليتين إلحاحاً واطلب مشاركة واضحة.","قلة المشاركة ليست عيباً فيك؛ تحدث إلى من يمكنه تحمل جزء محدد من العمل.","الراحة حاجة تحفظ قدرتك على المسؤولية؛ لا تجعل الشعور بالذنب يحرمك منها."]},{"feeling":"قلق وضغط","label":"ضغوط العمل","chapter":3,"opening":"قد تعود من العمل وجسدك في البيت وذهنك لا يزال عند مهام الغد. لا يلزم أن تثبت إخلاصك بإلغاء كل ساعة راحة.","action":"دوّن ما يُطلب منك ومواعيده، واطلب ترتيب الأولويات أو دعمًا مناسبًا إذا أمكن.","alert":null,"id":"s18","pains":["أخشى أن أفقد عملي","أتعرض لضغط غير عادل","لا أجد وقتًا لنفسي"],"warm":"ليس كل ضغط في العمل دليلًا على ضعفك؛ بعضه يرتبط بمهام أو ظروف تحتاج إلى تنظيم أو إنصاف.","closing":"قيمة الإنسان لا تساوي عدد الساعات التي أنهكته.","theme":"work","verseKeys":[],"verseScope":"لا استشهاد قبل الأمان","isRisk":false,"painGuidance":["إذا خشيت فقدان العمل، راجع المعلومات الرسمية واحتفظ بمستنداتك قبل بناء قرار على الشائعات.","الضغط غير العادل يحتاج توثيقاً وتواصلاً مهنياً مناسباً؛ ليس عليك تحمله بصمت دائماً.","إذا لم يبقَ وقت لحياتك خارج العمل، حدّد حدوداً قابلة للتطبيق واطلب دعماً عند الحاجة."]},{"feeling":"قلق وضغط","label":"قلق من التزامات مالية","chapter":4,"opening":"قد لا ينقصك الجهد، لكن الأرقام تلاحقك في الليل. ليست كل المخاوف سواء؛ بعضها يحتاج خطة وبعضها يحتاج حقاً لدى طرف آخر.","action":"احصر ضرورياتك والمبالغ والمواعيد، واطلب ترتيبًا واقعيًا أو إنظارًا عند العسر.","alert":null,"id":"s19","pains":["أخاف موعد السداد","لا تكفيني ضروريات البيت","لا أعرف كيف أشرح ضيقي للدائن"],"warm":"الالتزام المالي ليس مجرد أرقام؛ قد يمس الطعام والسكن والراحة. ابدأ بالحقيقة كما هي، لا بوعد لا تستطيع الوفاء به.","closing":"لا يُعالج ضيق المال بإهانة صاحبه.","theme":"debt","verseKeys":[],"verseScope":"لا شاهد مباشر","isRisk":false,"painGuidance":["مواعيد السداد قد تُخيفك؛ دوّن الالتزامات الحقيقية وما تستطيع دفعه دون مساس بالضروريات.","إذا لم تكفِك ضروريات البيت، فالأولوية للغذاء والسكن والدواء وطلب المعونة المتاحة.","قد يصعب شرح العسر؛ اجمع الأرقام والمستندات واطلب ترتيباً واقعياً بلغة واضحة."]},{"feeling":"قلق وضغط","label":"أخشى أن أفقد السيطرة على حياتي","chapter":18,"opening":"حين تتزاحم الأحداث قد تشعر أنك تتحرك بلا اختيار. لكن بعض القرارات الصغيرة ما زالت تستحق أن تُرى بوضوح.","action":"اختر أمرًا مؤكدًا واحدًا وتحقق من خطوة تخصه، واستشر صاحب خبرة عند القرار المهم.","alert":null,"id":"s20","pains":["أشعر أن كل شيء يخرج عن يدي","أتخذ قرارات بدافع الخوف","لا أعرف أول أمر أعالجه"],"warm":"قد تتشابك الأمور حتى يبدو كل شيء عاجلًا. تقسيمها لا يحلها فورًا لكنه يساعدك على رؤية ما تملك.","closing":"يكفيك أن تبدأ من الموضع الذي تقدر عليه.","theme":"decision","verseKeys":[],"verseScope":"لا شاهد مباشر","isRisk":false,"painGuidance":["إذا شعرت أن الأمور تنفلت، ابدأ بما يقع تحت يدك اليوم، ولو كان مجرد جمع معلومة.","القرار تحت الخوف قد يُتعبك؛ اترك وقتاً للمشاورة حين لا توجد ضرورة عاجلة.","لا يلزم حل المشكلات كلها دفعة واحدة؛ اختر ما يهدد سلامتك أو حقاً قريباً أولاً."]},{"feeling":"قلق وضغط","label":"لا أعرف سبب انقباض صدري","chapter":6,"opening":"قد يضيق صدرك وأنت لا تعرف هل السبب تعب أم خوف أم أمر صحي. لا تفترض تفسيراً نفسياً لكل إحساس جسدي.","action":"إن ظهرت علامات خطر جسدي فاطلب إسعافًا، وإلا فرتب تقييمًا طبيًا إذا استمر العرض أو أقلقك.","alert":null,"id":"s21","pains":["أشعر بانقباض لا أفهمه","أخاف أن يكون الأمر مرضًا","يزداد ضيقي في أوقات معينة"],"warm":"انقباض الصدر قد تكون له أسباب مختلفة؛ لا يُشخَّص من كتاب. وإذا صحبه ألم شديد أو ضيق نفس مفاجئ فالمساعدة الطبية العاجلة أولى.","closing":"ألمك يستحق الفهم، لا مجرد أن يقال لك: تجاهله.","theme":"illness","verseKeys":[],"verseScope":"السلامة مقدمة","isRisk":true,"painGuidance":["انقباض الصدر لا يمكن تفسيره من قراءة؛ إذا صاحبه ألم شديد أو ضيق نفس مفاجئ فاطلب الإسعاف.","الخوف من المرض لا يثبت المرض ولا ينفيه؛ اطلب تقييماً طبياً مناسباً للأعراض.","تسجيل وقت حدوث الضيق وما يصاحبه قد يفيد الطبيب؛ لا تفترض سبباً نفسياً قبل الفحص."]},{"feeling":"رزق ومعيشة","label":"ديون تراكمت عليّ","chapter":4,"opening":"قد يصير موعد السداد أثقل من الرقم نفسه. تظل تفكر في الهاتف والحديث مع الدائن وما ستقوله لأهلك.","action":"اكتب أصل الدين والمواعيد والضروريات، ثم تفاوض على ترتيب ممكن أو اطلب مشورة مناسبة.","alert":null,"id":"s22","pains":["لا أستطيع سداد ما حلّ","أخشى مواجهة الدائن","أشعر أن الدين جرّدني من راحتي"],"warm":"المدين المعسر يحتاج إلى صدق وترتيب، ويحتاج كذلك إلى من يراعي عسره؛ فلا تُحمّل نفسك مالًا لا تملكه.","closing":"حفظ الحقوق لا يعني سحق من عجز حقًا.","theme":"debt","verseKeys":["البقرة:٢٨٠"],"verseScope":"صلة موضوعية محددة","isRisk":false,"painGuidance":["إذا عجزت عن السداد فاجمع بيان الديون والضروريات واطلب إنظاراً أو تسوية ممكنة.","قد تخشى مواجهة الدائن؛ حضّر ما تستطيع قوله مع معلومات دقيقة عن قدرتك الحالية.","الدين يضغط على الراحة والكرامة؛ تحدث إلى مختص أو جهة دعم إن صار العبء لا يُحتمل."]},{"feeling":"رزق ومعيشة","label":"لا أجد عملاً","chapter":3,"opening":"بعد محاولات كثيرة ربما صار السؤال ليس أين الوظيفة فقط، بل لماذا لا أُختار؟ لكن عدم التوظيف ليس حكماً كاملاً على قدرك.","action":"راجع شروط فرص محددة وطريقة تقديمك، واطلب رأيًا عمليًا في ملفك أو مقابلتك.","alert":null,"id":"s23","pains":["أقدم ولا يصلني رد","أشعر بالرفض بعد كل مقابلة","لا أعرف أي فرصة تناسبني"],"warm":"رفض الوظيفة خبر عن فرصة محددة، لا حكم نهائي على قدر الإنسان.","closing":"ما زال فيك ما يتجاوز جواب بريد واحد.","theme":"job","verseKeys":["القصص:٢٤"],"verseScope":"صلة موضوعية محددة","isRisk":false,"painGuidance":["حين تتكرر الطلبات بلا رد، جرّب مراجعة ملاءمة السيرة للوظائف بدلاً من تكرار التقديم نفسه.","الرفض بعد مقابلة يؤلم؛ يمكنك طلب تغذية راجعة عندما تسمح الجهة بذلك.","إن لم تعرف المجال المناسب، قارن بين مهاراتك وشروط فرص محددة بدل الحكم على نفسك عموماً."]},{"feeling":"رزق ومعيشة","label":"لا أجد طعاماً كافياً","chapter":2,"opening":"حين تكون المائدة خالية، فالحديث الجميل وحده لا يكفي. حاجتك إلى الطعام حاجة عاجلة تستحق العون لا العتب.","action":"اطلب طعامًا وماءً من خدمة موثوقة أو شخص مأمون اليوم، وقدّم الضروريات على أي خطة بعيدة.","alert":"عاجل","id":"s24","pains":["لا يكفي الطعام لمن أعول","أخجل من طلب طعام","لا أعرف أين أجد معونة قريبة"],"warm":"الحاجة إلى الطعام حاجة عاجلة لا ينبغي تحويلها إلى درس في الصبر وحده. ولمن يستطيع المساعدة دور في إعانة المحتاج.","closing":"حاجتك إلى وجبة لا تنقص من كرامتك.","theme":"food","verseKeys":[],"verseScope":"السلامة مقدمة","isRisk":true,"painGuidance":["إذا لم يكفِ الطعام لمن تعول، فاطلب إعانة غذائية موثوقة فوراً؛ الضرورة لا تنتظر القراءة.","طلب الطعام عند الحاجة ليس عيباً؛ تواصل مع جهة اجتماعية أو شخص مأمون يستطيع المساعدة.","إذا كنت لا تعرف أين تجد الطعام، اطلب من خدمات المساعدة المحلية أو شخص موثوق تحديد أقرب جهة."]},{"feeling":"رزق ومعيشة","label":"مشروعي يتعثر","chapter":17,"opening":"في المشروع مال ووقت وأمل وضعته قطعة من نفسك. وقد يؤلمك اعترافك بالخسارة أكثر من الخسارة نفسها.","action":"راجع التدفق النقدي والالتزامات مع مختص أو صاحب خبرة، وحدد قرارًا يحمي الحقوق قبل ضخ مال إضافي.","alert":null,"id":"s25","pains":["أخاف أن أخسر المال الذي وضعته","أشعر أنني خذلت من اعتمد عليّ","لا أعرف إن كان الاستمرار صحيحًا"],"warm":"تعثر المشروع لا يمحو الجهد المبذول فيه، لكنه يحتاج إلى حساب واضح لا إلى أمل وحده.","closing":"تغيير الخطة ليس خيانة للحلم.","theme":"business","verseKeys":[],"verseScope":"عام في المعنى","isRisk":false,"painGuidance":["الخوف على مال المشروع مفهوم؛ راجع السيولة والالتزامات قبل ضخ أموال جديدة.","قد يؤلمك اعتماد الآخرين عليك؛ تحدث إليهم بصدق عما تستطيع الوفاء به وما يحتاج مراجعة.","الاستمرار ليس دائماً شجاعة ولا التوقف فشلاً؛ قارن الأرقام والبدائل مع مختص إن أمكن."]},{"feeling":"رزق ومعيشة","label":"أخشى أن أفقد مسكني","chapter":5,"opening":"لا يكون البيت مجرد جدران حين يصبح بقاؤك فيه موضع قلق. قد تنام وأنت تتخيل أين ستذهب إن تعقد الأمر.","action":"إذا لم يكن لديك مأوى آمن الليلة فتواصل مع جهة إسكان أو إغاثة أو شخص مأمون، وتحقق من الحقوق المرتبطة بعقدك.","alert":"عاجل","id":"s26","pains":["أخاف فقدان سقف آمن","لا أعرف أين أذهب الليلة","أخشى على أسرتي من الإخلاء"],"warm":"المأوى حاجة أساسية، ولا تصبح أقل أهمية لأن البحث عنه معقد أو محرج.","closing":"من حقك أن تبحث عن مكان تنام فيه بأمان.","theme":"shelter","verseKeys":[],"verseScope":"السلامة مقدمة","isRisk":true,"painGuidance":["إذا خشيت فقدان مكان آمن، اجمع معلومات الإخلاء والحقوق من جهة موثوقة دون تأخير الحماية.","إذا لم تجد مأوى الليلة، فالأولوية لخدمة إيواء أو شخص مأمون لا لخطة طويلة.","إذا هدد الإخلاء أسرتك، فافحص الخيارات العاجلة واطلب عوناً قانونياً أو اجتماعياً مناسباً."]},{"feeling":"رزق ومعيشة","label":"راتبي أو حقي المالي متأخر","chapter":16,"opening":"حين تتأخر مستحقاتك لا تتأخر معها حاجات البيت. قد تحتاج إلى المطالبة بحقك أكثر مما تحتاج إلى نصيحة بالصبر.","action":"احتفظ بعقدك وسجلات الاستحقاق والتواصل، واطلب حقك عبر المسار المناسب في بلدك.","alert":null,"id":"s27","pains":["تأخر راتبي وأثقلني الانتظار","أخشى أن أطالب بحقي","تراكمت التزاماتي بسبب التأخير"],"warm":"تأخر الأجر قد يؤثر في أسرة كاملة. وليس طلب المستحقات طمعًا أو سوء خلق.","closing":"الإنصاف لا يتطلب الصمت عن حق ثابت.","theme":"rights","verseKeys":["النساء:١٣٥"],"verseScope":"عام في المعنى","isRisk":false,"painGuidance":["تأخر الراتب قد يربك ضروريات الحياة؛ احتفظ بسجل الاستحقاق وتواريخ المطالبة.","الخوف من المطالبة مفهوم؛ راجع القنوات الرسمية واحتفظ بنسخ التواصل.","حين تتراكم الالتزامات بسبب التأخير، وثّق أثره وتواصل مع الجهات المناسبة لطلب حقك."]},{"feeling":"رزق ومعيشة","label":"معاملة تمنعني من حقي","chapter":20,"opening":"قد تقف ورقة واحدة بينك وبين أمر لا يحتمل التأخير. وتكرار المراجعة دون إجابة قد يستهلك أعصابك ووقتك.","action":"حدد الوثيقة الناقصة والمهلة والجهة المسؤولة، واطلب تفسيرًا مكتوبًا للمتطلبات إن أمكن.","alert":null,"id":"s28","pains":["أوقفتني ورقة أو إجراء","أعجز عن معرفة الجهة الصحيحة","أخشى ضياع مهلة المطالبة"],"warm":"تعطّل ورقة لا يعني أن حقك أقل استحقاقًا. قد تكون المشكلة في الإجراء لا فيك.","closing":"أنت أكثر من رقم معاملة متأخرة.","theme":"documents","verseKeys":[],"verseScope":"لا شاهد مباشر","isRisk":false,"painGuidance":["الورقة المفقودة قد توقف حقاً مهماً؛ حدد اسم المستند وطريقة استخراج بدل فاقد.","إذا جهلت الجهة المختصة، اسأل عبر قناة رسمية واحفظ رقم الاستفسار.","إن كانت هناك مهلة قريبة، تحقق منها واطلب إثباتاً للمراجعة أو التقديم دون تأخير."]},{"feeling":"ألم وصحة","label":"أشعر بألم أو مرض","chapter":6,"opening":"الألم لا يقاس بما يبدو على الوجه وحده. وربما أتعبك أن تشرح مراراً ما تشعر به ولا تجد من يفهمه.","action":"اطلب تقييمًا طبيًا مناسبًا، ودوّن الأعراض والتغيرات التي تحتاج إلى مناقشتها مع الطبيب.","alert":null,"id":"s29","pains":["لا يصدق الآخرون مقدار ألمي","أخشى سبب المرض","تعبت من كثرة المواعيد"],"warm":"الألم الذي لا يراه غيرك قد يكون شديدًا في حياتك. لا يجب أن تثبت وجعك بالمبالغة.","closing":"طلب الرعاية لا ينقص من صبرك.","theme":"illness","verseKeys":["الأنبياء:٨٣"],"verseScope":"صلة موضوعية محددة","isRisk":false,"painGuidance":["عدم تصديق ألمك يزيد عليك المرض؛ صف الأعراض للطبيب بوضوح واطلب أن تُسجّل.","الخوف من سبب الألم يحتاج تقييماً لا تخميناً؛ اذكر الأعراض وعلامات الخطر للطبيب.","كثرة المواعيد مرهقة؛ اطلب جدول متابعة واضحاً ومساعدة عملية في التنقل عند الحاجة."]},{"feeling":"ألم وصحة","label":"أعيش مع مرض طويل","chapter":6,"opening":"حين يطول المرض قد يتعبك تكرار المواعيد والانتظار، وربما تتمنى يوماً لا تُعرَّف فيه بما يؤلمك.","action":"راجع خطة الرعاية مع الفريق المعالج، واطلب دعمًا للأعراض والحاجات اليومية.","alert":null,"id":"s30","pains":["أتعبني طول المرض","أخاف ألا أتحسن","أشعر أن حياتي توقفت عند العلاج"],"warm":"المرض الطويل قد يغير إيقاع الأيام، لكنه لا يسلب صاحبَه حقه في الأمل والكرامة والمعونة.","closing":"لست مطالبًا بأن تبدو قويًا في كل موعد.","theme":"illness","verseKeys":["الأنبياء:٨٣"],"verseScope":"صلة موضوعية محددة","isRisk":false,"painGuidance":["المرض الطويل قد يستنزف جسدك وروحك؛ اطلب مراجعة خطة العلاج وخدمات الدعم المتاحة.","الخوف من عدم التحسن ثقيل؛ تحدث مع المعالج عن الأهداف الواقعية ومؤشرات المتابعة.","إذا شعرت أن الحياة صارت مواعيد علاج فقط، ابحث عن نشاط آمن يظل جزءاً منك."]},{"feeling":"ألم وصحة","label":"أعتني بمريض أحبه","chapter":14,"opening":"قد تحاول أن تسبق الألم عن شخص تحبه، وتتعب في صمت لأنك تخشى أن يُفهم تعبك على أنه قلة محبة.","action":"حدد مهمة رعاية يمكن مشاركتها، ورتب معونة مأمونة إذا احتجت إلى الراحة.","alert":null,"id":"s31","pains":["أخشى على من أرعاه","لا أجد من يساعدني في الرعاية","أشعر بالذنب إن احتجت للراحة"],"warm":"العناية بالمريض محبة وعمل، لكنها لا تجعل جسد من يرعاه غير قابل للتعب.","closing":"استراحتك لا تنفي محبتك.","theme":"care","verseKeys":["المائدة:٢"],"verseScope":"صلة موضوعية محددة","isRisk":false,"painGuidance":["الخوف على المريض طبيعي؛ اسأل فريق الرعاية عما يستدعي المتابعة العاجلة.","إذا غاب من يعينك في الرعاية، اطلب من المقربين مهام محددة لا وعوداً عامة.","حاجتك للراحة لا تنفي محبتك؛ خطط لمناوبة أو استراحة آمنة إن تيسر."]},{"feeling":"ألم وصحة","label":"هناك عائق يمنعني من الوصول","chapter":7,"opening":"قد يكون العائق في باب أو وسيلة أو خدمة لا تلائم احتياجك. أنت لست أقل استحقاقاً لأن الطريق لم يُهيَّأ لك.","action":"صف حاجز الوصول بدقة، واطلب وسيلة إتاحة مناسبة من الجهة المسؤولة.","alert":null,"id":"s32","pains":["مدخل أو خدمة يمنعان وصولي","أحتاج إلى وسيلة أو تهيئة","تعبت من تبرير حاجتي"],"warm":"حين تمنعك بيئة غير مهيأة، لا ينبغي أن يُختزل الأمر في ضعف قدرتك الشخصية.","closing":"من حقك الوصول دون أن تثبت استحقاقك مرارًا.","theme":"access","verseKeys":[],"verseScope":"عام في المعنى","isRisk":false,"painGuidance":["إذا منعك مدخل أو خدمة من الوصول، صف العائق بدقة واطلب التهيئة من المسؤول.","طلب وسيلة مساعدة حق عملي؛ اسأل عن البدائل المتاحة والجهة المسؤولة.","تكرار تبرير حاجتك مُنهك؛ احتفظ بطلب واضح ومكتوب لتقليل الإعادة."]},{"feeling":"ألم وصحة","label":"أنتظر نتيجة طبية","chapter":6,"opening":"قد تكون ساعات الانتظار أثقل من الفحص نفسه. يذهب الذهن إلى احتمالات كثيرة، بينما لم تصلك الحقيقة بعد.","action":"دوّن أسئلتك للطبيب أو الجهة المختصة، ولا تغيّر علاجًا من تلقاء نفسك.","alert":null,"id":"s33","pains":["أخاف مما ستكشفه النتيجة","أراقب الأعراض قبل الموعد","لا أفهم تفسير الفحوصات"],"warm":"انتظار الفحص قد يملأ الفراغ بالاحتمالات، لكن الرقم الذي لم يصدر بعد لا يمكن الجزم به.","closing":"الانتظار متعب، ولا يلزم أن تواجهه وحدك.","theme":"illness","verseKeys":[],"verseScope":"لا شاهد مباشر","isRisk":false,"painGuidance":["الخوف من النتيجة مفهوم؛ حضّر أسئلتك للطبيب وانتظر القراءة المهنية للفحص.","إذا شغلك مراقبة الأعراض، دوّن ما يستحق إبلاغ الطبيب به دون تفسير ذاتي.","عدم فهم التقرير لا يعني أنك مقصر؛ اطلب شرح الأرقام والخيارات بلغة واضحة."]},{"feeling":"ألم وصحة","label":"أنا منهك جسدياً ونفسياً","chapter":14,"opening":"ربما تعبت حتى صار أبسط ما في اليوم يحتاج منك جهداً كبيراً. لا ينبغي أن تخفي هذه الحال لتبدو أقوى.","action":"إذا استمر التعب أو أثر في حياتك فاطلب تقييمًا صحيًا، وراجع ما يمكن تخفيفه من أعبائك.","alert":null,"id":"s34","pains":["أستيقظ وأنا متعب","لا يلاحظ أحد مقدار الإنهاك","لا أجد وقتًا للتعافي"],"warm":"التعب الجسدي والنفسي يحتاج إلى التفات، لا إلى مواعظ عن مزيد من الاحتمال.","closing":"من حقك أن تُعامل تعبك بجدية.","theme":"fatigue","verseKeys":[],"verseScope":"عام في المعنى","isRisk":false,"painGuidance":["إذا أصبحت تستيقظ منهكاً باستمرار، اطلب تقييماً صحياً عند الحاجة وراجع ظروف نومك.","قد لا يرى الآخرون تعبك؛ أخبر شخصاً موثوقاً بأثره على يومك واطلب مساعدة محددة.","إذا لم تجد وقتاً للتعافي، راجع توزيع المسؤوليات وخذ فترات راحة ممكنة."]},{"feeling":"علاقات وخذلان","label":"خصام مع شخص أحبه","chapter":13,"opening":"قد تخشى خسارة العلاقة وتخشى في الوقت نفسه أن تعود إلى الكلام الذي جرحك. ومن الصعب أن تحمل المحبة والألم معاً.","action":"اختر وقتًا هادئًا وحوارًا آمنًا إن كان ممكنًا، وحدد ما تريد قوله دون اتهامات.","alert":null,"id":"s35","pains":["أخاف أن نخسر علاقتنا","أُساء فَهم كلماتي","أتعب من تكرار الخلاف"],"warm":"الخصام بين الأحبة موجع لأنه يمس علاقة نرجو منها الأمان. لا تصح كل محاولة إصلاح في كل وقت.","closing":"الإصلاح يحتاج طرفين، وليس على أحدهما حمله وحده.","theme":"relationship","verseKeys":["الإسراء:٥٣"],"verseScope":"صلة موضوعية محددة","isRisk":false,"painGuidance":["الخوف على العلاقة قد يدفع إلى حديث متعجل؛ اختر وقتاً آمناً وهادئاً إن أمكن.","إذا أسيء فهم كلماتك، تحدث بأمثلة محددة واستمع إلى المعنى الذي وصل للطرف الآخر.","تكرار الخلاف مرهق؛ اتفق على حدود الحوار أو اطلب مساعدة أسرية مناسبة عند الحاجة."]},{"feeling":"علاقات وخذلان","label":"فراق أو انفصال","chapter":13,"opening":"قد ينتهي الاتفاق بين شخصين ولا تنتهي آثار القرب دفعة واحدة. لا تجعل الحنين وحده دليلاً على وجوب العودة.","action":"احترم حدود التواصل، واستعن بصحبة مأمونة وأجّل قرار العودة تحت ضغط الوحدة.","alert":null,"id":"s36","pains":["أشتاق رغم قرار الفراق","أشعر أنني لم أكن كافيًا","أخشى التقدم وحدي"],"warm":"قد يجتمع في الفراق الحنين والارتياح والحيرة. ولا يلزم أن يكون شعور واحد هو الصحيح دائمًا.","closing":"تستطيع الحزن على علاقة انتهت دون أن تضيع نفسك معها.","theme":"separation","verseKeys":[],"verseScope":"لا استشهاد قبل الأمان","isRisk":false,"painGuidance":["قد تشتاق رغم اقتناعك بالفراق؛ لا تجعل الاشتياق وحده يقرر العودة.","الشعور بأنك لم تكن كافياً مؤلم؛ افصل قيمتك عن نتيجة علاقة بعينها.","التقدم وحدك قد يبدو غريباً؛ أعد صلاتك بالناس والهوايات خطوة خطوة."]},{"feeling":"علاقات وخذلان","label":"خيانة ثقة","chapter":13,"opening":"من المؤلم أن يأتي الكسر من موضع كنت تظنه آمناً. وربما صرت تراجع كل كلمة وكل وعد مضى.","action":"تحقق من الوقائع، واحمِ حدودك وحقوقك، واستشر من تثق بحكمته إذا احتجت.","alert":null,"id":"s37","pains":["فقدت القدرة على الثقة","أكرر ما حدث في ذهني","أخاف أن أُخدع مرة أخرى"],"warm":"الخيانة تهز الثقة، لكنها لا تُوجب عليك قرارًا سريعًا بالصفح أو القطيعة.","closing":"الثقة لا تعود بالأوامر؛ تحتاج إلى صدق ووقت.","theme":"betrayal","verseKeys":["النساء:٥٨"],"verseScope":"عام في المعنى","isRisk":false,"painGuidance":["خيانة الثقة تترك أثراً؛ لا تستعجل منح الثقة من جديد قبل ظهور أفعال واضحة.","تكرار الحدث في ذهنك قد يرهقك؛ خصص وقتاً لحديث آمن أو دعم مناسب.","الخوف من الخداع لا يعني أن الجميع سيخدعك؛ ضع حدوداً واضحة وراقب الأفعال."]},{"feeling":"علاقات وخذلان","label":"قطيعة عائلية","chapter":13,"opening":"قد يطول الصمت بين الأقارب حتى تصبح المبادرة مخيفة. وربما تحبهم ولكنك تتألم من طريقة اللقاء.","action":"إن كان التواصل آمنًا، ابدأ برسالة قصيرة واضحة؛ وإن كان مؤذيًا فاستعن بوسيط مأمون.","alert":null,"id":"s38","pains":["أفتقد شخصًا من أهلي","تؤلمني كلمات قيلت في الخلاف","أخشى أن تعود القطيعة بعد إصلاحها"],"warm":"القطيعة العائلية ثقيلة، وقد يكون الإصلاح ممكناً وقد تحتاج بعض العلاقات إلى حدود تحمي أصحابها.","closing":"يمكن أن تطلب القرب وتضع حدودًا تحفظ كرامتك.","theme":"relationship","verseKeys":["الإسراء:٥٣"],"verseScope":"صلة موضوعية محددة","isRisk":false,"painGuidance":["افتقاد قريب بعد القطيعة موجع؛ يمكن بدء تواصل آمن مقتضب إن كان مناسباً.","الكلمات الجارحة لا تزول دائماً باعتذار واحد؛ يحتاج الإصلاح إلى اعتراف وتغير.","الخوف من تكرار القطيعة يدعوك إلى اتفاق واضح على طريقة التعامل مع الخلاف."]},{"feeling":"علاقات وخذلان","label":"أشعر أن أحداً لا يقدّرني","chapter":15,"opening":"تتعب حين تبذل كثيراً ولا تجد من ينتبه إليك. وقد يصعب عليك أن تطلب التقدير بصوت مسموع.","action":"عبّر عن حاجة محددة بوضوح لشخص يمكنه سماعك، ولا تجعل كل تقديرك لنفسك رهين رد واحد.","alert":null,"id":"s39","pains":["أعمل ولا أجد تقديرًا","أشعر أن الآخرين لا يسمعونني","أخاف أن أكون قليل القيمة"],"warm":"قلة التقدير من الناس موجعة، لكنها لا تملك وحدها تعريف قيمة حياتك.","closing":"قد لا يُرى بعض جهدك، لكنه ليس معدومًا.","theme":"loneliness","verseKeys":[],"verseScope":"لا استشهاد قبل الأمان","isRisk":false,"painGuidance":["إذا غاب تقدير جهدك، تحدث عن العمل والاحتياجات بصورة محددة مع المعنيين.","عدم الشعور بأن أحداً يسمعك متعب؛ اختر علاقة تستطيع أن تتبادل فيها الإصغاء.","شعور قلة القيمة ليس حقيقة ثابتة؛ لا تحصر نظرتك لنفسك في رأي شخص واحد."]},{"feeling":"علاقات وخذلان","label":"أخاف من رد فعل شخص قريب","chapter":10,"opening":"عندما تخشى غضب من تحب، قد تراجع كلماتك قبل أن تقولها وتعتذر حتى عما لم تفعله.","action":"اطلب مشورة آمنة من جهة حماية أو شخص موثوق قبل مواجهة قد تزيد الخطر.","alert":"خطر","id":"s40","pains":["أترقب غضب شخص قريب","أخاف عواقب الاختلاف معه","لا أشعر بالأمان حين أتكلم"],"warm":"الخوف من رد فعل قريب يجب أخذه بجدية، خصوصًا إذا اقترن بتهديد أو أذى.","closing":"لا يجوز أن تكون سلامتك ثمنًا لإرضاء أحد.","theme":"injustice","verseKeys":[],"verseScope":"السلامة مقدمة","isRisk":true,"painGuidance":["إذا كنت تترقب غضب شخص قريب، قيّم سلامتك قبل بدء المواجهة.","الخوف من عواقب الاختلاف يستدعي حدوداً آمنة ومساندة عند الحاجة.","إذا لم تكن تستطيع الكلام بأمان، لا تفرض الحوار الآن؛ اطلب حماية أو مشورة موثوقة."]},{"feeling":"ظلم وأذى","label":"أتعرض لظلم في العمل","chapter":16,"opening":"حين يُنكر جهدك أو حقك قد تشعر أن صوتك لا يصل. مطالبتك بالإنصاف ليست اعتراضاً على الصبر.","action":"وثّق الواقعة واحفظ المستندات واستفسر عن طريق الشكوى الآمن المناسب.","alert":null,"id":"s41","pains":["سُلب مني استحقاق في العمل","أتعرض لمعاملة غير عادلة","أخشى الاعتراض على الظلم"],"warm":"الظلم في العمل لا يزول لأن صاحبه صمت، ولا يعني أن قيمته المهنية نقصت.","closing":"طلب الإنصاف ليس قلة صبر.","theme":"rights","verseKeys":["النساء:١٣٥"],"verseScope":"عام في المعنى","isRisk":false,"painGuidance":["إذا سُلب منك استحقاق، اجمع الأدلة وحدد جهة الشكوى المناسبة.","المعاملة غير العادلة تؤذي؛ وثّق الوقائع واطلب مراجعتها دون تعريض نفسك لخطر غير محسوب.","قد يصعب الاعتراض في العمل؛ افهم الإجراءات والمواعيد واحفظ نسخة من مراسلاتك."]},{"feeling":"ظلم وأذى","label":"أتعرض لأذى داخل البيت","chapter":10,"opening":"قد يكون أصعب ما في الأذى أنه يأتي في مكان ينبغي أن يطمئنك. لا تحتاج إلى تسميته حباً حتى تتقبله.","action":"إذا كنت في خطر فاطلب نجدة عاجلة أو مكانًا آمنًا وتواصل مع خدمة حماية، واحذر أن تترك ما يكشف طلب المساعدة إذا كان ذلك يعرضك للخطر.","alert":"خطر","id":"s42","pains":["أخشى أذى داخل البيت","ليس لدي مكان آمن ألجأ إليه","أخاف أن يعرف المعتدي بطلب المساعدة"],"warm":"الأذى داخل البيت يحتاج إلى حماية فعلية، وليس إلى نصيحة بالمواجهة أو الصبر المجرد.","closing":"سلامتك وكرامتك أولاً.","theme":"injustice","verseKeys":[],"verseScope":"السلامة مقدمة","isRisk":true,"painGuidance":["إذا خشيت الأذى في البيت، فالأولوية للخروج إلى مكان آمن أو طلب النجدة.","إن لم يكن لديك مكان تلجأ إليه، اتصل بجهة حماية أو شخص مأمون يستطيع المساعدة.","إذا خفت اطلاع المعتدي على طلبك، استخدم وسيلة تواصل آمنة ولا تحتفظ بما يعرضك للخطر."]},{"feeling":"ظلم وأذى","label":"طفل يتعرض للإيذاء","chapter":11,"opening":"قد يعجز الطفل عن وصف ما يحدث، أو يخشى ألا يصدقه أحد. حقه في الحماية لا ينتظر أن تكون عباراته كاملة.","action":"أبعد الطفل عن مصدر الخطر إن أمكن بأمان، وأبلغ جهة حماية مختصة وفق إجراءات بلدك.","alert":"خطر","id":"s43","pains":["طفل لا يستطيع الدفاع عن نفسه","أخشى ألا يصدقه الكبار","أخاف أن يتكرر الأذى"],"warm":"الطفل لا يجب أن يُترك ليواجه الأذى أو ليصوغ شكوى كاملة حتى يصدقه الكبار.","closing":"مسؤولية الحماية تقع على الكبار والجهات المختصة.","theme":"child","verseKeys":[],"verseScope":"السلامة مقدمة","isRisk":true,"painGuidance":["الطفل لا يتحمل مسؤولية حماية نفسه وحده؛ أخبر جهة حماية مختصة إذا كان هناك خطر.","إن خشيت ألا يُصدَّق الطفل، استمع دون تلقين واحفظ سلامته واطلب تدخلاً مؤهلاً.","خوفك من تكرار الأذى سبب لاتخاذ حماية عاجلة لا للانتظار على أمل أن يتوقف وحده."]},{"feeling":"ظلم وأذى","label":"شخص يبتزني أو يهددني","chapter":22,"opening":"يستغل المهدد خوفك من الناس حتى تشعر أن لا خيار أمامك. لك حق في الحماية والخصوصية.","action":"احفظ الأدلة بأمان، وامتنع عن إرسال مزيد من المال أو المحتوى تحت الضغط، واطلب جهة حماية مختصة.","alert":"خطر","id":"s44","pains":["أخاف نشر شيء خاص بي","يطلب المعتدي مالًا أو فعلًا","أخشى إبلاغ أحد"],"warm":"الابتزاز يعتمد على الخوف والعزلة، وليس عليك أن تحلّه وحدك أو تدفع لتُثبت حسن نيتك.","closing":"العار ليس على من يستنجد؛ المسؤولية على المعتدي.","theme":"blackmail","verseKeys":[],"verseScope":"السلامة مقدمة","isRisk":true,"painGuidance":["الخوف من نشر أمر خاص قد يدفعك للعزلة؛ احفظ الأدلة دون مشاركتها واطلب مساعدة مأمونة.","إذا طلب المعتدي مالاً أو فعلاً، لا تتخذ قراراً تحت تهديده قبل استشارة جهة مختصة.","إبلاغ شخص موثوق عن الابتزاز خطوة شجاعة لحماية نفسك؛ الذنب على المعتدي."]},{"feeling":"ظلم وأذى","label":"سُلب مني حق أو استحقاق","chapter":20,"opening":"قد تتعب من إثبات أمر تراه واضحاً، ومن إعادة حكايته في كل مراجعة. التأخر لا يجعل الحق أقل أهمية.","action":"اجمع ما يثبت الحق والمواعيد وحدد الجهة المعنية بطلبك ثم تابع بطريق موثق.","alert":null,"id":"s45","pains":["تعطل حصولي على حق مالي","لا أعرف كيف أثبت حقي","تعبت من المراجعات المتكررة"],"warm":"قد يكون أشد ما في ضياع الحق طول الطريق إليه. ومن حقك أن تبحث عن إنصاف دون إذلال.","closing":"تأخر الإنصاف لا يجعل حقك أقل وضوحًا.","theme":"rights","verseKeys":["النساء:١٣٥"],"verseScope":"عام في المعنى","isRisk":false,"painGuidance":["إذا تعطّل حق مالي، اجمع ما يثبت الاستحقاق وتاريخ المطالبة.","إذا لم تعرف كيف تثبت حقك، اطلب إفادة مكتوبة بالقواعد والمستندات المطلوبة.","طول المراجعات مرهق؛ احتفظ بأرقام الطلبات وحدد موعد متابعة معقولاً."]},{"feeling":"ظلم وأذى","label":"تعرضت لسخرية أو تنمر","chapter":11,"opening":"قد تبقى كلمة جارحة في القلب أطول مما توقع صاحبها. ليس عليك أن تقبل الإهانة كي لا تثير مشكلة.","action":"تحدث إلى شخص مسؤول أو مأمون، ووثّق تكرار الأذى بحسب المكان وظروف السلامة.","alert":null,"id":"s46","pains":["تؤلمني كلمات السخرية","أخاف حضور المكان الذي أُهان فيه","أشعر أن الآخرين صدقوا الإهانة"],"warm":"السخرية ليست أمراً صغيرًا لمجرد أنها قيلت على هيئة مزاح، ولا يجب عليك احتمالها حتى لا تُتهم بالحساسية.","closing":"ما قاله الآخرون عليك لا يصير تعريفًا لك.","theme":"bullying","verseKeys":["الحجرات:١١"],"verseScope":"صلة موضوعية محددة","isRisk":false,"painGuidance":["الكلمات الساخرة تؤذي حتى إن قيل إنها مزاح؛ اطلب وقفها وحدد حدودك بأمان.","الخوف من المكان الذي أُهنت فيه مفهوم؛ أخبر المسؤولين واطلب بيئة أكثر أمناً.","تصديق الآخرين للإهانة لا يجعلها حقيقة؛ تواصل مع من يحسن سماعك أو جهة حماية."]},{"feeling":"ظلم وأذى","label":"اتهمني أحد بما لم أفعل","chapter":16,"opening":"من العسير أن تحاول الدفاع عن اسمك وأنت غاضب ومجروح. لكن الرد الأكثر نفعاً يحتاج إلى بيان لا إلى فوضى.","action":"اجمع ما يثبت الوقائع، واستشر شخصًا مؤهلاً بشأن طريقة الرد أو المطالبة بالإنصاف.","alert":null,"id":"s47","pains":["أخشى انتشار اتهام غير صحيح","لا يُتاح لي شرح موقفي","أتعرض لحكم مسبق"],"warm":"الاتهام الباطل قد يجرح السمعة قبل أن تُسمع الحقيقة. لا يلزم أن ترد على كل صوت بالطريقة نفسها.","closing":"العدل يحتاج إلى تثبت لا إلى ضجيج.","theme":"accusation","verseKeys":["النساء:١٣٥"],"verseScope":"عام في المعنى","isRisk":false,"painGuidance":["إذا انتشر اتهام غير صحيح، احتفظ بالأدلة ولا ترد بما يزيد الضرر.","إن لم يسمح لك بشرح موقفك، اطلب فرصة رسمية لتقديم الوقائع كتابةً.","الحكم المسبق مؤلم؛ ركز على الحقائق والمسار المنصف بدلاً من محاولة إرضاء الجميع."]},{"feeling":"وحدة وغربة","label":"أعيش بعيداً عن أهلي","chapter":19,"opening":"قد تكون بين الناس جميعاً وتشتاق إلى صوت واحد من بيتك الأول. والغربة ليست ضعفاً في التأقلم دائماً.","action":"رتب تواصلًا ثابتًا مع من تحب، وابحث عن صحبة أو خدمة محلية آمنة.","alert":null,"id":"s48","pains":["أشتاق إلى أهلي كل يوم","أشعر أنني غريب في المكان","أخاف ألا أجد من يساندني"],"warm":"البعد عن الأهل لا يُقاس بالكيلومترات وحدها؛ فقد يبدو كل شيء جديدًا حتى في يوم عادي.","closing":"يمكن للغربة أن تؤلمك دون أن تمنعك من بناء انتماء جديد.","theme":"exile","verseKeys":[],"verseScope":"عام في المعنى","isRisk":false,"painGuidance":["الاشتياق إلى الأهل قد يشتد كل يوم؛ رتب تواصلاً منتظماً يناسب ظروفكم.","إن شعرت بالغربة في المكان، ابحث عن صلة مأمونة أو نشاط يخفف العزلة.","إذا خشيت انعدام السند، كوّن قائمة بأشخاص وجهات يمكن الرجوع إليها عند الحاجة."]},{"feeling":"وحدة وغربة","label":"أشعر أنه لا أحد يسمعني","chapter":15,"opening":"قد تحمل كلاماً كثيراً ولا تجد الأذن التي تتسع له. لا يعني ذلك أن ما في قلبك قليل الأهمية.","action":"ابدأ بشخص واحد مأمون تستطيع أن تقول له بوضوح: أحتاج أن تسمعني قليلًا.","alert":null,"id":"s49","pains":["لا أجد من يسمعني دون حكم","أتحدث وأشعر أنني غير مفهوم","أخجل من طلب الصحبة"],"warm":"قد يكون أقسى ما في الوحدة أن تبقى كلماتك بلا مستمع. لا يعني ذلك أن حاجتك إلى الإنصات عيب.","closing":"حاجتك إلى الصلة إنسانية وليست ضعفًا.","theme":"loneliness","verseKeys":[],"verseScope":"لا استشهاد قبل الأمان","isRisk":false,"painGuidance":["قد تحتاج إلى شخص يسمع دون أن يصدر حكماً؛ اطلب ذلك بوضوح من شخص مأمون.","حين لا تشعر بأنك مفهوم، حاول وصف شعور واحد بدلاً من شرح القصة كاملة.","طلب الصحبة لا يعيبك؛ ابدأ بتواصل قصير مع شخص ترتاح إليه."]},{"feeling":"وحدة وغربة","label":"ابتعد عني شخص قريب","chapter":13,"opening":"قد يكون الشخص حياً وقريباً من الجميع، لكنك لم تعد تصل إليه كما كنت. لهذا الغياب وجع لا يظهر للآخرين.","action":"إذا كان التواصل آمنًا، أرسل سؤالًا واضحًا مرة واحدة ثم احترم الحدود والرد.","alert":null,"id":"s50","pains":["قلّ حديثنا بعد قرب طويل","أشتاق إلى صديق ابتعد","لا أعرف هل أصلح العلاقة"],"warm":"الابتعاد من غير وضوح يترك أسئلة كثيرة. قد يكون لك حق طلب تفسير، لكنك لا تملك إجبار الآخر على الاستجابة.","closing":"لا يختزل صمت شخص واحد مكانتك في العالم.","theme":"relationship","verseKeys":[],"verseScope":"لا استشهاد قبل الأمان","isRisk":false,"painGuidance":["قلّة الحديث بعد قرب طويل قد توجع؛ اسأل بلطف عن سبب البعد إن كان التواصل آمناً.","اشتياقك للصداقة لا يضمن رجوعها كما كانت؛ اترك مساحة للواقع ولحدود الطرفين.","قبل محاولة الإصلاح، اسأل نفسك هل العلاقة آمنة وممكنة، ثم اختر رسالة قصيرة إن رغبت."]},{"feeling":"وحدة وغربة","label":"الوحدة بعد وفاة قريب","chapter":9,"opening":"قد تفتقد شخصاً في الأوقات التي لم تكن تحتاج فيها إلى الاتصال به؛ كان يكفي أن تعرف أنه موجود.","action":"شارك ذكرى طيبة مع من تثق به، واطلب صحبة حين تثقل عليك الأيام.","alert":null,"id":"s51","pains":["أفتقد من مات في أوقات معينة","يزداد حزني في المناسبات","أشعر بالوحدة بعد الفقد"],"warm":"قد تأتي الوحدة بعد وفاة العزيز في التفاصيل الصغيرة، حتى إن كان حولك ناس كثيرون.","closing":"ليس المطلوب أن تمحو الذكرى لكي تواصل العيش.","theme":"death","verseKeys":["البقرة:١٥٦"],"verseScope":"صلة موضوعية محددة","isRisk":false,"painGuidance":["قد تشتد الذكرى في مكان معتاد؛ اسمح لنفسك بوقت هادئ أو صحبة في تلك اللحظة.","المناسبات قد تعيد الحزن بقوة؛ خطط لمن يساندك دون أن تُجبر على الحضور.","الوحدة بعد الوفاة قاسية؛ لا تجعل طلب القرب من الناس خيانة لذكرى من رحل."]},{"feeling":"وحدة وغربة","label":"أميل إلى العزلة ولا أعرف لماذا","chapter":15,"opening":"أحياناً تستريح إلى الصمت، وأحياناً تتحول العزلة إلى ثقل جديد. لا تحكم على نفسك قبل أن تفهم ما تحتاج إليه.","action":"إن أثرت العزلة في يومك، تحدث مع شخص تثق به أو مختص، وجرب تواصلًا صغيرًا يناسبك.","alert":null,"id":"s52","pains":["لا رغبة لي في لقاء الناس","أخشى أن ينفصل عني الجميع","لا أعرف لماذا أنعزل"],"warm":"قد تحتاج إلى هدوء، وقد تكون العزلة صارت مؤلمة. لا يمكن معرفة السبب من جملة واحدة.","closing":"لا تحتاج أن تصبح اجتماعيًا بين ليلة وضحاها.","theme":"loneliness","verseKeys":[],"verseScope":"لا استشهاد قبل الأمان","isRisk":false,"painGuidance":["قد تحتاج إلى عزلة مؤقتة، لكن استمرار الانسحاب الذي يعطل حياتك يستحق دعماً مناسباً.","إذا خشيت فقد الجميع، ابدأ بالتواصل مع شخص واحد تثق به.","إن لم تعرف سبب الانسحاب، لا تلصق بنفسك حكماً؛ تحدث مع مختص إذا طال أو اشتد."]},{"feeling":"ندم وذنب","label":"أخطأت وأريد التوبة","chapter":23,"opening":"قد يكون الذنب حاضراً في ذهنك حتى حين تحاول الانشغال عنه. باب الرجوع لا يحتاج إلى إهانة نفسك.","action":"اترك الخطأ ما استطعت، واستغفر الله، ورد حقوق من آذيت أو اطلب طريقة آمنة لإصلاحها.","alert":null,"id":"s53","pains":["أندم على فعل أعلمه خطأ","أخشى ألا يُغفر لي","أريد إصلاح ما أفسدت"],"warm":"الندم الصادق يمكن أن يكون بداية إصلاح، وليس حكمًا بأنك لا تستحق الرجاء.","closing":"باب الرجوع أوسع من بقاء المرء في جلد نفسه.","theme":"repentance","verseKeys":["الزمر:٥٣"],"verseScope":"صلة موضوعية محددة","isRisk":false,"painGuidance":["الندم قد يدل على رغبة في الإصلاح؛ ابدأ بترك الخطأ ورد الحق إن تعلّق بغيرك.","لا تجعل خوفك من عدم المغفرة يصدك عن التوبة؛ اقرأ النصوص الموثوقة في باب الرجاء.","إذا أردت إصلاح ما أفسدت، حدّد حقاً تستطيع رده أو ضرراً تستطيع إيقافه."]},{"feeling":"ندم وذنب","label":"أعود إلى عادة تؤذيني","chapter":21,"opening":"قد تعد نفسك ألا تعود ثم تتعثر، فتظن أن كل ما سبق ضاع. لكن فهم طريق العودة إلى السلوك جزء من طريق تغييره.","action":"حدد الموقف الذي يسبق العودة واطلب دعمًا متخصصًا إذا كانت العادة إدمانية أو تؤذي سلامتك.","alert":null,"id":"s54","pains":["أعود إلى سلوك لا أريده","أخجل من طلب المساعدة","أحبط كلما تكرر التعثر"],"warm":"تكرار عادة مؤذية يحتاج إلى فهم أسبابها وخطة مناسبة، لا إلى وصف نفسك بالفشل إلى الأبد.","closing":"التعثر يطلب إصلاح الخطة، لا احتقار النفس.","theme":"habit","verseKeys":[],"verseScope":"لا شاهد مباشر","isRisk":false,"painGuidance":["تكرار العادة قد يتطلب تغيير البيئة وخطة دعم، لا لوم النفس وحده.","الخجل من طلب العون قد يطيل الأذى؛ اختر شخصاً أو مختصاً مأموناً.","التعثر لا يلغي ما تعلمته؛ راجع سبب العودة وعدّل خطتك بدلاً من الحكم النهائي على نفسك."]},{"feeling":"ندم وذنب","label":"آذيت شخصاً بكلام أو فعل","chapter":23,"opening":"أحياناً يؤلمك أنك صرت سبباً لوجع إنسان آخر. الندم يصبح أنفع حين يقود إلى إصلاح لا إلى دوران دائم حول الذات.","action":"سمّ الضرر الذي سببته، واعتذر دون تبرير أو ضغط على الطرف الآخر، ورد الحقوق الممكنة.","alert":null,"id":"s55","pains":["أقلق لأنني جرحت أحدًا","لم أعد أعرف كيف أعتذر","أخشى ألا يقبل إصلاحي"],"warm":"حين يكون الخطأ قد مس غيرك، يصبح الرجاء مقرونًا بالاعتراف ورد الحق، لا بالكلمات وحدها.","closing":"اعتذارك ليس عقدًا يُلزم الآخر بمسامحتك.","theme":"repair","verseKeys":[],"verseScope":"لا شاهد مباشر","isRisk":false,"painGuidance":["إذا جرحت شخصاً، اعترف بما فعلت دون تبرير يضع العبء عليه.","الاعتذار الصادق يذكر الفعل وأثره، ويترك للمتضرر حرية الاستجابة.","قبول الإصلاح ليس حقاً تفرضه على الآخر؛ افعل الواجب وامنحه مساحته."]},{"feeling":"ندم وذنب","label":"ألوم نفسي على قرار قديم","chapter":18,"opening":"ترى الماضي الآن بمعلومات لم تكن كلها في يدك يوم اخترت. قد تتعلم مما حدث دون أن تبقى في محاكمة لا تنتهي.","action":"اكتب ما كنت تعرفه حينها وما تعرفه الآن، وحدد شيئًا واحدًا تستفيد منه في القرار المقبل.","alert":null,"id":"s56","pains":["ألوم نفسي على اختيار سابق","أتخيل حياة بديلة دائمًا","أخشى أن أكرر الخطأ"],"warm":"القرارات القديمة تُرى اليوم بمعلومات لم تكن كلها متاحة حين اتُّخذت. يمكنك التعلم دون محاكمة لا تنتهي.","closing":"لا يمكنك تعديل الأمس، لكنك تستطيع الرفق بمن كنت.","theme":"decision","verseKeys":[],"verseScope":"لا شاهد مباشر","isRisk":false,"painGuidance":["قد يكون القرار القديم مؤلماً؛ راجع ما كنت تعرفه وقتها لا ما عرفته بعد ذلك.","تخيل حياة أخرى لا يثبت أنها كانت ستكون أفضل؛ عد إلى ما يمكن تغييره اليوم.","الخوف من تكرار الخطأ يمكن تحويله إلى معايير قرار أو مشورة موثوقة."]},{"feeling":"ندم وذنب","label":"أخجل من تكرار الخطأ","chapter":21,"opening":"قد يشتد عليك الخجل حتى تتوقف عن طلب المساعدة. والخطأ الذي يتكرر يحتاج فهماً وخطة، لا إلى وصف نفسك بأقسى الكلمات.","action":"راجع ما يتسبب في التعثر، واطلب عونًا ملائمًا، ولا تتوقف عن إصلاح ما تقدر عليه.","alert":null,"id":"s57","pains":["أخجل من العودة إلى الخطأ","أشعر أنني لا أتقدم","أخاف أن يفقد الآخرون الثقة بي"],"warm":"قد يتكرر الخطأ ويحتاج إلى مقاومة ومساعدة، لكن تكراره لا يعني أن الرجوع الصادق بلا قيمة.","closing":"التوبة ليست مطالبة بالكمال من أول يوم.","theme":"habit","verseKeys":[],"verseScope":"لا شاهد مباشر","isRisk":false,"painGuidance":["إذا عاد الخطأ، لا تجعل الخجل يمنعك من الاعتراف وطلب العون.","المقارنة بالماضي قد تنسيك تحسناً جزئياً؛ راجع السلوك وما يزيد تكراره.","استعادة الثقة تحتاج زمناً وأفعالاً ثابتة؛ لا تطلب من الآخرين تصديق وعد بلا تغيير."]},{"feeling":"ندم وذنب","label":"أخشى أن لا تُقبل توبتي","chapter":23,"opening":"قد تتحول المحاسبة إلى يأس، فتنسى أن القرآن يفتح باب الرجاء ولا يطلب منك القنوط من الرحمة.","action":"استغفر بصدق، وأصلح المظالم إن وجدت، واستشر عالمًا موثوقًا إذا التبست عليك مسألة شرعية.","alert":null,"id":"s58","pains":["أخاف ألا تُقبل توبتي","أتذكر الذنب باستمرار","أظن أني لا أستحق الرحمة"],"warm":"الخوف من الذنب قد يفتح طريق التوبة، لكن اليأس ليس غاية هذا الطريق.","closing":"لا تجعل خوفك يمنعك من الرجوع إلى الله.","theme":"repentance","verseKeys":["الزمر:٥٣"],"verseScope":"صلة موضوعية محددة","isRisk":false,"painGuidance":["الخوف من عدم قبول التوبة لا يمنع الرجوع؛ استند إلى النصوص الثابتة وابتعد عن الوسواس.","استرجاع الذنب كل يوم قد يتحول إلى جلد للنفس؛ صحح الخطأ ثم اطلب دعماً إن لزم.","رحمة الله واسعة، والتوبة تقتضي إصلاح الممكن؛ لا تجعل الشعور بعدم الاستحقاق بابًا لليأس."]},{"feeling":"حيرة وضياع","label":"لا أعرف أي قرار أتخذ","chapter":18,"opening":"تبدو الطرق كثيرة، وكل طريق يحمل ما تخشى فقده. الحيرة ليست دائماً علامة ضعف؛ قد تكون لأن القرار مهم عندك.","action":"حدد خيارين واضحين، وما تعرفه وما ينقصك، واستشر من يفهم المسألة ثم قرر بقدر استطاعتك.","alert":null,"id":"s59","pains":["أخاف اختيار الطريق الخطأ","تضاربت آراء من حولي","لا أعرف أي معلومة أثق بها"],"warm":"الحيرة تعني أحيانًا أن القرار مهم، لا أنك عاجز عن الاختيار. والرأي الأفضل يحتاج إلى معلومات ومشاورة.","closing":"لا تستخرج حكمًا على حياتك كلها من قرار واحد.","theme":"decision","verseKeys":["آل عمران:١٥٩"],"verseScope":"صلة موضوعية محددة","isRisk":false,"painGuidance":["الخوف من القرار الخاطئ مفهوم؛ اكتب البدائل وما تعرفه عن نتائجها دون انتظار يقين كامل.","تضارب آراء الناس مرهق؛ اسأل أهل الخبرة في موضوع القرار وحدد معياراً واضحاً.","إذا اختلفت المعلومات، ابحث عن مصدر مباشر موثوق قبل الحسم."]},{"feeling":"حيرة وضياع","label":"تعثر تعليمي أو دراسي","chapter":12,"opening":"ربما بذلت جهداً ولم تشبهه النتيجة، فبدأت تنظر إلى نفسك من خلال درجة واحدة. لكنها لا تختصر قدرتك على التعلم.","action":"حدد الموضوع الذي يتوقف عنده فهمك واطلب شرحًا أو تقييمًا مناسبًا لطريقة تعلمك.","alert":null,"id":"s60","pains":["أذاكر ولا أفهم كما أريد","أخاف الرسوب رغم جهدي","لا أعرف سبب تعثري في التعلم"],"warm":"التعثر في التعلم لا يخبر وحده عن مقدار ذكائك أو اجتهادك. ربما تحتاج إلى طريقة أو وقت أو دعم مختلف.","closing":"التعلم طريق يتسع لسرعات مختلفة.","theme":"study","verseKeys":["طه:١١٤"],"verseScope":"صلة موضوعية محددة","isRisk":false,"painGuidance":["إن لم تفهم رغم المذاكرة، غيّر طريقة الشرح أو اسأل معلمك عن مثال أبسط.","الخوف من الرسوب لا يخبرك بما سيحدث؛ راجع ما تستطيع واطلب توجيهاً عند الحاجة.","قد يتصل التعثر بطريقة التعلم أو ظرفه؛ اطلب تقييماً تربوياً عندما تكون المشكلة مستمرة."]},{"feeling":"حيرة وضياع","label":"حلم لم يتحقق","chapter":17,"opening":"قد يكون للحلم مكان في حياتك حتى صار تعثره كأنه تعثر حياتك كلها. لكن الطريق يمكن أن يتغير دون أن تُمحى قيمتك.","action":"راجع ما يزال ممكنًا من الهدف وما تغير من ظروفك، واستشر من يعرف مجاله.","alert":null,"id":"s61","pains":["لم أصل إلى حلم طويل","أشعر أن سنواتي ضاعت","أخاف أن أحاول مرة أخرى"],"warm":"قد يؤلمك الحلم الذي لم يتحقق حتى لو كان في حياتك خير آخر. لا يلزم أن تُنكر الخيبة لتواصل.","closing":"يمكن أن يتغير شكل الطريق دون أن تُمحى قيمتك.","theme":"uncertainty","verseKeys":[],"verseScope":"لا شاهد مباشر","isRisk":false,"painGuidance":["قد يوجعك حلم طال انتظاره؛ لا تُقلّل من حجم الخيبة ولا تعتبرها نهاية الطريق.","الشعور بضياع السنوات مؤلم؛ ابحث عمّا تعلمته وما يزال متاحاً دون تزييف الخسارة.","الخوف من المحاولة بعد الخيبة مفهوم؛ فكّر في تجربة صغيرة قابلة للتوقف إن كانت مناسبة."]},{"feeling":"حيرة وضياع","label":"أشعر أن العمر يتقدم بلا معنى","chapter":25,"opening":"قد تنظر إلى السنوات الماضية وتحصي ما لم يحدث، فتنسى ما حملته وما أعطيته وما بقي ممكناً.","action":"اختر أمرًا ذا معنى تستطيع فعله هذا الأسبوع لشخص أو لنفسك، واطلب مساعدة إذا تحوّل اليأس إلى خطر.","alert":null,"id":"s62","pains":["أخشى أن العمر مرّ بلا أثر","أقارن حياتي بالآخرين","لا أعرف ما الذي يستحق وقتي"],"warm":"السؤال عن معنى العمر قد يظهر حين تتبدل الأدوار والطموحات. لا تقِس سنواتك كلّها بمقارنة واحدة.","closing":"لا تنتهي قيمة الحياة عند تعثر خطة قديمة.","theme":"meaning","verseKeys":["الملك:٢"],"verseScope":"عام في المعنى","isRisk":false,"painGuidance":["قد تخشى مرور العمر؛ اسأل عمّا يهمك أنت بعيداً عن مقاييس الشهرة.","مقارنة حياتك بالناس لا تكشف قصصهم كاملة؛ حدّد قيمة تريد أن تعيش بها.","إذا لم تعرف أين تضع وقتك، اختر علاقة أو عملاً نافعاً يناسب قدرتك الحالية."]},{"feeling":"حيرة وضياع","label":"أبحث عن عمل يناسبني","chapter":3,"opening":"قد تدفعك كثرة الآراء إلى طريق لا يشبه قدراتك. وما تحتاجه ليس قراراً يرضي الجميع بل فهماً لمهاراتك وظروفك.","action":"دوّن مهاراتك وشروطك الأساسية وقارن بينها وبين ثلاث فرص واقعية.","alert":null,"id":"s63","pains":["لا أعرف المجال الذي يلائمني","أخشى تغيير مساري المهني","أشعر أنني متأخر عن أقراني"],"warm":"اختيار العمل المناسب يحتاج إلى معرفة القدرات والظروف والفرص، وليس سباقًا مع الآخرين.","closing":"ليس مطلوبًا أن تتشابه سرعتك المهنية مع سرعة غيرك.","theme":"job","verseKeys":["القصص:٢٤"],"verseScope":"صلة موضوعية محددة","isRisk":false,"painGuidance":["إن احتَرْتَ في المجال، قارن ثلاثة أعمال حقيقية بمهاراتك وميولك وواقع الفرص.","تغيير المسار يحتاج معلومات لا حكماً على شجاعتك؛ تحدث مع أهل خبرة.","الإحساس بالتأخر عن الأقران لا يحدد موعد نجاحك؛ ضع خطة تناسب ظروفك."]},{"feeling":"حيرة وضياع","label":"لا أعرف من أين أبدأ","chapter":18,"opening":"حين تتشابك المشكلات يصعب تمييز أول خيط منها. لا تحتاج إلى حلها جميعاً حتى تبدأ.","action":"اختر حاجة أساسية واحدة، وتحقق من أقرب خطوة آمنة تخصها ثم اطلب معاونة عند اللزوم.","alert":null,"id":"s64","pains":["تداخلت الأولويات أمامي","لا أستطيع تحديد أول خطوة","أخشى أن أزيد المشكلة"],"warm":"حين تتكاثر الملفات في ذهنك قد تبدو البداية مستحيلة. لا يلزم أن تحلها جميعاً قبل أن تبدأ.","closing":"البداية الصغيرة الصحيحة خير من خطة واسعة مستحيلة.","theme":"decision","verseKeys":[],"verseScope":"لا شاهد مباشر","isRisk":false,"painGuidance":["حين تتداخل الأولويات، ابدأ بما يمس السلامة أو موعداً لا يحتمل التأجيل.","إذا غابت أول خطوة، اكتب ما يمكن فعله خلال يوم واحد دون محاولة حل الكل.","الخوف من زيادة المشكلة سبب للبحث عن معلومة أو مشورة قبل التصرف."]},{"feeling":"إرهاق وتعب","label":"أتعبتني رعاية من أحب","chapter":14,"opening":"قد تنام وأنت تفكر فيما نسيته، وتستيقظ إلى مسؤوليات تنتظرك. المحبة لا تلغي حق جسدك في الراحة.","action":"شارك مهمة رعاية محددة، واستفسر عن خدمات دعم مقدمي الرعاية حيث تعيش.","alert":null,"id":"s65","pains":["أتعبتني المواعيد والرعاية","لا يشاركني أحد المسؤولية","أخجل من حاجتي إلى الراحة"],"warm":"الاعتناء بمن تحب قد يستنزف القدرة بمرور الوقت. ومن الإنصاف أن تجد أنت أيضًا من يعينك.","closing":"الرفق بنفسك يساعدك على استمرار الرفق بغيرك.","theme":"care","verseKeys":["المائدة:٢"],"verseScope":"صلة موضوعية محددة","isRisk":false,"painGuidance":["المواعيد المتواصلة مرهقة؛ اطلب جدولاً واضحاً وتوزيعاً للمهام.","إذا لم يشاركك أحد، اطلب مهمة محددة مثل توصيل أو شراء دواء بدلاً من عون عام.","احتياجك إلى النوم لا يقلل حبك؛ نظم فترة راحة آمنة إن أمكن."]},{"feeling":"إرهاق وتعب","label":"أعمل فوق طاقتي","chapter":3,"opening":"قد يصير التعب عادة حتى تنسى كيف يبدو يوم أخف. لا تحتاج إلى تبرير حاجتك إلى الراحة في كل مرة.","action":"وثّق حجم العمل وتحدث إلى من يملك تعديل الأولويات، واطلب تقييمًا طبيًا إذا استمر الإنهاك.","alert":null,"id":"s66","pains":["أعمل ساعات أطول من قدرتي","لا أستطيع رفض مهام إضافية","تعب جسدي لا يزول بالراحة القصيرة"],"warm":"قد تحتاج إلى إعادة ترتيب العمل وحدوده، لا إلى أمر جديد بأن تصبر أكثر.","closing":"للقوة حدود، واحترامها حكمة.","theme":"work","verseKeys":[],"verseScope":"لا شاهد مباشر","isRisk":false,"painGuidance":["إذا تجاوز العمل قدرتك، راجع الساعات والالتزامات واطلب ترتيباً واقعياً للمهام.","صعوبة الرفض قد تحتاج إلى حدود مهنية واضحة؛ تدرب على طلب تحديد الأولويات.","التعب الذي لا يزول بالراحة القصيرة قد يحتاج إلى تقييم صحي؛ لا تتجاهله."]},{"feeling":"إرهاق وتعب","label":"نفد صبري من الانتظار","chapter":8,"opening":"قد تكون بذلت كل ما تستطيع، ثم بقي عليك الانتظار وحده. وتعب الانتظار لا يظهر في شهادة أو تقرير.","action":"حدّد ما تستطيع فعله في فترة الانتظار، وابتعد أوقاتًا قصيرة عن التفقد المستمر.","alert":null,"id":"s67","pains":["أشعر أن الانتظار لا ينتهي","بدأت أفقد الأمل","أفحص الخبر مرارًا"],"warm":"طول الانتظار قد يجعل الدقيقة ثقيلة. لن أحوله إلى وعد بموعد لا أعرفه.","closing":"ما تأخر لا يلزم أن يكون رفضًا لك.","theme":"uncertainty","verseKeys":[],"verseScope":"لا شاهد مباشر","isRisk":false,"painGuidance":["إذا طال الانتظار، اسأل عمّا يمكن متابعته وعمّا لا تملك تغييره.","فقد الأمل بعد التأخير مفهوم؛ اطلب صحبة ومشورة، واحتفظ بخيار بديل متاح.","فحص الأخبار مراراً قد يرهقك؛ حدد قناة متابعة ومواعيد معقولة."]},{"feeling":"إرهاق وتعب","label":"لا أجد راحة في البيت","chapter":10,"opening":"من الصعب أن يستريح الإنسان إذا ظل متحفزاً لما قد يقع. لا يحتاج البيت إلى أثاث جميل بقدر حاجته إلى الأمان.","action":"إذا كان هناك تهديد فاطلب مكانًا آمنًا ومساعدة مباشرة؛ وإلا فحدد ما تحتاج تغييره واطلب حوارًا أو دعمًا مناسبًا.","alert":"خطر","id":"s68","pains":["أخشى التوتر في البيت","لا أستطيع الراحة في المكان","أخاف تصاعد خلاف عائلي"],"warm":"انعدام الراحة في البيت قد يكون بسبب ضغط أو خلاف، وقد يكون وراءه خطر يحتاج إلى حماية؛ لا نخلط الأمرين.","closing":"حقك في الهدوء والسلامة لا ينتهي عند باب البيت.","theme":"injustice","verseKeys":[],"verseScope":"السلامة مقدمة","isRisk":true,"painGuidance":["إذا خشيت التوتر في البيت، تجنب الحوار وقت التصعيد واختر وقتاً آمناً.","إن لم تجد راحة في المكان، فكر في دعم أو مساحة آمنة ولا تقلل من أثر ذلك.","إذا خفت تصاعد الخلاف إلى أذى، قدّم السلامة واطلب عوناً مأموناً."]},{"feeling":"إرهاق وتعب","label":"أشعر بتعب لا يفسره النوم","chapter":6,"opening":"قد تنام ثم تستيقظ كأنك لم تسترح. ليس كل تعب ضعف إرادة، وقد يحتاج إلى تقييم صحي.","action":"رتب مراجعة طبية إذا استمر التعب، ودوّن نمط النوم والأعراض والأدوية لتناقشها.","alert":null,"id":"s69","pains":["أستيقظ متعبًا كل يوم","لا أعرف سبب الإرهاق","ألوم نفسي لأن نشاطي قل"],"warm":"التعب الذي لا يفسره النوم لا يجوز أن يُحسم بأنه كسل أو ضعف إرادة؛ فقد يحتاج إلى تقييم طبي.","closing":"طلب تفسير لتعبك خطوة مسؤولة.","theme":"fatigue","verseKeys":[],"verseScope":"عام في المعنى","isRisk":false,"painGuidance":["التعب اليومي المستمر يستحق تقييماً صحياً؛ ليس دائماً نقصاً في الإرادة.","إذا لم تعرف سبب الإرهاق، دوّن وقت ظهوره والنوم والأعراض الأخرى للطبيب.","قلة النشاط ليست دليلاً على الكسل؛ ابحث عن السبب واحترم قدرة جسدك."]},{"feeling":"إرهاق وتعب","label":"ضاقت عليّ التزامات المال","chapter":4,"opening":"قد تحاول الوفاء للجميع فلا يبقى منك شيء لنفسك وأسرتك. الصدق في القدرة خير من وعود تُثقل الغد.","action":"رتّب الضروريات والمواعيد وتواصل مبكرًا مع صاحب الحق إن خشيت التعثر.","alert":null,"id":"s70","pains":["لا يكفيني المال بعد الالتزامات","أخاف تراكم الديون","أشعر بضغط لا أفصح عنه"],"warm":"الالتزامات المالية قد تجعل اليوم ضيقًا حتى قبل حلول المواعيد. البداية الواضحة أفضل من وعود لا تُحتمل.","closing":"لا تجعل الأرقام حُكمًا على إنسانيتك.","theme":"debt","verseKeys":[],"verseScope":"لا شاهد مباشر","isRisk":false,"painGuidance":["إذا لم يكفِ المال، ابدأ بالضروريات وراجع النفقات الممكن تغييرها دون تعريض الأسرة للعجز.","الخوف من الديون المقبلة يحتاج خطة واقعية للمبالغ والمواعيد، لا وعوداً عامة.","إخفاء الضغط المالي قد يزيد وحدتك؛ تحدث إلى شخص مأمون أو مستشار مناسب."]},{"feeling":"مشاعر مختلطة","label":"لا أعرف ما أشعر به","chapter":15,"opening":"ربما لا تجد كلمة تجمع ما بداخلك. لا تحتاج إلى اختيار وصف دقيق حتى يستحق ما تمر به اهتماماً.","action":"ابدأ بوصف ما حدث في يومك لشخص مأمون إن أحببت، واطلب دعمًا متخصصًا إذا أثّر الضيق على حياتك.","alert":null,"id":"s71","pains":["لا أعرف أهو حزن أم تعب","أحتاج من يسمعني دون تفسير","أخشى أن يتعقد الأمر"],"warm":"عدم قدرتك على تسمية الشعور لا يمنع أن تجد مساندة. لن أدّعي معرفة السبب من هذه الإجابات.","closing":"يجوز أن تبدأ من سؤال بسيط: ما الذي أحتاج إليه الآن؟","theme":"uncertain","verseKeys":[],"verseScope":"لا شاهد مباشر","isRisk":false,"painGuidance":["لا يلزم أن تسمي شعورك الآن؛ يكفي أن تعرف أنك تحتاج إلى وقت أو مساندة.","إذا كنت تريد من يسمع دون تفسير، أخبره بذلك صراحة.","الخوف من تعقد الأمر مفهوم؛ اختر ما يخفف العبء اليوم دون تشخيص نفسك."]},{"feeling":"مشاعر مختلطة","label":"أشعر بالحزن والخوف معاً","chapter":8,"opening":"قد يأتيك حزن على ما فات وخوف مما سيأتي في الوقت نفسه. ليس عليك ترتيب المشاعر قبل أن تعيش يومك.","action":"اختر أكثر أمر يحتاج إلى اهتمام اليوم، واطلب صحبة إن أصبح حمل المشاعر ثقيلاً.","alert":null,"id":"s72","pains":["يغلب عليّ الحزن","يغلب عليّ الخوف","لا أستطيع الفصل بين الاثنين"],"warm":"قد يجتمع الحزن والخوف، ولا يلزم أن تختار اسمًا واحدًا لتجربتك. سنبقي القراءة عامة بقدر ما بقي السبب غير واضح.","closing":"ليس عليك تفسير كل شعور لتستحق المساندة.","theme":"uncertain","verseKeys":[],"verseScope":"لا شاهد مباشر","isRisk":false,"painGuidance":["إذا غلب الحزن، امنحه مساحة ولا تحاول إجباره على الاختفاء.","إذا غلب الخوف، فرّق بين خطر حاضر واحتمال تتوقعه.","إذا اختلط الشعوران، لا تفرض على نفسك تفسيراً واحداً؛ اطلب صحبة أو دعماً."]},{"feeling":"مشاعر مختلطة","label":"أشعر أنني متعب فقط","chapter":14,"opening":"قد تعجز عن تسمية المشكلة لأن التعب صار أسبق من الكلمات. يمكن أن تبدأ من حاجة جسدك قبل تفسير كل شيء.","action":"خفف ما تستطيع من الأعباء، واطلب تقييمًا صحيًا إذا استمر التعب أو ظهر عرض مقلق.","alert":null,"id":"s73","pains":["أشعر بإرهاق جسدي","أشعر بتعب نفسي","لا أعرف أيهما بدأ أولًا"],"warm":"التعب غير المحدد يحتاج إلى رفق وتتبّع للوقائع، لا إلى تخمين سببه من بضعة أزرار.","closing":"لا تحقّر التعب لأنك لم تعرف اسمه بعد.","theme":"fatigue","verseKeys":[],"verseScope":"عام في المعنى","isRisk":false,"painGuidance":["إذا كان التعب جسدياً، احترم حاجات النوم والطعام واطلب تقييماً إن استمر.","إذا كان التعب نفسياً، شارك شخصاً آمناً ما تمر به واطلب مساندة عند الحاجة.","إذا لم تعرف أيهما بدأ، يمكن للمتابعة الصحية أن تساعد على فهم الصورة."]},{"feeling":"مشاعر مختلطة","label":"أخاف ولا أعرف ممّ","chapter":8,"opening":"قد يحضر الخوف دون صورة واضحة. وهو شعور يحتاج إلى فهم لا إلى اتهامك بالضعف.","action":"تحقق من علامات الخطر الواقعية، واطلب دعمًا إذا استمر الخوف أو أثّر في يومك.","alert":null,"id":"s74","pains":["لا أعرف مصدر الخوف","أشعر أن شيئًا سيئًا سيقع","أخاف أن يظهر الخوف على وجهي"],"warm":"قد يصعب وصف الخوف حين لا تعرف ما أثاره. هذا لا يجعل شعورك مختلقًا ولا يجعل توقعك حقيقة.","closing":"يمكنك الاعتناء بنفسك دون أن تصدق كل احتمال.","theme":"worry","verseKeys":[],"verseScope":"لا شاهد مباشر","isRisk":false,"painGuidance":["إذا كان الخوف بلا سبب واضح، لا تفترض أن وراءه كارثة؛ اطلب دعماً إذا تكرر بشدة.","الإحساس بأن سوءاً سيقع ليس دليلاً على وقوعه؛ عد إلى الوقائع الحاضرة.","الخوف من أن يراه الناس قد يزيد الضغط؛ ليس عيباً أن تسأل عن مساندة."]},{"feeling":"مشاعر مختلطة","label":"مشكلاتي متشابكة","chapter":18,"opening":"حين تدخل مشكلة في أخرى قد يبدو من المستحيل العثور على أول الطريق. لكننا نستطيع البدء بما يحفظ الضروريات.","action":"حدد الضرورة الأولى: السلامة، أو الطعام، أو الصحة، أو حق عاجل؛ ثم اطلب مساعدة تناسبها.","alert":null,"id":"s75","pains":["أكثر من مشكلة تضغط عليّ","لا أعرف أي أمر أقدّم","أحتاج إلى من يساعدني على الترتيب"],"warm":"حين تتشابك المشكلات، لا تكون أول مهمة حلها كلها؛ بل العثور على ما هو عاجل وما يمكن تأجيله.","closing":"ليس على قلبك أن يحل العالم دفعة واحدة.","theme":"decision","verseKeys":[],"verseScope":"لا شاهد مباشر","isRisk":false,"painGuidance":["إذا تراكمت المشكلات، ابدأ بالأخطر على السلامة أو الضروريات.","إن لم تعرف الأولوية، اكتب موعداً عاجلاً وحقاً قريباً ثم اطلب مشورة.","ترتيب المشكلات مع شخص مأمون قد يخفف الحمل دون أن يحلها كلها فوراً."]},{"feeling":"مشاعر مختلطة","label":"أنا في خطر الآن","chapter":1,"opening":"إذا كنت في خطر حاضر، لا تنتظر أن ينتهي الكتاب أو الأسئلة. أهم ما في هذه اللحظة أن تصل إلى الأمان.","action":"انتقل إلى مكان آمن إن أمكن، واتصل بطوارئ بلدك أو بشخص موثوق يستطيع الوصول إليك.","alert":"خطر","id":"s76","pains":["أنا مهدد الآن","لا أجد مكانًا آمنًا","لا أعرف بمن أتصل"],"warm":"حين يكون الخطر حاضرًا، تصبح النجدة هي الأولوية. لا يحتاج الإنسان إلى إكمال أسئلة كتاب حتى يطلب الحماية.","closing":"سلامتك هي الصفحة الأولى اليوم.","theme":"safety","verseKeys":[],"verseScope":"السلامة مقدمة","isRisk":true,"painGuidance":["إذا كنت مهدداً الآن، اترك القراءة واتصل بالطوارئ أو جهة حماية محلية.","إذا لم يكن هناك مكان آمن، اطلب من الجهات المختصة مساعدتك في الوصول إليه.","إذا لم تعرف بمن تتصل، ابحث عن رقم الطوارئ المحلي أو اطلب من شخص مأمون الاتصال فوراً."]},{"feeling":"مشاعر مختلطة","label":"تراودني أفكار بإيذاء نفسي","chapter":1,"opening":"قد يكون ما تمر به مؤلماً إلى درجة يصعب شرحها. وجود هذه الأفكار يستدعي مساندة مباشرة لا رحلة قراءة تُترك فيها وحدك.","action":"إذا كانت لديك رغبة في إيذاء نفسك الآن، ابتعد عن أي شيء قد يؤذيك واتصل بالطوارئ أو بشخص يستطيع البقاء معك فورًا.","alert":"خطر","id":"s77","pains":["أخشى أن أؤذي نفسي","أشعر أنني وحدي مع هذه الأفكار","لا أعرف كيف أطلب مساعدة فورية"],"warm":"أفكار إيذاء النفس تحتاج إلى اهتمام جاد ومساندة مباشرة؛ لن نحكم عليك ولا سنحول الأمر إلى امتحان في الإيمان.","closing":"وجودك وسلامتك أهم من إكمال القراءة.","theme":"selfcare","verseKeys":[],"verseScope":"السلامة مقدمة","isRisk":true,"painGuidance":["إذا خشيت إيذاء نفسك، ابتعد عن وسائل الأذى واطلب مساعدة عاجلة من الطوارئ أو شخص يستطيع البقاء معك.","هذه الأفكار مرهقة ولا ينبغي أن تواجهها وحدك؛ أخبر شخصاً مأموناً الآن.","إذا صعب الكلام، أرسل رسالة قصيرة تطلب فيها حضور شخص موثوق أو اتصاله بالطوارئ."]},{"id":"s78","feeling":"خوف وتهديد","chapter":3,"label":"أخاف من مقابلة وظيفة","opening":"قد تنتظر مقابلة عمل وتتمنى أن تصف ما تستطيع فعله بوضوح، ثم يخونك الكلام من شدة القلق.","pains":["أتوتر حين يسألني المحاور","أخاف الرفض بعد المقابلة","لا أعرف كيف أعرض خبرتي"],"warm":"مقابلة العمل موقف تقييم لفرصة معينة، لا حكم نهائي على قدراتك أو قيمتك.","action":"حضّر مثالين واضحين من خبرتك، واسأل عن متطلبات الدور، وراجع طريقة عرضك بعد المقابلة.","closing":"قرار مقابلة واحدة لا يقرر قيمتك ولا نهاية مسارك.","theme":"interview","verseKeys":["القصص:٢٦"],"verseScope":"صلة موضوعية محددة","isRisk":false,"painGuidance":["إذا توترت عند السؤال، تدرب بصوت مسموع على شرح تجربة واحدة ومهارة واحدة.","الخوف من الرفض لا يحسم نتيجة المقابلة؛ جهّز أسئلتك ثم اترك القرار للجهة.","إذا صعب عليك عرض الخبرة، اكتب مثالين واضحين عمّا فعلته وما تعلمته."]}],"states":[{"id":"new","label":"الأمر حديث، وما زلت أحاول فهمه","line":"ما زال ما حدث قريبًا؛ وليس عليك أن تتخذ كل القرارات الآن."},{"id":"long","label":"يمتد هذا الأمر منذ مدة","line":"طول المدة قد يزيد التعب، وقد تحتاج إلى مساعدة تتجاوز نصيحة عابرة."},{"id":"alone","label":"أشعر أنني أواجهه وحدي","line":"وجود شخص مأمون بجانبك قد يخفف عبء الخطوة التالية."},{"id":"urgent","label":"هناك حاجة عاجلة أو خطر حاضر","line":"إذا كانت سلامتك أو ضرورياتك مهددة، فاطلب العون المناسب أولًا ولا تؤخره لإتمام القراءة."},{"id":"unknown","label":"لا أستطيع تحديد ذلك","line":"يجوز ألّا تعرف توصيف الوضع الآن؛ لن نخترع تفاصيل لم تخبرنا بها."}],"needs":[{"id":"kind","label":"كلام رقيق يفهم ما أمرّ به"},{"id":"quran","label":"آية وفهم واضح دون مبالغة"},{"id":"action","label":"خطوة عملية تناسب ظروفي"},{"id":"balance","label":"أريد الرفق والفهم والعمل معًا"},{"id":"unknown","label":"لا أعرف ما الذي أحتاجه"}],"verses":{"النساء:٢٩":{"id":"النساء:٢٩","quote":"﴿لَا تَأْكُلُوا أَمْوَالَكُمْ بَيْنَكُمْ بِالْبَاطِلِ إِلَّا أَنْ تَكُونَ تِجَارَةً عَنْ تَرَاضٍ مِنْكُمْ﴾","reference":"النساء: ٢٩","explanation":"تنهى الآية عن أخذ أموال الناس بالباطل، وتذكر التجارة عن تراضٍ. وهي أصل أخلاقي وفقهي في المعاملات، أما تقدير الربح والخسارة فيحتاج إلى حساب ومعرفة بالسوق.","chapter":17,"url":null},"المائدة:٣٢":{"id":"المائدة:٣٢","quote":"﴿وَمَنْ أَحْيَاهَا فَكَأَنَّمَا أَحْيَا النَّاسَ جَمِيعًا﴾","reference":"المائدة: ٣٢","explanation":"ورد هذا المعنى في حديث القرآن لبني إسرائيل عن عِظَم شأن النفس. يفتح لنا باب تقدير إنقاذ الحياة، من غير أن نحوله إلى تعليمات إسعاف تفصيلية.","chapter":1,"url":null},"المائدة:٢":{"id":"المائدة:٢","quote":"﴿وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ﴾","reference":"المائدة: ٢","explanation":"التعاون على الخير يشمل من يملك القدرة على الإعانة. لا ينبغي أن يبقى المستغيث وحده ما دام هناك من يستطيع المساعدة بأمان.","chapter":1,"url":null},"البلد:١٤–١٦":{"id":"البلد:١٤–١٦","quote":"﴿أَوْ إِطْعَامٌ فِي يَوْمٍ ذِي مَسْغَبَةٍ ۝ يَتِيمًا ذَا مَقْرَبَةٍ ۝ أَوْ مِسْكِينًا ذَا مَتْرَبَةٍ﴾","reference":"البلد: ١٤–١٦","explanation":"تأتي هذه الآيات متتابعة في سورة البلد، فتذكر الإطعام وقت شدة الجوع، وتذكر اليتيم القريب والمسكين شديد الفقر. إنها دعوة إلى فعل الخير للمحتاج، لا لومًا لمن لم يجد ما يأكله.","chapter":2,"url":null},"الإنسان:٨":{"id":"الإنسان:٨","quote":"﴿وَيُطْعِمُونَ الطَّعَامَ عَلَىٰ حُبِّهِ مِسْكِينًا وَيَتِيمًا وَأَسِيرًا﴾","reference":"الإنسان: ٨","explanation":"تمدح الآية إطعام المسكين واليتيم والأسير. ومن رحمة هذا المعنى أن نرى الجائع إنسانًا يستحق الإعانة، لا قصة نحكم عليها من بعيد.","chapter":2,"url":null},"القصص:٢٤":{"id":"القصص:٢٤","quote":"﴿رَبِّ إِنِّي لِمَا أَنْزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ﴾","reference":"القصص: ٢٤","explanation":"قال موسى هذا الدعاء بعد أن سقى للمرأتين، فجمع بين فعل الخير والافتقار إلى الله. نستطيع أن ندعو به، من غير أن نعد أنفسنا بوظيفة محددة أو وقت معين.","chapter":3,"url":null},"القصص:٢٦":{"id":"القصص:٢٦","quote":"﴿إِنَّ خَيْرَ مَنِ اسْتَأْجَرْتَ الْقَوِيُّ الْأَمِينُ﴾","reference":"القصص: ٢٦","explanation":"ورد وصف القوة والأمانة في سياق عرض الاستئجار على موسى. وهو وصف لما يُطلب في العمل، وليس حكمًا على قيمة من لم يجد وظيفة بعد.","chapter":3,"url":null},"الملك:١٥":{"id":"الملك:١٥","quote":"﴿فَامْشُوا فِي مَنَاكِبِهَا وَكُلُوا مِنْ رِزْقِهِ﴾","reference":"الملك: ١٥","explanation":"تذكر الآية تيسير الأرض والسير في مناكبها والأكل من رزق الله. في معناها حض على السعي، دون ضمان أن يكون الطريق سهلًا أو النتيجة عاجلة.","chapter":3,"url":null},"البقرة:٢٨٠":{"id":"البقرة:٢٨٠","quote":"﴿وَإِنْ كَانَ ذُو عُسْرَةٍ فَنَظِرَةٌ إِلَىٰ مَيْسَرَةٍ وَأَنْ تَصَدَّقُوا خَيْرٌ لَكُمْ إِنْ كُنْتُمْ تَعْلَمُونَ﴾","reference":"البقرة: ٢٨٠","explanation":"تأمر الآية بإنظار المدين الذي ثبت عسره إلى وقت الميسرة. وفي هذا مراعاة لحاله، مع بقاء أصل الحق ما لم يُسقطه صاحبه أو يقع صلح معتبر.","chapter":4,"url":null},"البقرة:٢٨٢":{"id":"البقرة:٢٨٢","quote":"﴿إِذَا تَدَايَنْتُمْ بِدَيْنٍ إِلَىٰ أَجَلٍ مُسَمًّى فَاكْتُبُوهُ﴾","reference":"البقرة: ٢٨٢","explanation":"من مقاصد كتابة الديون حفظ الحقوق وتقليل الخلاف. ليس التوثيق سوء ظن، بل وسيلة يتبين بها ما اتفق عليه الطرفان.","chapter":4,"url":null},"النساء:٥٨":{"id":"النساء:٥٨","quote":"﴿إِنَّ اللَّهَ يَأْمُرُكُمْ أَنْ تُؤَدُّوا الْأَمَانَاتِ إِلَىٰ أَهْلِهَا﴾","reference":"النساء: ٥٨","explanation":"الأمر بأداء الأمانات إلى أهلها أصل في حفظ الحقوق. نستفيد منه مسؤولية من يتولى أمور الناس، لكنه لا يحدد بنفسه إجراءات إصدار المستندات أو تصحيحها في الأنظمة الحديثة.","chapter":20,"url":null},"الكهف:١٠":{"id":"الكهف:١٠","quote":"﴿رَبَّنَا آتِنَا مِنْ لَدُنْكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا﴾","reference":"الكهف: ١٠","explanation":"دعا أصحاب الكهف ربهم بالرحمة وأن يهيئ لهم الرشد في أمرهم. ومن الجميل أن يسأل الإنسان ربه ذلك، مع البحث عن الأسباب المناسبة لظرفه، من غير تحويل القصة إلى وعد ببيت في زمن محدد.","chapter":5,"url":null},"الأنبياء:٨٣":{"id":"الأنبياء:٨٣","quote":"﴿أَنِّي مَسَّنِيَ الضُّرُّ وَأَنْتَ أَرْحَمُ الرَّاحِمِينَ﴾","reference":"الأنبياء: ٨٣","explanation":"هذا من دعاء أيوب عليه السلام حين أصابه الضر. تذكر الآية صدق الافتقار إلى الله والالتجاء إلى رحمته، دون تكلف كلمات طويلة.","chapter":6,"url":null},"الأنبياء:٨٤":{"id":"الأنبياء:٨٤","quote":"﴿فَاسْتَجَبْنَا لَهُ فَكَشَفْنَا مَا بِهِ مِنْ ضُرٍّ﴾","reference":"الأنبياء: ٨٤","explanation":"يخبرنا القرآن بأن الله كشف الضر عن أيوب. وهو خبر عن قصته، لا وعد طبيًا لكل مريض بأن يشفى في موعد معين.","chapter":6,"url":null},"البقرة:١٥٣":{"id":"البقرة:١٥٣","quote":"﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ﴾","reference":"البقرة: ١٥٣","explanation":"في الآية أمر بالاستعانة بالصبر والصلاة. وهذه الاستعانة لا تمنع طلب العلاج، ولا تجعل الألم الذي يستمر دليلًا على قلة صبر صاحبه.","chapter":6,"url":null},"التغابن:١٦":{"id":"التغابن:١٦","quote":"﴿فَاتَّقُوا اللَّهَ مَا اسْتَطَعْتُمْ وَاسْمَعُوا وَأَطِيعُوا﴾","reference":"التغابن: ١٦","explanation":"الأمر بتقوى الله بحسب الاستطاعة يقرر مراعاة قدرة الإنسان في التكليف، وليس مطالبةً له بأن يفعل ما يتعذر عليه.","chapter":7,"url":null},"البقرة:٢٨٦":{"id":"البقرة:٢٨٦","quote":"﴿لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا﴾","reference":"البقرة: ٢٨٦","explanation":"توضح الآية أن الله لا يكلف نفسًا إلا وسعها. نستفيد منها في فهم رحمة التكليف، ولا نجعلها وحدها نصًا يحدد المواصفات الهندسية أو النظامية للإتاحة.","chapter":7,"url":null},"الرعد:٢٨":{"id":"الرعد:٢٨","quote":"﴿أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾","reference":"الرعد: ٢٨","explanation":"تذكر الآية اطمئنان القلوب بذكر الله. وهي تفتح باب الذكر والرجاء، ولا تصلح وحدها لتشخيص القلق أو الحكم على إيمان من بقي خائفًا.","chapter":8,"url":null},"آل عمران:١٥٩":{"id":"آل عمران:١٥٩","quote":"﴿وَشَاوِرْهُمْ فِي الْأَمْرِ فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ﴾","reference":"آل عمران: ١٥٩","explanation":"تجمع الآية بين المشاورة والعزم والتوكل في سياقها. يمكن أن نتعلم منها حسن الاستعداد للقرار، ولا نستخرج منها ضمانًا بأن كل اختيار سيحقق ما نحب.","chapter":18,"url":null},"لقمان:٣٤":{"id":"لقمان:٣٤","quote":"﴿وَمَا تَدْرِي نَفْسٌ مَاذَا تَكْسِبُ غَدًا﴾","reference":"لقمان: ٣٤","explanation":"تذكر الآية أن الإنسان لا يعلم ما سيكسب غدًا. جهل الغيب لا يمنع التخطيط الممكن، لكنه يذكّرنا بأن التوقع ليس يقينًا.","chapter":8,"url":null},"يوسف:٨٤":{"id":"يوسف:٨٤","quote":"﴿وَتَوَلَّىٰ عَنْهُمْ وَقَالَ يَا أَسَفَىٰ عَلَىٰ يُوسُفَ وَابْيَضَّتْ عَيْنَاهُ مِنَ الْحُزْنِ فَهُوَ كَظِيمٌ﴾","reference":"يوسف: ٨٤","explanation":"يصف القرآن حزن يعقوب على يوسف حتى ظهر أثره في عينيه. لم يُخفِ النص هذا الألم، ولا يذكره ليُلام يعقوب عليه السلام عليه.","chapter":9,"url":null},"يوسف:٨٦":{"id":"يوسف:٨٦","quote":"﴿إِنَّمَا أَشْكُو بَثِّي وَحُزْنِي إِلَى اللَّه
