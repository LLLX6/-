العزم والتوكل في خطاب النبي صلى الله عليه وسلم. ننتفع منه بمبدأ المشاورة والعمل بعد التفكير، مع بقاء الغيب لله. كما ينهى القرآن عن اتباع ما لا علم لنا به؛ ولذلك من الخير أن نميز بين المعلومة الموثوقة والخوف أو الإشاعة."},{"type":"heading","text":"حين يحين وقت الحسم"},{"type":"paragraph","text":"استشر من يعرف المجال، ومن لا يوافقك الرأي بأمانة. انظر إلى أثر القرار في من يتعلق بهم حق، ثم حدد موعدًا معقولًا للحسم بعد جمع ما يكفي من المعلومات. وإذا اخترت ثم ظهرت معلومة جديدة، فمراجعة القرار حكمة وليست عارًا."},{"type":"heading","text":"مناجاة ودعاء · بعض الألفاظ من القرآن، والباقي من صياغة المؤلف"},{"type":"paragraph","text":"اللهم ألهمني الرشد، وأعنّي على طلب المشورة الصادقة، واهدني إلى قرار لا ظلم فيه."},{"type":"heading","text":"إذا خفت من الندم"},{"type":"paragraph","text":"ليس كل طريق تتركه خسارة، ولا كل نتيجة لا تحبها دليلًا على أنك أخطأت منذ البداية. اختر بقدر ما عرفت وبما راعيت من حقوق، ثم امنح نفسك فرصة أن تعيش قرارك بدل محاكمته كل يوم قبل أن تتضح آثاره."}]},{"id":19,"title":"حين تفقد بلدًا أو مكانًا آلفته","opening":"قد تحتفظ بمفتاح بيت لم تعد تستطيع فتحه، أو بصورة شارع تعرف تفاصيله ولا تعرف متى تراه مرة أخرى. لا يفقد الإنسان المكان وحده حين يُهجّر أو يضطر إلى الرحيل؛ ربما يفقد جيرانه وعمله ولهجته وأيامًا كان يظنها ستبقى. وأحيانًا يطالبه الآخرون بأن يتأقلم سريعًا، كأن الذاكرة حمل ينبغي التخلص منه. لكن الشوق إلى المكان لا يمنع أن تبدأ حياة جديدة حين تتوافر لك سبلها.","verses":[{"text":"﴿لِلْفُقَرَاءِ الْمُهَاجِرِينَ الَّذِينَ أُخْرِجُوا مِنْ دِيَارِهِمْ وَأَمْوَالِهِمْ﴾","reference":"الحشر: ٨ — اقتباس من الآية","sura":"الحشر","number":"٨","explanation":"ورد ذكر المهاجرين الذين أُخرجوا من ديارهم وأموالهم في سياق آيات الفيء. يقر القرآن بهذه المحنة التي عاشوها، ولا يصوغ وعدًا خاصًا بكل مهجّر في زماننا."},{"text":"﴿يُحِبُّونَ مَنْ هَاجَرَ إِلَيْهِمْ﴾","reference":"الحشر: ٩ — اقتباس من الآية","sura":"الحشر","number":"٩","explanation":"تمدح الآية الأنصار الذين أحبوا من هاجر إليهم. فهي تذكّرنا بأن مسؤولية الإيواء والإحسان تقع أيضًا على من يملك القدرة على استقبال غيره."}],"prayer":"اللهم احفظ من اضطر إلى ترك داره، وارزقه مأوى كريمًا وصحبة مأمونة، واجمع بين الناس على الرحمة والعدل.","closing":"قد يتغير عنوانك، لكن ما أحببته في المكان القديم لا يصبح بلا قيمة. من حقك أن تتذكر، وأن تحزن، وأن تبني شيئًا جديدًا دون أن تنكر ما فقدت. وليكن من حولك عونًا على الأمان لا امتحانًا جديدًا في الصبر.","content":[{"type":"paragraph","text":"قد تحتفظ بمفتاح بيت لم تعد تستطيع فتحه، أو بصورة شارع تعرف تفاصيله ولا تعرف متى تراه مرة أخرى. لا يفقد الإنسان المكان وحده حين يُهجّر أو يضطر إلى الرحيل؛ ربما يفقد جيرانه وعمله ولهجته وأيامًا كان يظنها ستبقى. وأحيانًا يطالبه الآخرون بأن يتأقلم سريعًا، كأن الذاكرة حمل ينبغي التخلص منه. لكن الشوق إلى المكان لا يمنع أن تبدأ حياة جديدة حين تتوافر لك سبلها."},{"type":"heading","text":"الفقد أكبر من عنوان السكن"},{"type":"paragraph","text":"قد تحتاج إلى وثائق وطعام وعلاج وعمل، وتحتاج أيضًا إلى من يسمع حزنك على الحياة التي تركتها. ليس على القادم إلى مكان جديد أن يروي قصته لكل من يقابله، ولا على المجتمع المضيف أن ينتظر منه أن يكون ممتنًا في كل لحظة حتى يؤدي له حقًا أو يقدم إعانة."},{"type":"heading","text":"المهاجرون ومن احتضنوهم"},{"type":"verse","text":"﴿لِلْفُقَرَاءِ الْمُهَاجِرِينَ الَّذِينَ أُخْرِجُوا مِنْ دِيَارِهِمْ وَأَمْوَالِهِمْ﴾","ref":"الحشر: ٨ — اقتباس من الآية"},{"type":"paragraph","text":"ورد ذكر المهاجرين الذين أُخرجوا من ديارهم وأموالهم في سياق آيات الفيء. يقر القرآن بهذه المحنة التي عاشوها، ولا يصوغ وعدًا خاصًا بكل مهجّر في زماننا."},{"type":"verse","text":"﴿يُحِبُّونَ مَنْ هَاجَرَ إِلَيْهِمْ﴾","ref":"الحشر: ٩ — اقتباس من الآية"},{"type":"paragraph","text":"تمدح الآية الأنصار الذين أحبوا من هاجر إليهم. فهي تذكّرنا بأن مسؤولية الإيواء والإحسان تقع أيضًا على من يملك القدرة على استقبال غيره."},{"type":"heading","text":"من خرجوا ومن آووهم"},{"type":"paragraph","text":"تذكر سورة الحشر المهاجرين الذين أُخرجوا من ديارهم وأموالهم، ثم تذكر الأنصار الذين أحبوهم وآثروهم. السياق تاريخي يتعلق بالمهاجرين والفيء والأنصار، لكنه يُظهر كرامة من أُخرج من موطنه وفضل من يفتح للآخر بابًا كريمًا. ولا نحول نهاية تلك الأحداث إلى وعد لكل نازح بعودة قريبة."},{"type":"paragraph","text":"ما الذي يمكن حفظه الآن؟"},{"type":"paragraph","text":"إذا كنت في انتقال قسري، فابدأ بالسلامة والدواء والطعام والوثائق المهمة، واستعن بجهة إنسانية موثوقة حيث تتوافر. احتفظ بنسخ آمنة من أوراقك، وتواصل مع من تحب بقدر ما تسمح به الظروف. ويمكن أن تحمل شيئًا من عادات مكانك الأول إلى حياتك الجديدة دون أن يصبح ذلك عائقًا عن الاستقرار."},{"type":"heading","text":"دعاء من صياغة المؤلف"},{"type":"paragraph","text":"اللهم احفظ من اضطر إلى ترك داره، وارزقه مأوى كريمًا وصحبة مأمونة، واجمع بين الناس على الرحمة والعدل."},{"type":"heading","text":"إلى من يحمل مكانه معه"},{"type":"paragraph","text":"قد يتغير عنوانك، لكن ما أحببته في المكان القديم لا يصبح بلا قيمة. من حقك أن تتذكر، وأن تحزن، وأن تبني شيئًا جديدًا دون أن تنكر ما فقدت. وليكن من حولك عونًا على الأمان لا امتحانًا جديدًا في الصبر."}]},{"id":20,"title":"حين تحول ورقة مفقودة بينك وبين حقك","opening":"قد تقف أمام مكتب وفي يدك أوراق كثيرة، ثم يطلب منك موظف وثيقة واحدة ليست عندك. تتوقف معاملة، أو يتأخر علاج، أو تضيع فرصة لأن اسمًا كُتب خطأ أو رقمًا لم يُحدَّث. وربما تكون متأكدًا من حقك، لكن الطريق إليه يمر بإجراء لا تفهمه. لا حاجة لأن نخاطبك بكلام غامض عن الصبر وحده؛ ما تحتاجه هو معرفة أين يبدأ الحل ومن يستطيع أن يرشدك إليه.","verses":[{"text":"﴿إِنَّ اللَّهَ يَأْمُرُكُمْ أَنْ تُؤَدُّوا الْأَمَانَاتِ إِلَىٰ أَهْلِهَا﴾","reference":"النساء: ٥٨ — اقتباس من الآية","sura":"النساء","number":"٥٨","explanation":"الأمر بأداء الأمانات إلى أهلها أصل في حفظ الحقوق. نستفيد منه مسؤولية من يتولى أمور الناس، لكنه لا يحدد بنفسه إجراءات إصدار المستندات أو تصحيحها في الأنظمة الحديثة."}],"prayer":"اللهم يسر لي الوصول إلى حقي، وأعنّي على البيان الصادق، وارزق القائمين على شؤون الناس العدل والأمانة.","closing":"لا تجعل تعطل ورقة يتحول في نفسك إلى شعور بأن حياتك كلها متعطلة. ربما يحتاج الأمر إلى متابعة ومساعدة، وربما يتأخر أكثر مما ينبغي. لكن السؤال الواضح والمستند الصحيح قد يجعلان الطريق أيسر من الدوران حول المشكلة بلا جواب.","content":[{"type":"paragraph","text":"قد تقف أمام مكتب وفي يدك أوراق كثيرة، ثم يطلب منك موظف وثيقة واحدة ليست عندك. تتوقف معاملة، أو يتأخر علاج، أو تضيع فرصة لأن اسمًا كُتب خطأ أو رقمًا لم يُحدَّث. وربما تكون متأكدًا من حقك، لكن الطريق إليه يمر بإجراء لا تفهمه. لا حاجة لأن نخاطبك بكلام غامض عن الصبر وحده؛ ما تحتاجه هو معرفة أين يبدأ الحل ومن يستطيع أن يرشدك إليه."},{"type":"heading","text":"الورقة ليست قيمة الإنسان"},{"type":"paragraph","text":"قد تكون الوثائق ضرورية لإثبات الحقوق وحفظ النظام، لكن تعطل إجراء لا يعني أن صاحبه أقل شأنًا. أحيانًا يكفي معرفة المستند البديل، أو طلب نسخة، أو تصحيح خطأ في سجل، أو الاستفسار عن طريق الاعتراض. هذه مسائل تختلف إجراءاتها بين البلدان والجهات، وتحتاج جوابًا محددًا لا وصفة عامة."},{"type":"heading","text":"أداء الأمانات وحفظ الحقوق"},{"type":"verse","text":"﴿إِنَّ اللَّهَ يَأْمُرُكُمْ أَنْ تُؤَدُّوا الْأَمَانَاتِ إِلَىٰ أَهْلِهَا﴾","ref":"النساء: ٥٨ — اقتباس من الآية"},{"type":"paragraph","text":"الأمر بأداء الأمانات إلى أهلها أصل في حفظ الحقوق. نستفيد منه مسؤولية من يتولى أمور الناس، لكنه لا يحدد بنفسه إجراءات إصدار المستندات أو تصحيحها في الأنظمة الحديثة."},{"type":"heading","text":"الأمانة في حفظ الحقوق"},{"type":"paragraph","text":"يأمر القرآن بأداء الأمانات إلى أهلها، ومن معاني هذا الأصل حفظ ما للناس من حقوق وعدم العبث به. أما استخراج بطاقة أو تعديل شهادة أو مراجعة معاملة، فتفاصيلها تُعرف من اللوائح والجهات المختصة. بيان هذا الفرق يحفظ النص القرآني من تحميله ما لم يقله."},{"type":"heading","text":"حوّل الحيرة إلى سؤال محدد"},{"type":"paragraph","text":"اكتب اسم الوثيقة المطلوبة، والجهة التي طلبتها، وسبب عدم قبول المتاح لديك. اطلب تعليمات رسمية عن البدائل أو الاعتراض، واحتفظ بأرقام الطلبات ومواعيد المراجعة. وإن كان الوصول إلى الخدمة صعبًا بسبب لغة أو إعاقة أو ظرف، فاسأل عن وسيلة مساعدة مناسبة."},{"type":"heading","text":"دعاء من صياغة المؤلف"},{"type":"paragraph","text":"اللهم يسر لي الوصول إلى حقي، وأعنّي على البيان الصادق، وارزق القائمين على شؤون الناس العدل والأمانة."},{"type":"heading","text":"إذا أرهقتك المعاملات"},{"type":"paragraph","text":"لا تجعل تعطل ورقة يتحول في نفسك إلى شعور بأن حياتك كلها متعطلة. ربما يحتاج الأمر إلى متابعة ومساعدة، وربما يتأخر أكثر مما ينبغي. لكن السؤال الواضح والمستند الصحيح قد يجعلان الطريق أيسر من الدوران حول المشكلة بلا جواب."}]},{"id":21,"title":"حين تعود إلى عادة تؤلمك","opening":"قد تقول لنفسك إنك لن تعود إلى سلوك يؤلمك، ثم تجد نفسك قد عدت. وربما يكون أصعب ما في الأمر ما تقوله لنفسك بعدها: لا فائدة مني، سأبقى هكذا. لكن العودة لا تفسر القصة كلها. هناك عادات تحتاج إلى تغيير البيئة والطريقة، وهناك سلوك قهري أو اعتماد على مواد يحتاج إلى مساعدة متخصصة، وهناك أخطاء تتصل بحقوق الآخرين وتحتاج إلى توبة وإصلاح.","verses":[{"text":"﴿لَا تَقْنَطُوا مِنْ رَحْمَةِ اللَّهِ﴾","reference":"الزمر: ٥٣ — اقتباس من الآية","sura":"الزمر","number":"٥٣","explanation":"في آية الزمر فتح لباب الرجاء لمن أسرف على نفسه. والرجاء الصحيح لا ينكر الضرر ولا يمنع التوبة حين يكون الفعل ذنبًا."},{"text":"﴿وَلَمْ يُصِرُّوا عَلَىٰ مَا فَعَلُوا وَهُمْ يَعْلَمُونَ﴾","reference":"آل عمران: ١٣٥ — اقتباس من الآية","sura":"آل عمران","number":"١٣٥","explanation":"تذكر الآية الاستغفار وعدم الإصرار على الذنب بعد العلم به. وهي تتعلق بالتوبة، ولا تُقدم وحدها علاجًا طبيًا للأعراض القهرية أو الاعتماد على المواد."}],"prayer":"ربنا ظلمنا أنفسنا وإن لم تغفر لنا وترحمنا لنكونن من الخاسرين. اللهم أعنّي على ترك ما يؤذيني وإصلاح ما أفسدت.","closing":"لا تهدم كل ما تعلمته لأنك تعثرت مرة أخرى. انظر إلى ما لم ينجح في خطتك، واطلب عونًا يناسب طبيعة المشكلة، وأصلح ما وقع منك من ضرر. بداية جديدة لا تتطلب أن تصف نفسك بأقسى الكلمات.","content":[{"type":"paragraph","text":"قد تقول لنفسك إنك لن تعود إلى سلوك يؤلمك، ثم تجد نفسك قد عدت. وربما يكون أصعب ما في الأمر ما تقوله لنفسك بعدها: لا فائدة مني، سأبقى هكذا. لكن العودة لا تفسر القصة كلها. هناك عادات تحتاج إلى تغيير البيئة والطريقة، وهناك سلوك قهري أو اعتماد على مواد يحتاج إلى مساعدة متخصصة، وهناك أخطاء تتصل بحقوق الآخرين وتحتاج إلى توبة وإصلاح."},{"type":"heading","text":"افهم ما يحدث قبل أن تعاقب نفسك"},{"type":"paragraph","text":"متى يتكرر السلوك؟ هل يأتي مع تعب أو وحدة أو ضغط؟ وهل يسبب ضررًا صحيًا أو ماليًا أو أذى لشخص آخر؟ طرح هذه الأسئلة ليس تبريرًا للخطأ، بل وسيلة لفهم ما تحتاج إلى تغييره. وفي بعض أنواع الاعتماد على المواد قد يكون التوقف المفاجئ خطرًا، فلا تتخذ قرارًا طبيًا دون استشارة مختص."},{"type":"heading","text":"الرجاء وعدم الإصرار"},{"type":"verse","text":"﴿لَا تَقْنَطُوا مِنْ رَحْمَةِ اللَّهِ﴾","ref":"الزمر: ٥٣ — اقتباس من الآية"},{"type":"paragraph","text":"في آية الزمر فتح لباب الرجاء لمن أسرف على نفسه. والرجاء الصحيح لا ينكر الضرر ولا يمنع التوبة حين يكون الفعل ذنبًا."},{"type":"verse","text":"﴿وَلَمْ يُصِرُّوا عَلَىٰ مَا فَعَلُوا وَهُمْ يَعْلَمُونَ﴾","ref":"آل عمران: ١٣٥ — اقتباس من الآية"},{"type":"paragraph","text":"تذكر الآية الاستغفار وعدم الإصرار على الذنب بعد العلم به. وهي تتعلق بالتوبة، ولا تُقدم وحدها علاجًا طبيًا للأعراض القهرية أو الاعتماد على المواد."},{"type":"heading","text":"الرجاء طريق إلى الإصلاح"},{"type":"paragraph","text":"يفتح القرآن باب الرحمة لمن أسرف على نفسه، ويذكر الاستغفار وعدم الإصرار على الذنب. لا يعني ذلك أن كل سلوك متكرر ذنب بالضرورة، ولا أن كل مشكلة تُحل بوعظ واحد. وحين يتعلق الأمر بذنب أو حق ضائع، يأتي الإصلاح وترك الأذى مع الرجاء؛ وحين يتعلق بمرض، لا ينبغي أن نستبدل العلاج بالاتهام."},{"type":"heading","text":"خطة أصغر وأصدق"},{"type":"paragraph","text":"حدد موقفًا يتكرر فيه السلوك، وغيّر شيئًا في الطريق الذي يقود إليه، واطلب من شخص مأمون أن يعينك إن كان ذلك مناسبًا. وإذا فقدت السيطرة أو ظهرت أخطار صحية، فتواصل مع مختص. لا تجعل كل تعثر سببًا لوعد أكبر لا تملك أدوات الوفاء به."},{"type":"heading","text":"مناجاة ودعاء · بعض الألفاظ من القرآن، والباقي من صياغة المؤلف"},{"type":"paragraph","text":"ربنا ظلمنا أنفسنا وإن لم تغفر لنا وترحمنا لنكونن من الخاسرين. اللهم أعنّي على ترك ما يؤذيني وإصلاح ما أفسدت."},{"type":"heading","text":"إذا عدت بعد محاولة صادقة"},{"type":"paragraph","text":"لا تهدم كل ما تعلمته لأنك تعثرت مرة أخرى. انظر إلى ما لم ينجح في خطتك، واطلب عونًا يناسب طبيعة المشكلة، وأصلح ما وقع منك من ضرر. بداية جديدة لا تتطلب أن تصف نفسك بأقسى الكلمات."}]},{"id":22,"title":"حين يهددك أحد من وراء شاشة","opening":"قد تكون رسالة واحدة كافية لتجعل الهاتف مصدر خوف. يهددك شخص بنشر صورة، أو يطلب مالًا، أو يدّعي أنه يملك أسرارًا عنك. وربما تكون حيرتك أكبر من قدرتك على شرح ما حدث، خاصة إن كنت تخشى معرفة أهلك أو أصدقائك. ما تتعرض له أذى حقيقي، وليس مجرد أمر صغير لأنه وقع خلف شاشة. والأولوية الآن لحمايتك، لا لإلقاء محاضرة عن تصرفاتك السابقة.","verses":[{"text":"﴿وَلَا تَجَسَّسُوا وَلَا يَغْتَبْ بَعْضُكُمْ بَعْضًا﴾","reference":"الحجرات: ١٢ — اقتباس من الآية","sura":"الحجرات","number":"١٢","explanation":"في سورة الحجرات نهي عن التجسس والغيبة، وفيه حفظ لخصوصية الناس وأعراضهم. لا تذكر الآية الأجهزة الحديثة، لكنها تقرر أصلًا واضحًا في حرمة التعدي."},{"text":"﴿إِنَّ الَّذِينَ يُحِبُّونَ أَنْ تَشِيعَ الْفَاحِشَةُ فِي الَّذِينَ آمَنُوا﴾","reference":"النور: ١٩ — اقتباس من الآية","sura":"النور","number":"١٩","explanation":"جاءت الآية في سياق الإفك وإشاعة الفاحشة بين المؤمنين. صلتها أوضح بالتهديد بالنشر الفاضح وتشويه العرض، وليست نصًا خاصًا بكل مشكلة تقنية."}],"prayer":"اللهم احفظني من الأذى، وأعنّي على التصرف بحكمة، واحفظ لي حقي وكرامتي.","closing":"لا ينبغي أن تتحمل خجلك وحدك بينما يواصل المعتدي تهديده. اطلب عونًا مأمونًا، واحفظ ما يثبت الأذى، وامنح نفسك وقتًا لتستعيد إحساسك بالأمان. ما يفعله المعتدي مسؤوليته، وليس من حقه أن يجعل خوفك وسيلة للسيطرة عليك.","content":[{"type":"paragraph","text":"قد تكون رسالة واحدة كافية لتجعل الهاتف مصدر خوف. يهددك شخص بنشر صورة، أو يطلب مالًا، أو يدّعي أنه يملك أسرارًا عنك. وربما تكون حيرتك أكبر من قدرتك على شرح ما حدث، خاصة إن كنت تخشى معرفة أهلك أو أصدقائك. ما تتعرض له أذى حقيقي، وليس مجرد أمر صغير لأنه وقع خلف شاشة. والأولوية الآن لحمايتك، لا لإلقاء محاضرة عن تصرفاتك السابقة."},{"type":"heading","text":"لا تجعل الخوف يقودك إلى مزيد من الخطر"},{"type":"paragraph","text":"قد يدفع التهديد صاحبه إلى إرسال مال أو معلومات إضافية أو الدخول في جدال طويل. لكن كل خطوة تحتاج إلى تقدير أمانها أولًا. لا ترسل صورًا جديدة لإقناع المهدد بالتوقف، ولا تنشر الأدلة على الناس لإثبات ما حدث. احتفظ بها في مكان آمن، واطلب مساعدة جهة مختصة أو شخص تثق به."},{"type":"heading","text":"حرمة التجسس وإشاعة الأذى"},{"type":"verse","text":"﴿وَلَا تَجَسَّسُوا وَلَا يَغْتَبْ بَعْضُكُمْ بَعْضًا﴾","ref":"الحجرات: ١٢ — اقتباس من الآية"},{"type":"paragraph","text":"في سورة الحجرات نهي عن التجسس والغيبة، وفيه حفظ لخصوصية الناس وأعراضهم. لا تذكر الآية الأجهزة الحديثة، لكنها تقرر أصلًا واضحًا في حرمة التعدي."},{"type":"verse","text":"﴿إِنَّ الَّذِينَ يُحِبُّونَ أَنْ تَشِيعَ الْفَاحِشَةُ فِي الَّذِينَ آمَنُوا﴾","ref":"النور: ١٩ — اقتباس من الآية"},{"type":"paragraph","text":"جاءت الآية في سياق الإفك وإشاعة الفاحشة بين المؤمنين. صلتها أوضح بالتهديد بالنشر الفاضح وتشويه العرض، وليست نصًا خاصًا بكل مشكلة تقنية."},{"type":"heading","text":"حرمة الأذى لا تحتاج إلى اختراع آيات"},{"type":"paragraph","text":"ينهى القرآن عن التجسس والغيبة، وتأتي آية النور في سياق الإفك وإشاعة الفاحشة. تصل هذه المعاني بوضوح إلى الاعتداء على الخصوصية والسمعة، وخاصة التهديد بنشر أمور فاضحة. لكنها لا تصف تفاصيل الاختراق الرقمي؛ لذلك تبقى حماية الحسابات والأدلة والإبلاغ مسائل عملية يُرجع فيها إلى أهلها."},{"type":"heading","text":"خطوة آمنة قبل أي رد"},{"type":"paragraph","text":"احمِ حساباتك من جهاز موثوق إن أمكن، وغيّر كلمات المرور التي تعرضت للخطر، واحتفظ برسائل التهديد دون إعادة نشرها. اتصل بالجهة المختصة بحسب مستوى الخطر. وإذا كان هناك تهديد مباشر لحياتك أو سلامتك فاطلب الطوارئ فورًا."},{"type":"heading","text":"إذا كنت تقرأ لأجل شخص آخر"},{"type":"paragraph","text":"إذا لجأ إليك شخص يتعرض للابتزاز، فاستمع دون فضول أو لوم. ساعده على الوصول إلى جهة مناسبة، واحفظ خصوصيته ولا تعِد إرسال ما شاركه معك."},{"type":"heading","text":"دعاء من صياغة المؤلف"},{"type":"paragraph","text":"اللهم احفظني من الأذى، وأعنّي على التصرف بحكمة، واحفظ لي حقي وكرامتي."},{"type":"heading","text":"إذا جعلتك الشاشة تخشى الناس"},{"type":"paragraph","text":"لا ينبغي أن تتحمل خجلك وحدك بينما يواصل المعتدي تهديده. اطلب عونًا مأمونًا، واحفظ ما يثبت الأذى، وامنح نفسك وقتًا لتستعيد إحساسك بالأمان. ما يفعله المعتدي مسؤوليته، وليس من حقه أن يجعل خوفك وسيلة للسيطرة عليك."}]},{"id":23,"title":"حين يشغلك ذنب تعرفه","opening":"قد يكون أكثر ما يؤلمك هذه المرة أمرًا فعلته بيدك. تتذكر كلمة جارحة أو حقًا ضيعته أو خطأ تتمنى لو لم يقع. وربما تخاف أن يكون ما فعلته هو الاسم الذي ستبقى تعرف به نفسك. لن نهوّن الخطأ حتى يضيع حق من تأذى، ولن نجعل الندم سجنًا لا باب له. ما تحتاج إليه هو طريق صادق للرجوع.","verses":[{"text":"﴿قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنْفُسِهِمْ لَا تَقْنَطُوا مِنْ رَحْمَةِ اللَّهِ﴾","reference":"الزمر: ٥٣ — اقتباس من الآية","sura":"الزمر","number":"٥٣","explanation":"يدعو القرآن من أسرفوا على أنفسهم إلى عدم القنوط من رحمة الله. وهذا رجاء عظيم، ولا يتضمن إلغاء حقوق الناس أو الترخيص باستمرار الأذى."},{"text":"﴿وَلَمْ يُصِرُّوا عَلَىٰ مَا فَعَلُوا وَهُمْ يَعْلَمُونَ﴾","reference":"آل عمران: ١٣٥ — اقتباس من الآية","sura":"آل عمران","number":"١٣٥","explanation":"تصف الآية من يتذكرون الله بعد الخطأ ويستغفرون ولا يصرون عليه. في هذا دعوة إلى تصحيح الفعل، لا إلى الإقامة في احتقار النفس."}],"prayer":"ربنا ظلمنا أنفسنا وإن لم تغفر لنا وترحمنا لنكونن من الخاسرين. اللهم أعنّي على رد الحقوق وترك الأذى والثبات على الإصلاح.","closing":"لا تستطيع العودة إلى الأمس، لكن يمكنك أن تغير ما تفعل اليوم. إن كان عليك حق فأدّه، وإن كان عليك اعتذار فليكن صادقًا، وإن احتجت إلى سؤال فاسأل. وبعد أن تبدأ الإصلاح، لا تجعل القسوة على نفسك بديلًا عن التوبة والعمل.","content":[{"type":"paragraph","text":"قد يكون أكثر ما يؤلمك هذه المرة أمرًا فعلته بيدك. تتذكر كلمة جارحة أو حقًا ضيعته أو خطأ تتمنى لو لم يقع. وربما تخاف أن يكون ما فعلته هو الاسم الذي ستبقى تعرف به نفسك. لن نهوّن الخطأ حتى يضيع حق من تأذى، ولن نجعل الندم سجنًا لا باب له. ما تحتاج إليه هو طريق صادق للرجوع."},{"type":"heading","text":"ابدأ بتسمية الخطأ دون أن تُهِن نفسك"},{"type":"paragraph","text":"ما الذي وقع؟ ومن الذي تضرر؟ وهل ما زال الضرر مستمرًا؟ هذه أسئلة تساعدك على معرفة الإصلاح المطلوب. قد يكون الواجب التوقف عن الفعل، أو اعتذارًا صادقًا، أو رد مال أو حق، أو طلب حكم شرعي موثوق في مسألة تلتبس عليك. ليس كل اعتذار كافيًا، وليس كل تصحيح ممكنًا فورًا، لكن البداية تكون بصدق النظر إلى ما حدث."},{"type":"heading","text":"رحمة الله والتوبة الصادقة"},{"type":"verse","text":"﴿قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنْفُسِهِمْ لَا تَقْنَطُوا مِنْ رَحْمَةِ اللَّهِ﴾","ref":"الزمر: ٥٣ — اقتباس من الآية"},{"type":"paragraph","text":"يدعو القرآن من أسرفوا على أنفسهم إلى عدم القنوط من رحمة الله. وهذا رجاء عظيم، ولا يتضمن إلغاء حقوق الناس أو الترخيص باستمرار الأذى."},{"type":"verse","text":"﴿وَلَمْ يُصِرُّوا عَلَىٰ مَا فَعَلُوا وَهُمْ يَعْلَمُونَ﴾","ref":"آل عمران: ١٣٥ — اقتباس من الآية"},{"type":"paragraph","text":"تصف الآية من يتذكرون الله بعد الخطأ ويستغفرون ولا يصرون عليه. في هذا دعوة إلى تصحيح الفعل، لا إلى الإقامة في احتقار النفس."},{"type":"heading","text":"بين الرجاء والعمل"},{"type":"paragraph","text":"في القرآن نداء إلى من أسرفوا على أنفسهم ألا يقنطوا من رحمة الله، وفيه مدح لمن يستغفر ولا يصر على الذنب. يجتمع المعنيان: باب الرجوع مفتوح، والخطأ لا يصير صوابًا لأننا نرجو المغفرة. ومن رحمة هذا الطريق أن الندم يدعوك إلى الإصلاح لا إلى إلغاء قيمتك الإنسانية إلى آخر العمر."},{"type":"heading","text":"إصلاح يناسب الفعل"},{"type":"paragraph","text":"توقف عن الأذى إن كان قائمًا، وحدد الحق الذي يجب رده أو جبره، واستعن بأهل علم عند التباس الحكم. وإذا تحول الشعور بالذنب إلى خطر على سلامتك أو إلى أفكار إيذاء للنفس، فاطلب مساعدة عاجلة مناسبة؛ فحماية النفس لا تتعارض مع التوبة."},{"type":"heading","text":"مناجاة ودعاء · بعض الألفاظ من القرآن، والباقي من صياغة المؤلف"},{"type":"paragraph","text":"ربنا ظلمنا أنفسنا وإن لم تغفر لنا وترحمنا لنكونن من الخاسرين. اللهم أعنّي على رد الحقوق وترك الأذى والثبات على الإصلاح."},{"type":"heading","text":"إلى من أثقله ما فعل"},{"type":"paragraph","text":"لا تستطيع العودة إلى الأمس، لكن يمكنك أن تغير ما تفعل اليوم. إن كان عليك حق فأدّه، وإن كان عليك اعتذار فليكن صادقًا، وإن احتجت إلى سؤال فاسأل. وبعد أن تبدأ الإصلاح، لا تجعل القسوة على نفسك بديلًا عن التوبة والعمل."}]},{"id":24,"title":"حين تتأذى الأرض وما يعيش عليها","opening":"قد تمر بجانب شجرة يابسة أو ترى حيوانًا مصابًا أو ماءً تلوث، فتظن أن الأمر بعيد عن حياتك. لكنه ليس بعيدًا دائمًا؛ فالضرر قد يصل إلى إنسان لا تعرفه، وقد يمتد أثره إلى من يأتي بعدنا. ولسنا مطالبين بأن يحمل فرد واحد همّ الأرض كلها، لكننا نستطيع أن نسأل بصدق: هل هناك ضرر أعرفه ويمكنني أن أوقفه أو أساعد على تقليله؟","verses":[{"text":"﴿وَمَا مِنْ دَابَّةٍ فِي الْأَرْضِ وَلَا طَائِرٍ يَطِيرُ بِجَنَاحَيْهِ إِلَّا أُمَمٌ أَمْثَالُكُمْ﴾","reference":"الأنعام: ٣٨ — اقتباس من الآية","sura":"الأنعام","number":"٣٨","explanation":"تذكر الآية أن الدواب والطير أمم أمثالنا في سياق علم الله وخلقه وحشره. وهي تفتح باب النظر إلى المخلوقات بعين احترام، ولا تقدم تعليمات بيطرية."},{"text":"﴿وَلَا تُفْسِدُوا فِي الْأَرْضِ بَعْدَ إِصْلَاحِهَا﴾","reference":"الأعراف: ٥٦ — اقتباس من الآية","sura":"الأعراف","number":"٥٦","explanation":"النهي عن الإفساد في الأرض أصل عام في سياقه القرآني. ويمكن الاستئناس به في رفض الإضرار بالماء والبيئة والناس، مع الرجوع إلى العلم لتحديد نوع الضرر وكيفية معالجته."},{"text":"﴿وَأَحْسِنْ كَمَا أَحْسَنَ اللَّهُ إِلَيْكَ وَلَا تَبْغِ الْفَسَادَ فِي الْأَرْضِ﴾","reference":"القصص: ٧٧ — اقتباس من الآية","sura":"القصص","number":"٧٧","explanation":"ورد الأمر بالإحسان والنهي عن ابتغاء الفساد في خطاب قارون. ننظر إلى معناه الأخلاقي دون أن نجعله نصًا تفصيليًا في كل سياسة بيئية حديثة."}],"prayer":"رب أوزعني أن أشكر نعمتك وأن أعمل صالحًا ترضاه. اللهم ألهمني الرفق بخلقك وحسن التصرف فيما ائتمنتني عليه.","closing":"قد يكون أثر عملك صغيرًا، لكنه يصبح نافعًا حين يكون صحيحًا ومناسبًا. لا تحتاج إلى إنقاذ العالم وحدك حتى يكون لك نصيب من الإحسان. يكفي أن ترى ما يقع في قدرتك، وألا تمر على الضرر الممكن منعه وكأنه لا يعني أحدًا.","content":[{"type":"paragraph","text":"قد تمر بجانب شجرة يابسة أو ترى حيوانًا مصابًا أو ماءً تلوث، فتظن أن الأمر بعيد عن حياتك. لكنه ليس بعيدًا دائمًا؛ فالضرر قد يصل إلى إنسان لا تعرفه، وقد يمتد أثره إلى من يأتي بعدنا. ولسنا مطالبين بأن يحمل فرد واحد همّ الأرض كلها، لكننا نستطيع أن نسأل بصدق: هل هناك ضرر أعرفه ويمكنني أن أوقفه أو أساعد على تقليله؟"},{"type":"heading","text":"الرحمة تتسع لما حولنا"},{"type":"paragraph","text":"ليس كل ما يعيش معنا قادرًا على الكلام أو طلب الإنصاف. وللماء والهواء والتربة أثر في صحة الناس وحياتهم. لذلك ينبغي أن يصاحب التعاطفَ فعلٌ مناسب: منع تلوث، أو إبلاغ عن خطر، أو طلب مساعدة لإنقاذ حيوان، دون تعريض نفسك أو غيرك لأذى أكبر."},{"type":"heading","text":"الخلق والإحسان والنهي عن الفساد"},{"type":"verse","text":"﴿وَمَا مِنْ دَابَّةٍ فِي الْأَرْضِ وَلَا طَائِرٍ يَطِيرُ بِجَنَاحَيْهِ إِلَّا أُمَمٌ أَمْثَالُكُمْ﴾","ref":"الأنعام: ٣٨ — اقتباس من الآية"},{"type":"paragraph","text":"تذكر الآية أن الدواب والطير أمم أمثالنا في سياق علم الله وخلقه وحشره. وهي تفتح باب النظر إلى المخلوقات بعين احترام، ولا تقدم تعليمات بيطرية."},{"type":"verse","text":"﴿وَلَا تُفْسِدُوا فِي الْأَرْضِ بَعْدَ إِصْلَاحِهَا﴾","ref":"الأعراف: ٥٦ — اقتباس من الآية"},{"type":"paragraph","text":"النهي عن الإفساد في الأرض أصل عام في سياقه القرآني. ويمكن الاستئناس به في رفض الإضرار بالماء والبيئة والناس، مع الرجوع إلى العلم لتحديد نوع الضرر وكيفية معالجته."},{"type":"verse","text":"﴿وَأَحْسِنْ كَمَا أَحْسَنَ اللَّهُ إِلَيْكَ وَلَا تَبْغِ الْفَسَادَ فِي الْأَرْضِ﴾","ref":"القصص: ٧٧ — اقتباس من الآية"},{"type":"paragraph","text":"ورد الأمر بالإحسان والنهي عن ابتغاء الفساد في خطاب قارون. ننظر إلى معناه الأخلاقي دون أن نجعله نصًا تفصيليًا في كل سياسة بيئية حديثة."},{"type":"heading","text":"معنى عدم الإفساد"},{"type":"paragraph","text":"يذكر القرآن الدواب والطير أممًا، وينهى عن الإفساد في الأرض، ويدعو إلى الإحسان. هذه النصوص في سياقاتها الأصلية، ولا تغنينا عن المعرفة البيئية أو البيطرية عند وقوع ضرر محدد. لكن معناها يجعل إهمال ما حولنا أمرًا يستحق أن نفكر فيه، بدل أن نرى الطبيعة خلفية صامتة لحياتنا."},{"type":"heading","text":"ابدأ من الضرر الذي تعرفه"},{"type":"paragraph","text":"إذا رأيت حيوانًا جريحًا، فلا تلمسه إن كان ذلك يعرضك للخطر؛ اطلب جهة إنقاذ أو رعاية مختصة. وإذا لاحظت تسربًا أو تلوثًا، فقلل التعرض له وأبلغ الجهة المسؤولة. وفي حياتك اليومية، اختر ما يقلل الهدر حيث تستطيع، دون شعور بأنك مسؤول عن كل مشكلة في العالم."},{"type":"heading","text":"مناجاة ودعاء · بعض الألفاظ من القرآن، والباقي من صياغة المؤلف"},{"type":"paragraph","text":"رب أوزعني أن أشكر نعمتك وأن أعمل صالحًا ترضاه. اللهم ألهمني الرفق بخلقك وحسن التصرف فيما ائتمنتني عليه."},{"type":"heading","text":"من أجل ما لا يستطيع أن يشكو"},{"type":"paragraph","text":"قد يكون أثر عملك صغيرًا، لكنه يصبح نافعًا حين يكون صحيحًا ومناسبًا. لا تحتاج إلى إنقاذ العالم وحدك حتى يكون لك نصيب من الإحسان. يكفي أن ترى ما يقع في قدرتك، وألا تمر على الضرر الممكن منعه وكأنه لا يعني أحدًا."}]},{"id":25,"title":"حين يقترب العمر من نهايته","opening":"يتغير الإنسان مع السنوات. قد تضعف خطواته، أو يصبح ما كان ينجزه وحده محتاجًا إلى مساعدة. وربما يخشى أن يثقل على من يحب، فيسكت عن أمور يحتاجها. لكن العمر لا يسلب الإنسان حقه في أن يُسمع ويُحترم. ومن يرافق كبيرًا في السن قد يحبّه ويقلق عليه ويجهل مع ذلك كيف يوازن بين حمايته واحترام اختياراته.","verses":[{"text":"﴿اللَّهُ الَّذِي خَلَقَكُمْ مِنْ ضَعْفٍ ثُمَّ جَعَلَ مِنْ بَعْدِ ضَعْفٍ قُوَّةً ثُمَّ جَعَلَ مِنْ بَعْدِ قُوَّةٍ ضَعْفًا وَشَيْبَةً﴾","reference":"الروم: ٥٤ — اقتباس من الآية","sura":"الروم","number":"٥٤","explanation":"تصف الآية انتقال الإنسان من الضعف إلى القوة ثم الضعف والشيبة، في بيان خلق الله وقدرته. لا تجعل تغير الجسد انتقاصًا من منزلة صاحبه."},{"text":"﴿إِمَّا يَبْلُغَنَّ عِنْدَكَ الْكِبَرَ أَحَدُهُمَا أَوْ كِلَاهُمَا فَلَا تَقُلْ لَهُمَا أُفٍّ وَلَا تَنْهَرْهُمَا وَقُلْ لَهُمَا قَوْلًا كَرِيمًا﴾","reference":"الإسراء: ٢٣ — اقتباس من الآية","sura":"الإسراء","number":"٢٣","explanation":"تأمر الآية بالقول الكريم للوالدين والإحسان إليهما عند الكبر. وهي تذكرنا بحفظ الكرامة في الحديث والرعاية، مع الرجوع إلى أهل الاختصاص في تفاصيل العلاج والقرارات الصعبة."}],"prayer":"رب ارحمهما كما ربياني صغيرًا. اللهم ارحم ضعفنا، وأحسن إلينا في أعمارنا، وأعنّا على البر والعدل والرفق.","closing":"قد يتباطأ الجسد، لكن حاجة الإنسان إلى المودة والاحترام لا تتقاعد. امنح الكبير فرصة أن يختار ويتحدث ويشارك ما أمكن، ولا تنس أن من يرعاه يحتاج إلى سند أيضًا. ولعل خير ما يبقى من بعض الأيام شعور بسيط بأن أحدًا كان حاضرًا بقلبه.","content":[{"type":"paragraph","text":"يتغير الإنسان مع السنوات. قد تضعف خطواته، أو يصبح ما كان ينجزه وحده محتاجًا إلى مساعدة. وربما يخشى أن يثقل على من يحب، فيسكت عن أمور يحتاجها. لكن العمر لا يسلب الإنسان حقه في أن يُسمع ويُحترم. ومن يرافق كبيرًا في السن قد يحبّه ويقلق عليه ويجهل مع ذلك كيف يوازن بين حمايته واحترام اختياراته."},{"type":"heading","text":"اسأل الإنسان عما يريده"},{"type":"paragraph","text":"ربما يحتاج الكبير إلى من يتحدث معه قبل أن يرتب له المواعيد. لا تختصر حياته في قائمة أدوية، ولا تقرر عنه كل شيء وهو قادر على التعبير والاختيار. اسأله عمّا يسعده وما يزعجه ومن يحب أن يراه، وما المساعدة التي يرتاح إلى قبولها. وقد تحتاج الأسرة إلى مختص حين تصعب قرارات العلاج أو الرعاية."},{"type":"heading","text":"أطوار العمر والقول الكريم"},{"type":"verse","text":"﴿اللَّهُ الَّذِي خَلَقَكُمْ مِنْ ضَعْفٍ ثُمَّ جَعَلَ مِنْ بَعْدِ ضَعْفٍ قُوَّةً ثُمَّ جَعَلَ مِنْ بَعْدِ قُوَّةٍ ضَعْفًا وَشَيْبَةً﴾","ref":"الروم: ٥٤ — اقتباس من الآية"},{"type":"paragraph","text":"تصف الآية انتقال الإنسان من الضعف إلى القوة ثم الضعف والشيبة، في بيان خلق الله وقدرته. لا تجعل تغير الجسد انتقاصًا من منزلة صاحبه."},{"type":"verse","text":"﴿إِمَّا يَبْلُغَنَّ عِنْدَكَ الْكِبَرَ أَحَدُهُمَا أَوْ كِلَاهُمَا فَلَا تَقُلْ لَهُمَا أُفٍّ وَلَا تَنْهَرْهُمَا وَقُلْ لَهُمَا قَوْلًا كَرِيمًا﴾","ref":"الإسراء: ٢٣ — اقتباس من الآية"},{"type":"paragraph","text":"تأمر الآية بالقول الكريم للوالدين والإحسان إليهما عند الكبر. وهي تذكرنا بحفظ الكرامة في الحديث والرعاية، مع الرجوع إلى أهل الاختصاص في تفاصيل العلاج والقرارات الصعبة."},{"type":"heading","text":"الضعف طور لا انتقاص"},{"type":"paragraph","text":"تذكر آية الروم أطوار خلق الإنسان بين الضعف والقوة ثم الضعف والشيبة، في مقام بيان قدرة الله. وتأمر آية الإسراء بالإحسان إلى الوالدين والقول الكريم لهما عند الكبر. نستفيد من ذلك احترام الكبير، دون الادعاء بأن النصين يحددان تفاصيل الرعاية الحديثة أو القرارات الطبية."},{"type":"heading","text":"وقت للحقوق ووقت للصحبة"},{"type":"paragraph","text":"من الخير ترتيب الوثائق والحقوق والوصايا على وجه صحيح، والاستفسار عن خيارات الرعاية عند الحاجة. لكن لا تجعل كل حديث مع الكبير عن الدواء والمال والخوف من الغد. اترك له مجالًا لحكاية يحبها أو نزهة تناسب قدرته أو زيارة من يأنس به. وأحيانًا يكون الإصغاء عونًا لا يقل عن إنجاز معاملة."},{"type":"heading","text":"إذا كنت تقرأ لأجل شخص آخر"},{"type":"paragraph","text":"حين ترافق شخصًا كبيرًا، لا تتحدث عنه دائمًا وهو حاضر كأنه لا يسمع. خاطبه أولًا، واسأله عمّا يريده، ثم قدم العون بما يحفظ سلامته وكرامته."},{"type":"heading","text":"مناجاة ودعاء · بعض الألفاظ من القرآن، والباقي من صياغة المؤلف"},{"type":"paragraph","text":"رب ارحمهما كما ربياني صغيرًا. اللهم ارحم ضعفنا، وأحسن إلينا في أعمارنا، وأعنّا على البر والعدل والرفق."},{"type":"heading","text":"إلى من تقدمت به الأيام، وإلى من يحبه"},{"type":"paragraph","text":"قد يتباطأ الجسد، لكن حاجة الإنسان إلى المودة والاحترام لا تتقاعد. امنح الكبير فرصة أن يختار ويتحدث ويشارك ما أمكن، ولا تنس أن من يرعاه يحتاج إلى سند أيضًا. ولعل خير ما يبقى من بعض الأيام شعور بسيط بأن أحدًا كان حاضرًا بقلبه."}]}]};
</script><script>/* «لك في الأرض مسعى» — deterministic, transparent, offline-first interactive reading.
   Matching invariant: situation + selected pain guide the reading; no empty verse or story pages. */
(()=>{'use strict';
const D=window.MASAA_DATA;
const app=document.getElementById('app');
const printRoot=document.getElementById('print-root');
if(!D||!D.situations){app.textContent='تعذر تحميل مادة الكتاب. أعد فتح الحزمة كاملة.';return;}
const byId=new Map(D.situations.map(s=>[s.id,s]));
const chapters=new Map(D.chapters.map(c=>[c.id,c]));
const state={view:'cover',step:0,answers:{feeling:null,situation:null,pain:null,course:null,need:null},resultPage:0,chapter:null,search:'',fontScale:1,history:[],safetyReturnStep:2};
const TAG=(tag,cls,content)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(content!==undefined&&content!==null)e.textContent=String(content);return e;};
const parent=(p,...cs)=>{for(const c of cs){if(c)p.append(c);}return p;};
const paragraph=(s,cls='result-p')=>TAG('p',cls,s);
function button(txt,fn,style='primary',extra=''){const b=TAG('button','button '+style+' '+extra,txt);b.type='button';b.addEventListener('click',fn);return b;}
function textButton(txt,fn){const b=TAG('button','textbtn',txt);b.type='button';b.addEventListener('click',fn);return b;}

function icon(name,cssClass='ui-icon'){
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
 svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('width','20');svg.setAttribute('height','20');
 svg.setAttribute('fill','none');svg.setAttribute('stroke','currentColor');svg.setAttribute('stroke-width','1.8');
 svg.setAttribute('stroke-linecap','round');svg.setAttribute('stroke-linejoin','round');svg.classList.add(cssClass);svg.setAttribute('aria-hidden','true');
 const paths={
  home:['M3 10.5 12 3l9 7.5','M5.5 9.5V21h13V9.5','M9 21v-7h6v7'],
  back:['M12 4a8 8 0 1 1-7.4 5','M4 4v5h5'],
  book:['M12 6.5c-3.5-2-6-2.3-9-1v13c3-1.3 6-.9 9 1','M12 6.5c3.5-2 6-2.3 9-1v13c-3-1.3-6-.9-9 1','M12 6.5v13'],
  leaf:['M20 4c-10 0-15 5-15 12a4 4 0 0 0 4 4c7 0 12-5 11-16Z','M5 19c3-5 7-8 12-11'],
  minus:['M5 12h14'],plus:['M12 5v14','M5 12h14'],
  check:['M5 12.5 10 17l9-10'],
  heart:['M20.5 8.8c0 5-8.5 10.8-8.5 10.8S3.5 13.8 3.5 8.8a4.8 4.8 0 0 1 8.5-3 4.8 4.8 0 0 1 8.5 3Z'],
  file:['M6 3h9l4 4v14H6Z','M15 3v5h4','M9 13h7','M9 17h7']
 };
 (paths[name]||paths.book).forEach(d=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);svg.append(p);});
 return svg;
}
function iconButton(name,label,fn,extra=''){
 const b=TAG('button','icon-button '+extra);b.type='button';b.setAttribute('aria-label',label);b.title=label;b.append(icon(name));b.addEventListener('click',fn);return b;
}
function withIcon(btn,iconName){btn.prepend(icon(iconName));return btn;}
function notify(s){document.querySelector('.toast')?.remove();const el=TAG('div','toast',s);el.setAttribute('role','status');document.body.append(el);setTimeout(()=>el.remove(),2700);}
function scrollStart(){window.scrollTo({top:0,behavior:'instant'});}
function rerender(){
 app.innerHTML='';const full=state.view==='cover';if(!full)app.append(header());
 const main=TAG('main','wrap');main.id='stage';main.tabIndex=-1;
 const views={cover,quiz:question,safety,result,library,chapter,install,unmatched};
 if(!views[state.view])state.view='cover';
 main.append(views[state.view]());app.append(main);
 if(!full){const ft=TAG('footer','footer');ft.append(TAG('span','','© جهاد بن جمال الهنائي · لك في الأرض مسعى'));app.append(ft);}
 document.title=(state.view==='quiz'?`السؤال ${state.step+1} · `:state.view==='result'?'قراءتك · ':'')+'لك في الأرض مسعى';
 scrollStart();requestAnimationFrame(()=>{if(state.view!=='cover')document.getElementById('stage')?.focus({preventScroll:true});});
}
function goto(view,extra={}){state.history.push({view:state.view,step:state.step,resultPage:state.resultPage,chapter:state.chapter});state.view=view;Object.assign(state,extra);rerender();}
function back(){
 if(state.view==='quiz'){if(state.step>0){state.step--;rerender();return;}goto('cover');return;}
 if(state.view==='result'){if(state.resultPage>0){state.resultPage--;rerender();return;}goto('quiz',{step:4});return;}
 if(state.view==='chapter'){goto('library');return;}
 if(state.view==='safety'){goto('quiz',{step:Math.max(1,state.safetyReturnStep-1)});return;}
 goto('cover');
}
function clearQuiz(){state.step=0;state.resultPage=0;state.answers={feeling:null,situation:null,pain:null,course:null,need:null};}
function startQuiz(){clearQuiz();goto('quiz');}
function header(){
 const h=TAG('header','top');h.setAttribute('dir','rtl');
 const right=TAG('div','top-side top-right');
 right.append(iconButton('home','العودة إلى الصفحة الرئيسية',()=>goto('cover'),'home-button'));
 right.append(iconButton('back','الرجوع إلى الصفحة السابقة',back,'back-button'));
 const brand=textButton('مسعى',()=>goto('cover'));brand.className='brand';brand.title='العودة إلى الغلاف';
 const left=TAG('div','top-side top-left');
 left.append(iconButton('book','جميع الأبواب',()=>goto('library'),'chapters-button'));
 left.append(iconButton('minus','تصغير الخط',()=>changeFont(-1),'font-button'));
 left.append(iconButton('plus','تكبير الخط',()=>changeFont(1),'font-button'));
 h.append(right,brand,left);return h;
}
function changeFont(direction){
 const n=Math.max(.88,Math.min(1.54,Math.round((state.fontScale+direction*.11)*100)/100));
 if(n===state.fontScale){notify(direction>0?'وصل الخط إلى الحجم الأكبر':'وصل الخط إلى الحجم الأصغر');return;}
 state.fontScale=n;document.documentElement.style.setProperty('--text-scale',String(n));
 notify(direction>0?'تم تكبير الخط':'تم تصغير الخط');
}
function cover(){
 const w=TAG('section','cover');w.setAttribute('aria-label','غلاف لك في الأرض مسعى');
 const head=TAG('div','cover-head');
 parent(head,TAG('h1','cover-title','لك في الأرض مسعى'),TAG('p','cover-sub','ارحل إلى موضوع حاجتك من القرآن'),TAG('p','author',D.meta.author));
 const foot=TAG('div','cover-foot');
 const journey=withIcon(button('رحلة خاصة',startQuiz,'light cover-journey'),'leaf');
 const books=withIcon(button('جميع الأبواب',()=>goto('library'),'secondary cover-chapters'),'book');
 foot.append(journey,books);
 w.append(head,foot);return w;
}
function unmatched(){const w=TAG('section','max intro');const isPain=state.step===2;
 parent(w,TAG('div','sectiontag','لا نُجبرك على وصف لا يشبهك'),
 TAG('h1','title',isPain?'لم تجد ما يصف وجعك بدقة؟':'لم تجد حالتك بين الخيارات؟'),
 paragraph(isPain?'ربما اخترت الواقعة الصحيحة، لكن الأوجاع الثلاثة لا تعبّر عما يثقل عليك فيها. لن ننسب إليك واحدًا منها. يمكنك العودة والتغيير أو قراءة موضوعك مباشرة.':'قد لا تعبر الخيارات الحالية عن ظروفك. لا نريد أن نأخذك إلى قصة أو آية لا تتصل بك لمجرد إنهاء الأسئلة.','prose'));
 const ac=TAG('div','actions');parent(ac,button('العودة إلى الاختيارات',()=>goto('quiz',{step:isPain?2:1})),button('قراءة أبواب الكتاب',()=>goto('library'),'secondary'),button('العودة إلى الغلاف',()=>goto('cover'),'ghost'));w.append(ac);return w;}
function question(){
 const wrap=TAG('section','question-page');
 const heads=['ما الذي يثقل قلبك اليوم؟','أيّ أمر تمرّ به؟','ما أكثر ما يؤلمك في هذا الأمر؟','كيف هو هذا الأمر في حياتك الآن؟','ما الذي تحتاج إليه الآن؟'];
 const step=state.step;const sit=byId.get(state.answers.situation);
 const title=heads[step];
 const top=TAG('div','question-top');
 parent(top,TAG('div','num',`السؤال ${step+1} من 5`));
 if(step===2&&sit)top.append(TAG('div','context-label',sit.label));
 top.append(TAG('h1','question-title',title));
 const rail=TAG('div','rail');rail.setAttribute('role','progressbar');rail.setAttribute('aria-valuemin','1');rail.setAttribute('aria-valuemax','5');rail.setAttribute('aria-valuenow',String(step+1));
 const prog=TAG('b');prog.style.width=((step+1)*20)+'%';rail.append(prog);wrap.append(top,rail);
 const choices=TAG('div','choicegrid');
 getChoices().forEach((c,i)=>{
  const b=TAG('button','choice');b.type='button';b.dataset.choiceId=c.id;b.dataset.choiceIndex=i;
  b.append(TAG('span','choice-label',c.label));b.addEventListener('click',()=>choose(c));choices.append(b);
 });
 wrap.append(choices);
 if(step===1)choices.append(button('حالتي غير موجودة',()=>goto('unmatched'),'ghost','unmatched-choice'));
 if(step===2)choices.append(button('لا يصفني أيٌّ من هذه الاختيارات',()=>goto('unmatched'),'ghost','unmatched-choice'));

function library(){const w=TAG('section','max intro');parent(w,TAG('div','sectiontag','الكتاب الكامل'),TAG('h1','title','الأبواب الخمسة والعشرون'),paragraph('خمسة وعشرون بابًا من القرآن والحياة.','sub'));
 const input=TAG('input','search');input.type='search';input.placeholder='ابحث في عناوين الأبواب…';input.setAttribute('aria-label','البحث في الأبواب');input.value=state.search;w.append(input);const listing=TAG('div','library-grid');w.append(listing);
 function fill(){listing.innerHTML='';const q=input.value.trim();state.search=q;const selected=D.chapters.filter(c=>!q||c.title.includes(q)||c.opening.includes(q));for(const c of selected){const b=TAG('button','library-item');b.type='button';b.append(TAG('span','library-num',`الباب ${c.id}`),TAG('span','library-name',c.title));b.addEventListener('click',()=>goto('chapter',{chapter:c.id}));listing.append(b);}if(!selected.length)listing.append(TAG('p','no-results','لم أجد عنوانًا يطابق البحث. جرّب كلمة أقصر.'));}
 input.addEventListener('input',fill);fill();return w;}
function chapter(){const c=chapters.get(state.chapter);if(!c)return library();const w=TAG('article','max paper');w.append(TAG('div','sectiontag',`من الكتاب · الباب ${c.id}`));w.append(TAG('h1','title',c.title));w.append(TAG('div','bookline'));
 for(const item of c.content){if(item.type==='heading'){const h=TAG('h2','library-name',item.text);h.style.margin='25px 0 9px';w.append(h);}else if(item.type==='verse'){const box=TAG('div','scripture');box.append(TAG('p','verse',item.text),TAG('p','ref',item.ref||''));w.append(box);}else if(item.text)w.append(paragraph(item.text));}
 const buttons=TAG('div','actions chapter-actions');parent(buttons,withIcon(button('العودة إلى الأبواب',()=>goto('library'),'primary'),'book'),withIcon(button('الصفحة الرئيسية',()=>goto('cover'),'ghost'),'home'));w.append(buttons);return w;}
function install(){const w=TAG('section','max intro');parent(w,TAG('div','sectiontag','على هاتفك'),TAG('h1','title','الكتاب يصل إليك حيث أنت'),paragraph('يمكن إضافة الكتاب إلى الشاشة الرئيسية بعد نشره على رابط HTTPS. بعد أول تحميل ناجح تُخزّن صفحاته الأساسية للقراءة دون إنترنت بحسب إمكانات متصفحك.','prose'));w.append(TAG('h2','library-name','على الآيفون'));w.append(paragraph('افتح الرابط في Safari، ثم اضغط زر المشاركة واختر «إضافة إلى الشاشة الرئيسية».','prose'));w.append(TAG('h2','library-name','على أندرويد'));w.append(paragraph('افتح الرابط في Chrome، ثم من قائمة المتصفح اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».','prose'));w.append(paragraph('فتح ملف HTML محليًا يسمح بتجربة الكتاب، لكنه لا يمنح مزايا التثبيت والتحديث التلقائي التي يوفرها HTTPS.','trust'));w.append(button('العودة إلى الغلاف',()=>goto('cover'),'secondary'));return w;}
function makePrintable(){const o=outcome();printRoot.innerHTML='';const front=TAG('section');parent(front,TAG('h1','print-title','لك في الأرض مسعى'),TAG('p','print-caption',o.scenario.label),TAG('p','print-caption','جهاد بن جمال الهنائي'),TAG('p','print-small','ارحل إلى موضوع حاجتك من القرآن'));printRoot.append(front);
 for(const x of o.parts){const sec=TAG('section');sec.append(TAG('p','print-small',x.kicker),TAG('h2','print-part-title',x.title));for(const v of x.verses||[]){sec.append(TAG('p','print-scripture',v.quote),TAG('p','print-ref',v.reference),TAG('p','print-paragraph',v.explanation));}for(const p of x.paras||[])sec.append(TAG('p','print-paragraph',p));if(x.prayer)sec.append(TAG('p','print-paragraph','دعاء بصياغة المؤلف: '+x.prayer));printRoot.append(sec);}}
function exportResult(){makePrintable();window.print();}
function textReading(){const o=outcome();return `لك في الأرض مسعى\n${D.meta.author}\n\n${o.scenario.label}\nأكثر ما يؤلمك: ${o.selectedPain}\n\n`+o.parts.map(p=>p.title+'\n'+[...(p.verses||[]).flatMap(v=>[v.quote,v.reference,v.explanation]),...(p.paras||[]),p.prayer?'دعاء بصياغة المؤلف: '+p.prayer:''].filter(Boolean).join('\n\n')).join('\n\nــــــ\n\n');}
async function copyReading(){const v=textReading();try{await navigator.clipboard.writeText(v);notify('نُسخت القراءة');}catch(e){const ta=TAG('textarea');ta.value=v;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();let ok=document.execCommand('copy');ta.remove();notify(ok?'نُسخت القراءة':'تعذر النسخ؛ استعمل حفظ PDF');}}
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.view!=='cover')back();if(state.view==='result'&&state.resultPage>=1){if(e.key==='ArrowLeft'&&state.resultPage<outcome().parts.length){state.resultPage++;rerender();}else if(e.key==='ArrowRight'){state.resultPage--;rerender();}}});
// Read-only audit interface used by shipped tests. Never transmits or stores selections.
window.MasaaAudit=Object.freeze({
 getCount:()=>D.situations.length,
 listCases:()=>D.situations.map(s=>({id:s.id,feeling:s.feeling,chapter:s.chapter,verseKeys:[...s.verseKeys],theme:s.theme,isRisk:s.isRisk})),
 simulate:(id,pain=0,course='long',need='balance')=>{
 const s=byId.get(id);if(!s)throw Error('Unknown case');if(pain<0||pain>=s.pains.length)throw Error('Invalid pain');
 const b={...state.answers};state.answers={feeling:s.feeling,situation:id,pain,course,need};let r;try{r=outcome();}finally{state.answers=b;}return JSON.parse(JSON.stringify({scenarioId:r.scenario.id,title:r.scenario.label,pain:r.selectedPain,course:r.course.id,need:r.need.id,verseRefs:r.verseRefs,storyKey:r.storyKey,parts:r.parts,risk:r.risk,selectedPainGuidance:r.selectedPainGuidance}));},
 getView:()=>({view:state.view,step:state.step,page:state.resultPage,scenario:state.answers.situation}),
 reset:startQuiz,
});
rerender();
if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(()=>{});
})();
</script></body></html>
