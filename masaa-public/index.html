ِ﴾","reference":"يوسف: ٨٦","explanation":"قال يعقوب إنه يشكو بثه وحزنه إلى الله. في هذا موضع للتوجه إلى الله حين يثقل القلب، دون إنكار الشعور أو الادعاء بأن الإنسان لا يتألم.","chapter":9,"url":null},"البقرة:١٥٥":{"id":"البقرة:١٥٥","quote":"﴿وَلَنَبْلُوَنَّكُمْ بِشَيْءٍ مِنَ الْخَوْفِ وَالْجُوعِ وَنَقْصٍ مِنَ الْأَمْوَالِ وَالْأَنْفُسِ وَالثَّمَرَاتِ ۗ وَبَشِّرِ الصَّابِرِينَ﴾","reference":"البقرة: ١٥٥","explanation":"تذكر الآية أن الحياة قد تمر بالخوف والجوع والفقد، وتبشّر الصابرين. ولا ينبغي جعل الابتلاء نسخة واحدة تتشابه تفاصيلها عند كل إنسان.","chapter":9,"url":null},"الشورى:٤١":{"id":"الشورى:٤١","quote":"﴿وَلَمَنِ انْتَصَرَ بَعْدَ ظُلْمِهِ فَأُولَٰئِكَ مَا عَلَيْهِمْ مِنْ سَبِيلٍ﴾","reference":"الشورى: ٤١","explanation":"تذكر الآية حق المظلوم في الانتصاف ضمن حدود العدل. فالمطالبة بالحق ليست اعتداء، كما أن شدة الظلم لا تبيح تجاوز حدود الحق.","chapter":16,"url":null},"النساء:١٣٥":{"id":"النساء:١٣٥","quote":"﴿كُونُوا قَوَّامِينَ بِالْقِسْطِ شُهَدَاءَ لِلَّهِ وَلَوْ عَلَىٰ أَنْفُسِكُمْ﴾","reference":"النساء: ١٣٥","explanation":"يأمر القرآن بالعدل حتى حين يتعلق الأمر بالنفس أو القريب. وهذا خطاب لمن يشهد ويملك القرار، وليس مطالبةً لصاحب الحق بأن يثبت كل شيء وحده.","chapter":16,"url":null},"النساء:٩":{"id":"النساء:٩","quote":"﴿وَلْيَخْشَ الَّذِينَ لَوْ تَرَكُوا مِنْ خَلْفِهِمْ ذُرِّيَّةً ضِعَافًا خَافُوا عَلَيْهِمْ﴾","reference":"النساء: ٩","explanation":"وردت الآية في سياق حقوق من يتركون خلفهم ذرية ضعافًا وما يتصل بالوصايا. نستفيد من معناها وجوب رعاية الضعيف والعدل في شأنه، دون نسب إجراءات حماية الأطفال المعاصرة إليها نصًا.","chapter":11,"url":null},"الحجرات:١١":{"id":"الحجرات:١١","quote":"﴿لَا يَسْخَرْ قَوْمٌ مِنْ قَوْمٍ عَسَىٰ أَنْ يَكُونُوا خَيْرًا مِنْهُمْ﴾","reference":"الحجرات: ١١","explanation":"تنهي الآية عن السخرية واللمز والتنابز بالألقاب. فالإهانة ليست أمرًا هينًا، سواء صدرت من كبير أو بين الصغار، ويحتاج الطفل إلى من يوقفها ويحميه.","chapter":11,"url":null},"طه:١١٤":{"id":"طه:١١٤","quote":"﴿وَقُلْ رَبِّ زِدْنِي عِلْمًا﴾","reference":"طه: ١١٤","explanation":"في قوله تعالى «وقل رب زدني علمًا» توجيه إلى طلب المزيد من العلم. نستطيع أن نأخذ منه حب التعلم والدعاء به، مع مواصلة الأخذ بأسبابه الواقعية.","chapter":12,"url":null},"الروم:٢١":{"id":"الروم:٢١","quote":"﴿وَجَعَلَ بَيْنَكُمْ مَوَدَّةً وَرَحْمَةً﴾","reference":"الروم: ٢١","explanation":"تذكر الآية من آيات الله أن جعل بين الزوجين مودة ورحمة. هي في سياق الزواج، فلا نجعلها وعدًا بأن كل علاقة ستسير بلا خلاف.","chapter":13,"url":null},"النساء:١٩":{"id":"النساء:١٩","quote":"﴿وَعَاشِرُوهُنَّ بِالْمَعْرُوفِ﴾","reference":"النساء: ١٩","explanation":"الأمر بالمعاشرة بالمعروف يتناول حسن المعاملة وكف الأذى في الحياة الزوجية. فلا تصبح القسوة أمرًا مقبولًا لأنها تقع داخل بيت.","chapter":13,"url":null},"الإسراء:٥٣":{"id":"الإسراء:٥٣","quote":"﴿وَقُلْ لِعِبَادِي يَقُولُوا الَّتِي هِيَ أَحْسَنُ﴾","reference":"الإسراء: ٥٣","explanation":"يدعو القرآن إلى اختيار الكلام الأحسن. وهذا يعين على تهدئة الخلافات الممكن حلها، لكنه لا يلزم المتضرر بمحادثة شخص يهدد سلامته.","chapter":13,"url":null},"الإسراء:٢٣":{"id":"الإسراء:٢٣","quote":"﴿إِمَّا يَبْلُغَنَّ عِنْدَكَ الْكِبَرَ أَحَدُهُمَا أَوْ كِلَاهُمَا فَلَا تَقُلْ لَهُمَا أُفٍّ وَلَا تَنْهَرْهُمَا وَقُلْ لَهُمَا قَوْلًا كَرِيمًا﴾","reference":"الإسراء: ٢٣","explanation":"تأمر الآية بالقول الكريم للوالدين والإحسان إليهما عند الكبر. وهي تذكرنا بحفظ الكرامة في الحديث والرعاية، مع الرجوع إلى أهل الاختصاص في تفاصيل العلاج والقرارات الصعبة.","chapter":25,"url":null},"الإسراء:٢٤":{"id":"الإسراء:٢٤","quote":"﴿وَقُلْ رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا﴾","reference":"الإسراء: ٢٤","explanation":"يرشد الدعاء القرآني إلى سؤال الله الرحمة للوالدين. يمكن أن يرافق الدعاءُ الرعايةَ العملية دون أن يحل محلها.","chapter":14,"url":null},"النساء:٣٦":{"id":"النساء:٣٦","quote":"﴿وَالْجَارِ ذِي الْقُرْبَىٰ وَالْجَارِ الْجُنُبِ وَالصَّاحِبِ بِالْجَنْبِ﴾","reference":"النساء: ٣٦","explanation":"تجمع الآية أصنافًا من الناس أُمر المسلم بالإحسان إليهم، ومنهم الجار والصاحب. وفيها تذكير بأن المبادرة إلى السؤال والرعاية مسؤولية من يستطيع، لا عبء من يشعر بالوحدة وحده.","chapter":15,"url":null},"الشعراء:١٨١":{"id":"الشعراء:١٨١","quote":"﴿أَوْفُوا الْكَيْلَ وَلَا تَكُونُوا مِنَ الْمُخْسِرِينَ﴾","reference":"الشعراء: ١٨١","explanation":"جاء الأمر بإيفاء الكيل في خطاب شعيب لقومه، في سياق منع بخس الناس حقوقهم. نستفيد منه وجوب الأمانة، ولا نحوله إلى ضمان لنجاح كل مشروع.","chapter":17,"url":null},"الإسراء:٣٦":{"id":"الإسراء:٣٦","quote":"﴿وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ﴾","reference":"الإسراء: ٣٦","explanation":"النهي عن اتباع ما ليس لنا به علم يدعونا إلى التثبت. في القرارات المعاصرة يعني ذلك ألا نبني أمرًا كبيرًا على خبر غير موثوق أو افتراض لم نفحصه.","chapter":18,"url":null},"الحشر:٨":{"id":"الحشر:٨","quote":"﴿لِلْفُقَرَاءِ الْمُهَاجِرِينَ الَّذِينَ أُخْرِجُوا مِنْ دِيَارِهِمْ وَأَمْوَالِهِمْ﴾","reference":"الحشر: ٨","explanation":"ورد ذكر المهاجرين الذين أُخرجوا من ديارهم وأموالهم في سياق آيات الفيء. يقر القرآن بهذه المحنة التي عاشوها، ولا يصوغ وعدًا خاصًا بكل مهجّر في زماننا.","chapter":19,"url":null},"الحشر:٩":{"id":"الحشر:٩","quote":"﴿يُحِبُّونَ مَنْ هَاجَرَ إِلَيْهِمْ﴾","reference":"الحشر: ٩","explanation":"تمدح الآية الأنصار الذين أحبوا من هاجر إليهم. فهي تذكّرنا بأن مسؤولية الإيواء والإحسان تقع أيضًا على من يملك القدرة على استقبال غيره.","chapter":19,"url":null},"الزمر:٥٣":{"id":"الزمر:٥٣","quote":"﴿قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنْفُسِهِمْ لَا تَقْنَطُوا مِنْ رَحْمَةِ اللَّهِ﴾","reference":"الزمر: ٥٣","explanation":"يدعو القرآن من أسرفوا على أنفسهم إلى عدم القنوط من رحمة الله. وهذا رجاء عظيم، ولا يتضمن إلغاء حقوق الناس أو الترخيص باستمرار الأذى.","chapter":23,"url":null},"آل عمران:١٣٥":{"id":"آل عمران:١٣٥","quote":"﴿وَلَمْ يُصِرُّوا عَلَىٰ مَا فَعَلُوا وَهُمْ يَعْلَمُونَ﴾","reference":"آل عمران: ١٣٥","explanation":"تصف الآية من يتذكرون الله بعد الخطأ ويستغفرون ولا يصرون عليه. في هذا دعوة إلى تصحيح الفعل، لا إلى الإقامة في احتقار النفس.","chapter":23,"url":null},"الحجرات:١٢":{"id":"الحجرات:١٢","quote":"﴿وَلَا تَجَسَّسُوا وَلَا يَغْتَبْ بَعْضُكُمْ بَعْضًا﴾","reference":"الحجرات: ١٢","explanation":"في سورة الحجرات نهي عن التجسس والغيبة، وفيه حفظ لخصوصية الناس وأعراضهم. لا تذكر الآية الأجهزة الحديثة، لكنها تقرر أصلًا واضحًا في حرمة التعدي.","chapter":22,"url":null},"النور:١٩":{"id":"النور:١٩","quote":"﴿إِنَّ الَّذِينَ يُحِبُّونَ أَنْ تَشِيعَ الْفَاحِشَةُ فِي الَّذِينَ آمَنُوا﴾","reference":"النور: ١٩","explanation":"جاءت الآية في سياق الإفك وإشاعة الفاحشة بين المؤمنين. صلتها أوضح بالتهديد بالنشر الفاضح وتشويه العرض، وليست نصًا خاصًا بكل مشكلة تقنية.","chapter":22,"url":null},"الأنعام:٣٨":{"id":"الأنعام:٣٨","quote":"﴿وَمَا مِنْ دَابَّةٍ فِي الْأَرْضِ وَلَا طَائِرٍ يَطِيرُ بِجَنَاحَيْهِ إِلَّا أُمَمٌ أَمْثَالُكُمْ﴾","reference":"الأنعام: ٣٨","explanation":"تذكر الآية أن الدواب والطير أمم أمثالنا في سياق علم الله وخلقه وحشره. وهي تفتح باب النظر إلى المخلوقات بعين احترام، ولا تقدم تعليمات بيطرية.","chapter":24,"url":null},"الأعراف:٥٦":{"id":"الأعراف:٥٦","quote":"﴿وَلَا تُفْسِدُوا فِي الْأَرْضِ بَعْدَ إِصْلَاحِهَا﴾","reference":"الأعراف: ٥٦","explanation":"النهي عن الإفساد في الأرض أصل عام في سياقه القرآني. ويمكن الاستئناس به في رفض الإضرار بالماء والبيئة والناس، مع الرجوع إلى العلم لتحديد نوع الضرر وكيفية معالجته.","chapter":24,"url":null},"القصص:٧٧":{"id":"القصص:٧٧","quote":"﴿وَأَحْسِنْ كَمَا أَحْسَنَ اللَّهُ إِلَيْكَ وَلَا تَبْغِ الْفَسَادَ فِي الْأَرْضِ﴾","reference":"القصص: ٧٧","explanation":"ورد الأمر بالإحسان والنهي عن ابتغاء الفساد في خطاب قارون. ننظر إلى معناه الأخلاقي دون أن نجعله نصًا تفصيليًا في كل سياسة بيئية حديثة.","chapter":24,"url":null},"الروم:٥٤":{"id":"الروم:٥٤","quote":"﴿اللَّهُ الَّذِي خَلَقَكُمْ مِنْ ضَعْفٍ ثُمَّ جَعَلَ مِنْ بَعْدِ ضَعْفٍ قُوَّةً ثُمَّ جَعَلَ مِنْ بَعْدِ قُوَّةٍ ضَعْفًا وَشَيْبَةً﴾","reference":"الروم: ٥٤","explanation":"تصف الآية انتقال الإنسان من الضعف إلى القوة ثم الضعف والشيبة، في بيان خلق الله وقدرته. لا تجعل تغير الجسد انتقاصًا من منزلة صاحبه.","chapter":25,"url":null},"البقرة:١٥٦":{"id":"البقرة:١٥٦","quote":"﴿إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ﴾","reference":"البقرة: ١٥٦ — مقتطف من الآية","explanation":"تُذكر هذه الكلمات ضمن وصف المؤمنين حين تصيبهم مصيبة. تعزّي في حقيقة الرجوع إلى الله، ولا تعني أن الحزن يجب أن يختفي فورًا.","chapter":null,"url":"https://quran.com/2/156"},"الملك:٢":{"id":"الملك:٢","quote":"﴿الَّذِي خَلَقَ الْمَوْتَ وَالْحَيَاةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًا﴾","reference":"الملك: ٢ — مقتطف من الآية","explanation":"تبيّن الآية أن الحياة موضع عمل وابتلاء، لا سباقًا في المقارنة بين الناس. ولا تقيس قيمة إنسان بعمره أو بماله.","chapter":null,"url":"https://quran.com/67/2"}},"stories":{"absence":{"title":"في قصة يعقوب عليه السلام","text":"حكى القرآن حزن يعقوب عليه السلام على يوسف، ونقل شكواه إلى الله. كانت عودة يوسف من أحداث قصته، وليست وعدًا بعودة كل غائب."},"illness":{"title":"من دعاء أيوب عليه السلام","text":"قال أيوب عليه السلام إنه مسه الضر وسأل الله برحمته. وذكر القرآن أن الله كشف ضرّه؛ وهذا خبر عن أيوب، لا ضمان طبي بمآل مطابق لكل مريض."},"job":{"title":"موسى عليه السلام حين احتاج إلى الخير","text":"بعد أن أعان المرأتين بالسقيا، دعا موسى ربه مفتقرًا إلى الخير. نتعلم من المشهد الجمع بين الفعل النافع والدعاء، من غير وعد بتكرار تفاصيل القصة."},"shelter":{"title":"دعاء الفتية في الكهف","text":"لجأ الفتية إلى الكهف وسألوا الله الرحمة والرشد. قصتهم في سياق مخصوص من طلب الحماية؛ وليست وصفة لكل حالة فقد مسكن."},"not_used_exile":{"title":"المهاجرون والأنصار","text":"ذكر القرآن من أُخرجوا من ديارهم، وأثنى على من أحسن استقبالهم. الآيات في سياق الهجرة والفيء؛ ونستفيد منها الاعتراف بوجع الفقد ومسؤولية من يستطيع المعونة."}},"chapters":[{"id":1,"title":"حين تخشى على حياة إنسان","opening":"قد تقع أمامك لحظة لا تعرف فيها من أين تبدأ. تسمع استغاثة، أو ترى إنسانًا يتألم، أو تشعر أن الخطر اقترب منك. في مثل هذه اللحظة، قد ترتجف يدك وتختلط عليك الكلمات. هذا مفهوم؛ فالخوف ليس عيبًا، ولا يحتاج الإنسان إلى أن يبدو شجاعًا حتى يستحق النجدة. أهم ما في هذه الساعة أن تصل المساعدة، وأن يبقى الناس في أمان.","verses":[{"text":"﴿وَلَا تَقْتُلُوا أَنْفُسَكُمْ إِنَّ اللَّهَ كَانَ بِكُمْ رَحِيمًا﴾","reference":"النساء: ٢٩ — اقتباس من الآية","sura":"النساء","number":"٢٩","explanation":"الآية من سياق ينهى عن الاعتداء وأكل الأموال بالباطل، وفيها نهي عن قتل النفس وذكر رحمة الله. نستفيد منها حرمة تعريض النفس للهلاك، أما ما يجب فعله طبيًا فيُعرف من أهل الطوارئ لا من تفسير آية وحدها."},{"text":"﴿وَمَنْ أَحْيَاهَا فَكَأَنَّمَا أَحْيَا النَّاسَ جَمِيعًا﴾","reference":"المائدة: ٣٢ — اقتباس من الآية","sura":"المائدة","number":"٣٢","explanation":"ورد هذا المعنى في حديث القرآن لبني إسرائيل عن عِظَم شأن النفس. يفتح لنا باب تقدير إنقاذ الحياة، من غير أن نحوله إلى تعليمات إسعاف تفصيلية."},{"text":"﴿وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ﴾","reference":"المائدة: ٢ — اقتباس من الآية","sura":"المائدة","number":"٢","explanation":"التعاون على الخير يشمل من يملك القدرة على الإعانة. لا ينبغي أن يبقى المستغيث وحده ما دام هناك من يستطيع المساعدة بأمان."}],"prayer":"اللهم احفظ الأرواح، وارحم من أصابه الخوف، وهيّئ للمحتاج من يعينه برفق وحكمة.","closing":"ربما ستتذكر ما جرى وتقول: ليتني فعلت شيئًا آخر. تعلّم من التجربة ما ينفع، ولكن لا تقْسُ على نفسك بسبب ارتباك أصابك في ساعة صعبة. النجاة نفسها نعمة تستحق الحمد، والراحة بعدها ليست تقصيرًا.","content":[{"type":"paragraph","text":"قد تقع أمامك لحظة لا تعرف فيها من أين تبدأ. تسمع استغاثة، أو ترى إنسانًا يتألم، أو تشعر أن الخطر اقترب منك. في مثل هذه اللحظة، قد ترتجف يدك وتختلط عليك الكلمات. هذا مفهوم؛ فالخوف ليس عيبًا، ولا يحتاج الإنسان إلى أن يبدو شجاعًا حتى يستحق النجدة. أهم ما في هذه الساعة أن تصل المساعدة، وأن يبقى الناس في أمان."},{"type":"heading","text":"حين تكون السلامة أول الكلام"},{"type":"paragraph","text":"إذا كان الخطر أمامك الآن، فلا تنشغل بإتمام الفصل. انتقل إلى موضع آمن إن استطعت، واتصل بالجهة المختصة، واذكر أين أنت وما الذي يحدث. لا يلزمك سرد القصة من بدايتها؛ قد تكفي معلومة واضحة لتقرب العون إلى من يحتاجه."},{"type":"heading","text":"حفظ الحياة في القرآن"},{"type":"verse","text":"﴿وَلَا تَقْتُلُوا أَنْفُسَكُمْ إِنَّ اللَّهَ كَانَ بِكُمْ رَحِيمًا﴾","ref":"النساء: ٢٩ — اقتباس من الآية"},{"type":"paragraph","text":"الآية من سياق ينهى عن الاعتداء وأكل الأموال بالباطل، وفيها نهي عن قتل النفس وذكر رحمة الله. نستفيد منها حرمة تعريض النفس للهلاك، أما ما يجب فعله طبيًا فيُعرف من أهل الطوارئ لا من تفسير آية وحدها."},{"type":"verse","text":"﴿وَمَنْ أَحْيَاهَا فَكَأَنَّمَا أَحْيَا النَّاسَ جَمِيعًا﴾","ref":"المائدة: ٣٢ — اقتباس من الآية"},{"type":"paragraph","text":"ورد هذا المعنى في حديث القرآن لبني إسرائيل عن عِظَم شأن النفس. يفتح لنا باب تقدير إنقاذ الحياة، من غير أن نحوله إلى تعليمات إسعاف تفصيلية."},{"type":"verse","text":"﴿وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ﴾","ref":"المائدة: ٢ — اقتباس من الآية"},{"type":"paragraph","text":"التعاون على الخير يشمل من يملك القدرة على الإعانة. لا ينبغي أن يبقى المستغيث وحده ما دام هناك من يستطيع المساعدة بأمان."},{"type":"heading","text":"لكل إنسان دوره"},{"type":"paragraph","text":"قد لا يستطيع المصاب إلا أن ينادي، وقد يعرف أحد الشهود المكان، وقد تملك جهة الإنقاذ ما لا يملكه الحاضرون. لذلك لا نضع المسؤولية كلها على كتف شخص خائف. والوقوف إلى جانب المحتاج قد يكون بإيصال الخبر الصحيح، أو إبعاد خطر، أو إفساح الطريق لأهل الخبرة. لا تجعل رغبتك في المساعدة سببًا لتعريض حياة أخرى للخطر."},{"type":"heading","text":"ما يمكنك فعله الآن"},{"type":"paragraph","text":"اتصل بالطوارئ إذا كان الخطر عاجلًا، وأعطهم موقعك ووصفًا موجزًا للحالة، واتبع توجيهاتهم. وإذا كنت تقرأ بعد أن انتهى الموقف، فاسمح لنفسك باستعادة هدوئها؛ فقد يستمر الارتباك حتى بعدما يصبح المكان آمنًا."},{"type":"heading","text":"إذا كنت تقرأ لأجل شخص آخر"},{"type":"paragraph","text":"إذا كنت قريبًا من إنسان في خطر، ساعده على التواصل مع النجدة، واسأله عن المكان وما يحتاج إليه. تحدث معه بوضوح وهدوء، ولا تطلب منه ترتيب روايته وهو يرتجف."},{"type":"heading","text":"دعاء من صياغة المؤلف"},{"type":"paragraph","text":"اللهم احفظ الأرواح، وارحم من أصابه الخوف، وهيّئ للمحتاج من يعينه برفق وحكمة."},{"type":"heading","text":"إذا بقي فيك شيء من الخوف"},{"type":"paragraph","text":"ربما ستتذكر ما جرى وتقول: ليتني فعلت شيئًا آخر. تعلّم من التجربة ما ينفع، ولكن لا تقْسُ على نفسك بسبب ارتباك أصابك في ساعة صعبة. النجاة نفسها نعمة تستحق الحمد، والراحة بعدها ليست تقصيرًا."}]},{"id":2,"title":"حين لا تجد ما يكفي من الطعام","opening":"قد يأتي وقت تنظر فيه إلى ما بقي في البيت وتحسب هل يكفي إلى الغد. وربما يكون أصعب من الجوع أن تضطر إلى السؤال، أو أن تخشى نظرة من يسألك كيف وصلت إلى هذه الحال. لكن الطعام حاجة أساسية، وليس جائزة يحصل عليها من استطاع أن يبرر فقره. وإذا كنت تقرأ هذا الباب من شدة الحاجة، فأرجوك أن تجعل الحصول على ما يكفيك اليوم أولًا، ثم عد إلى الصفحات متى شئت.","verses":[{"text":"﴿أَوْ إِطْعَامٌ فِي يَوْمٍ ذِي مَسْغَبَةٍ ۝ يَتِيمًا ذَا مَقْرَبَةٍ ۝ أَوْ مِسْكِينًا ذَا مَتْرَبَةٍ﴾","reference":"البلد: ١٤–١٦ — آيات متتابعة","sura":"البلد","number":"١٤–١٦","explanation":"تأتي هذه الآيات متتابعة في سورة البلد، فتذكر الإطعام وقت شدة الجوع، وتذكر اليتيم القريب والمسكين شديد الفقر. إنها دعوة إلى فعل الخير للمحتاج، لا لومًا لمن لم يجد ما يأكله."},{"text":"﴿وَيُطْعِمُونَ الطَّعَامَ عَلَىٰ حُبِّهِ مِسْكِينًا وَيَتِيمًا وَأَسِيرًا﴾","reference":"الإنسان: ٨ — اقتباس من الآية","sura":"الإنسان","number":"٨","explanation":"تمدح الآية إطعام المسكين واليتيم والأسير. ومن رحمة هذا المعنى أن نرى الجائع إنسانًا يستحق الإعانة، لا قصة نحكم عليها من بعيد."}],"prayer":"اللهم ارزق من ضاق عليه العيش طعامًا طيبًا كافيًا، وافتح لأهل السعة أبواب الإحسان والعدل.","closing":"إن اضطررت إلى طلب لقمة أو مساعدة، فتذكر أن حاجتك لا تنقص كرامتك. ويستطيع من أوسع الله عليه أن يجعل هذه الآيات عملًا يصل أثره إلى مائدة إنسان، لا كلمات تُقال ثم يُترك صاحب الحاجة ينتظر.","content":[{"type":"paragraph","text":"قد يأتي وقت تنظر فيه إلى ما بقي في البيت وتحسب هل يكفي إلى الغد. وربما يكون أصعب من الجوع أن تضطر إلى السؤال، أو أن تخشى نظرة من يسألك كيف وصلت إلى هذه الحال. لكن الطعام حاجة أساسية، وليس جائزة يحصل عليها من استطاع أن يبرر فقره. وإذا كنت تقرأ هذا الباب من شدة الحاجة، فأرجوك أن تجعل الحصول على ما يكفيك اليوم أولًا، ثم عد إلى الصفحات متى شئت."},{"type":"heading","text":"الجوع يحتاج طعامًا، لا عتابًا"},{"type":"paragraph","text":"قد تمر أسرة بضيق بسبب فقد عمل أو مرض أو ظرف لم تختره. وقد يكون لها راتب متأخر أو مساعدة تستحقها ولم تصل إليها. لا نعرف قصة كل محتاج، ولذلك لا يليق أن نجعل الطعام مشروطًا باستجواب يجرح كرامته."},{"type":"heading","text":"الإطعام في وقت الحاجة"},{"type":"verse","text":"﴿أَوْ إِطْعَامٌ فِي يَوْمٍ ذِي مَسْغَبَةٍ ۝ يَتِيمًا ذَا مَقْرَبَةٍ ۝ أَوْ مِسْكِينًا ذَا مَتْرَبَةٍ﴾","ref":"البلد: ١٤–١٦ — آيات متتابعة"},{"type":"paragraph","text":"تأتي هذه الآيات متتابعة في سورة البلد، فتذكر الإطعام وقت شدة الجوع، وتذكر اليتيم القريب والمسكين شديد الفقر. إنها دعوة إلى فعل الخير للمحتاج، لا لومًا لمن لم يجد ما يأكله."},{"type":"verse","text":"﴿وَيُطْعِمُونَ الطَّعَامَ عَلَىٰ حُبِّهِ مِسْكِينًا وَيَتِيمًا وَأَسِيرًا﴾","ref":"الإنسان: ٨ — اقتباس من الآية"},{"type":"paragraph","text":"تمدح الآية إطعام المسكين واليتيم والأسير. ومن رحمة هذا المعنى أن نرى الجائع إنسانًا يستحق الإعانة، لا قصة نحكم عليها من بعيد."},{"type":"heading","text":"الخطاب يصل إلى صاحب القدرة أيضًا"},{"type":"paragraph","text":"تذكر الآيات إطعام المحتاج، وتوجه الأنظار إلى من يستطيع بذل الطعام والمال. هذا معنى ثمين: ليست كل أعباء الشدة على صاحب الحاجة. على القادرين مسؤولية من الإحسان والقيام بالحقوق، وللمحتاج أن يسأل عما يلزمه دون أن يحس بأنه أقل منزلة من غيره."},{"type":"heading","text":"ابدأ بما يكفي اليوم"},{"type":"paragraph","text":"إن لم يتوفر طعام أو ماء آمن، تواصل مع شخص تثق به أو جهة مساعدة اجتماعية موثوقة، واذكر حاجتك بوضوح. وإن كان لك أجر أو حق مالي متأخر، فاستفسر عن الطريق المناسب للمطالبة به. أما ترتيب المصروفات على المدى الطويل فيأتي بعد سد الضرورة العاجلة."},{"type":"heading","text":"إذا كنت تقرأ لأجل شخص آخر"},{"type":"paragraph","text":"إن كنت تستطيع الإطعام، فاحفظ كرامة المحتاج، ولا تجعل المساعدة امتحاناً لروايته أو مناسبة لتذكيره بعجزه."},{"type":"heading","text":"دعاء من صياغة المؤلف"},{"type":"paragraph","text":"اللهم ارزق من ضاق عليه العيش طعامًا طيبًا كافيًا، وافتح لأهل السعة أبواب الإحسان والعدل."},{"type":"heading","text":"إلى من يسأل على استحياء"},{"type":"paragraph","text":"إن اضطررت إلى طلب لقمة أو مساعدة، فتذكر أن حاجتك لا تنقص كرامتك. ويستطيع من أوسع الله عليه أن يجعل هذه الآيات عملًا يصل أثره إلى مائدة إنسان، لا كلمات تُقال ثم يُترك صاحب الحاجة ينتظر."}]},{"id":3,"title":"حين يتأخر العمل ويتعب الانتظار","opening":"قد تفتح بريدك في الصباح فلا تجد ردًا، أو يأتيك اعتذار جديد عن وظيفة كنت ترجوها. وبعد مرات كثيرة، لا يعود السؤال عن العمل وحده؛ ربما تسأل نفسك: هل ينقصني شيء يجعلني غير جدير بالفرصة؟ أريدك أن تفصل بين الأمرين. من حقك أن تتعب من الانتظار، لكن عدم قبول طلبك لا يختصر قدراتك ولا يحكي قصتك كلها.","verses":[{"text":"﴿رَبِّ إِنِّي لِمَا أَنْزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ﴾","reference":"القصص: ٢٤ — اقتباس من الآية","sura":"القصص","number":"٢٤","explanation":"قال موسى هذا الدعاء بعد أن سقى للمرأتين، فجمع بين فعل الخير والافتقار إلى الله. نستطيع أن ندعو به، من غير أن نعد أنفسنا بوظيفة محددة أو وقت معين."},{"text":"﴿إِنَّ خَيْرَ مَنِ اسْتَأْجَرْتَ الْقَوِيُّ الْأَمِينُ﴾","reference":"القصص: ٢٦ — اقتباس من الآية","sura":"القصص","number":"٢٦","explanation":"ورد وصف القوة والأمانة في سياق عرض الاستئجار على موسى. وهو وصف لما يُطلب في العمل، وليس حكمًا على قيمة من لم يجد وظيفة بعد."},{"text":"﴿فَامْشُوا فِي مَنَاكِبِهَا وَكُلُوا مِنْ رِزْقِهِ﴾","reference":"الملك: ١٥ — اقتباس من الآية","sura":"الملك","number":"١٥","explanation":"تذكر الآية تيسير الأرض والسير في مناكبها والأكل من رزق الله. في معناها حض على السعي، دون ضمان أن يكون الطريق سهلًا أو النتيجة عاجلة."}],"prayer":"رب إني لما أنزلت إليّ من خير فقير. اللهم ارزقني عملًا حلالًا نافعًا، وأعنّي على السعي إليه بأمانة وصبر.","closing":"تستطيع أن تراجع أوراقك وتتعلم وتطرق بابًا آخر، وأن تعترف في الوقت نفسه بأن الانتظار مرهق. لا تجعل رفضًا متكررًا يعلّمك احتقار نفسك. أنت أكثر من طلب عمل، ولحياتك قدر لا يمنحه صاحب وظيفة ولا ينتزعه.","content":[{"type":"paragraph","text":"قد تفتح بريدك في الصباح فلا تجد ردًا، أو يأتيك اعتذار جديد عن وظيفة كنت ترجوها. وبعد مرات كثيرة، لا يعود السؤال عن العمل وحده؛ ربما تسأل نفسك: هل ينقصني شيء يجعلني غير جدير بالفرصة؟ أريدك أن تفصل بين الأمرين. من حقك أن تتعب من الانتظار، لكن عدم قبول طلبك لا يختصر قدراتك ولا يحكي قصتك كلها."},{"type":"heading","text":"الرفض لا يروي الحكاية كاملة"},{"type":"paragraph","text":"قد يكون السوق ضيقًا، وقد يحتاج طلبك إلى تعديل، وقد تكون هناك مهارة تستطيع اكتسابها، وقد يقع ظلم أو تمييز. تختلف الأسباب كما تختلف الطرق المناسبة لها. قبل أن تحكم على نفسك، حاول أن تعرف في أي مرحلة يتوقف طلبك، وما الذي يمكن تحسينه فعلًا."},{"type":"heading","text":"عمل موسى ودعاؤه"},{"type":"verse","text":"﴿رَبِّ إِنِّي لِمَا أَنْزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ﴾","ref":"القصص: ٢٤ — اقتباس من الآية"},{"type":"paragraph","text":"قال موسى هذا الدعاء بعد أن سقى للمرأتين، فجمع بين فعل الخير والافتقار إلى الله. نستطيع أن ندعو به، من غير أن نعد أنفسنا بوظيفة محددة أو وقت معين."},{"type":"verse","text":"﴿إِنَّ خَيْرَ مَنِ اسْتَأْجَرْتَ الْقَوِيُّ الْأَمِينُ﴾","ref":"القصص: ٢٦ — اقتباس من الآية"},{"type":"paragraph","text":"ورد وصف القوة والأمانة في سياق عرض الاستئجار على موسى. وهو وصف لما يُطلب في العمل، وليس حكمًا على قيمة من لم يجد وظيفة بعد."},{"type":"verse","text":"﴿فَامْشُوا فِي مَنَاكِبِهَا وَكُلُوا مِنْ رِزْقِهِ﴾","ref":"الملك: ١٥ — اقتباس من الآية"},{"type":"paragraph","text":"تذكر الآية تيسير الأرض والسير في مناكبها والأكل من رزق الله. في معناها حض على السعي، دون ضمان أن يكون الطريق سهلًا أو النتيجة عاجلة."},{"type":"heading","text":"في قصة موسى عملٌ ودعاء"},{"type":"paragraph","text":"سقى موسى عليه السلام للمرأتين، ثم أوى إلى الظل ودعا ربه وهو مفتقر إلى الخير. وبعد ذلك جرت أحداث الاستئجار في قصته. نقرأ هذه الوقائع لنتأمل العمل الصالح والافتقار إلى الله والأمانة، لا لنتوقع أن تتكرر تفاصيل القصة لكل من بحث عن وظيفة. فالإنسان يستطيع أن يسعى ويستشير، وأبواب الرزق ووقتها عند الله."},{"type":"heading","text":"خطوة تناسب موضع التعثر"},{"type":"paragraph","text":"إذا لم تُدعَ إلى مقابلات، فراجع سيرتك وطريقة التقديم وشروط الوظائف. وإذا وصلت إلى المقابلات، فاطلب رأيًا ممن يستطيع تقييم أدائك بأمانة. وإذا كان حقك قد ضاع أو تعرضت لتمييز، فابحث عن طريق المطالبة به. لا تُكرر المحاولة نفسها إلى ما لا نهاية من غير أن تسأل عما يمكن تغييره."},{"type":"heading","text":"مناجاة ودعاء · بعض الألفاظ من القرآن، والباقي من صياغة المؤلف"},{"type":"paragraph","text":"رب إني لما أنزلت إليّ من خير فقير. اللهم ارزقني عملًا حلالًا نافعًا، وأعنّي على السعي إليه بأمانة وصبر."},{"type":"heading","text":"حين تطول الرسائل بلا جواب"},{"type":"paragraph","text":"تستطيع أن تراجع أوراقك وتتعلم وتطرق بابًا آخر، وأن تعترف في الوقت نفسه بأن الانتظار مرهق. لا تجعل رفضًا متكررًا يعلّمك احتقار نفسك. أنت أكثر من طلب عمل، ولحياتك قدر لا يمنحه صاحب وظيفة ولا ينتزعه."}]},{"id":4,"title":"حين يضيق الصدر بالدَّين","opening":"قد يكون للدَّين حضور لا يراه الناس: موعد يقترب، واتصال تخاف الإجابة عنه، وورقة تعيد حساب أرقامها كل ليلة. وربما تحاول أن تظهر مطمئنًا أمام أهلك بينما تعرف أنك لا تملك الآن ما يكفي للسداد. لا أريد أن أبدأ معك باللوم؛ فقبل كل نصيحة يجب أن نفرق بين من يستطيع الوفاء ويتأخر، ومن يعجز فعلًا وإن أراد أن يؤدي ما عليه.","verses":[{"text":"﴿وَإِنْ كَانَ ذُو عُسْرَةٍ فَنَظِرَةٌ إِلَىٰ مَيْسَرَةٍ وَأَنْ تَصَدَّقُوا خَيْرٌ لَكُمْ إِنْ كُنْتُمْ تَعْلَمُونَ﴾","reference":"البقرة: ٢٨٠ — اقتباس من الآية","sura":"البقرة","number":"٢٨٠","explanation":"تأمر الآية بإنظار المدين الذي ثبت عسره إلى وقت الميسرة. وفي هذا مراعاة لحاله، مع بقاء أصل الحق ما لم يُسقطه صاحبه أو يقع صلح معتبر."},{"text":"﴿إِذَا تَدَايَنْتُمْ بِدَيْنٍ إِلَىٰ أَجَلٍ مُسَمًّى فَاكْتُبُوهُ﴾","reference":"البقرة: ٢٨٢ — اقتباس من الآية","sura":"البقرة","number":"٢٨٢","explanation":"من مقاصد كتابة الديون حفظ الحقوق وتقليل الخلاف. ليس التوثيق سوء ظن، بل وسيلة يتبين بها ما اتفق عليه الطرفان."},{"text":"﴿إِنَّ اللَّهَ يَأْمُرُكُمْ أَنْ تُؤَدُّوا الْأَمَانَاتِ إِلَىٰ أَهْلِهَا﴾","reference":"النساء: ٥٨ — اقتباس من الآية","sura":"النساء","number":"٥٨","explanation":"الأمانة حق ينبغي أداؤه إلى أصحابه. ويتناول أصلها من اقترض ومن أقرض ومن تولى التصرف في أموال الناس."}],"prayer":"اللهم أعنّي على أداء الحقوق، وافتح لي باب رزق حلال، وألهمني الصدق في السعة والضيق.","closing":"لا يعدك هذا الباب بأن المال سيأتي غدًا. لكنه يدعوك إلى الصدق وطلب الحق والإنظار عند العسر. وإذا لم تستطع الوفاء اليوم، فلا تضف إلى العجز وعدًا تعرف أنك لن تفي به. يكفي أن تبدأ من الحقيقة، وأن تطلب ما يمكن تحمله.","content":[{"type":"paragraph","text":"قد يكون للدَّين حضور لا يراه الناس: موعد يقترب، واتصال تخاف الإجابة عنه، وورقة تعيد حساب أرقامها كل ليلة. وربما تحاول أن تظهر مطمئنًا أمام أهلك بينما تعرف أنك لا تملك الآن ما يكفي للسداد. لا أريد أن أبدأ معك باللوم؛ فقبل كل نصيحة يجب أن نفرق بين من يستطيع الوفاء ويتأخر، ومن يعجز فعلًا وإن أراد أن يؤدي ما عليه."},{"type":"heading","text":"بين الخوف وحقيقة الأرقام"},{"type":"paragraph","text":"القلق قد يجعل المبلغ أكبر مما هو، أو يجعل من الصعب النظر إليه أصلًا. اكتب ما عليك، وموعده، وما يدخل إليك، وما يلزم للحياة من طعام وسكن وعلاج. هذه الورقة لا تمحو الدَّين، لكنها تساعدك على الكلام بصدق، وعلى معرفة ما تستطيع عرضه على صاحب الحق."},{"type":"heading","text":"الدَّين بين التوثيق والإنظار"},{"type":"verse","text":"﴿وَإِنْ كَانَ ذُو عُسْرَةٍ فَنَظِرَةٌ إِلَىٰ مَيْسَرَةٍ وَأَنْ تَصَدَّقُوا خَيْرٌ لَكُمْ إِنْ كُنْتُمْ تَعْلَمُونَ﴾","ref":"البقرة: ٢٨٠ — اقتباس من الآية"},{"type":"paragraph","text":"تأمر الآية بإنظار المدين الذي ثبت عسره إلى وقت الميسرة. وفي هذا مراعاة لحاله، مع بقاء أصل الحق ما لم يُسقطه صاحبه أو يقع صلح معتبر."},{"type":"verse","text":"﴿إِذَا تَدَايَنْتُمْ بِدَيْنٍ إِلَىٰ أَجَلٍ مُسَمًّى فَاكْتُبُوهُ﴾","ref":"البقرة: ٢٨٢ — اقتباس من الآية"},{"type":"paragraph","text":"من مقاصد كتابة الديون حفظ الحقوق وتقليل الخلاف. ليس التوثيق سوء ظن، بل وسيلة يتبين بها ما اتفق عليه الطرفان."},{"type":"verse","text":"﴿إِنَّ اللَّهَ يَأْمُرُكُمْ أَنْ تُؤَدُّوا الْأَمَانَاتِ إِلَىٰ أَهْلِهَا﴾","ref":"النساء: ٥٨ — اقتباس من الآية"},{"type":"paragraph","text":"الأمانة حق ينبغي أداؤه إلى أصحابه. ويتناول أصلها من اقترض ومن أقرض ومن تولى التصرف في أموال الناس."},{"type":"heading","text":"رحمة بالمعسر وعدل للدائن"},{"type":"paragraph","text":"في القرآن أمر بإنظار المعسر إلى وقت اليسر، كما جاء فيه الحث على توثيق الدين وحفظ الأمانات. فلا ينبغي إهانة من ضاقت به القدرة، ولا يصح كذلك أن يُتخذ الضيق ذريعة لإضاعة حقوق الناس. إذا اختلف الطرفان في حقيقة المبلغ أو القدرة، كان التوثيق والإنصاف خيرًا من الاتهامات."},{"type":"heading","text":"حين تحتاج إلى طلب مهلة"},{"type":"paragraph","text":"اجمع ما يثبت مقدار الدين وحالتك المالية، وتواصل مع الدائن بطلب واقعي يمكن مراجعته. وإذا كان أصل الدين أو بعضه محل نزاع، فاطلب نسخة من المستندات قبل الإقرار. وقد تحتاج إلى مشورة قانونية أو مالية موثوقة؛ فليس مطلوبًا أن تفهم كل الإجراءات وحدك."},{"type":"heading","text":"إذا كنت تقرأ لأجل شخص آخر"},{"type":"paragraph","text":"إن كنت صاحب حق على معسر، فميّز بين العجز الحقيقي والمماطلة؛ وافحص ما يمكن ترتيبه من إنظار يحفظ حقك ولا يهين صاحب الحاجة."},{"type":"heading","text":"دعاء من صياغة المؤلف"},{"type":"paragraph","text":"اللهم أعنّي على أداء الحقوق، وافتح لي باب رزق حلال، وألهمني الصدق في السعة والضيق."},{"type":"heading","text":"حين تنام وفي بالك الاستحقاق"},{"type":"paragraph","text":"لا يعدك هذا الباب بأن المال سيأتي غدًا. لكنه يدعوك إلى الصدق وطلب الحق والإنظار عند العسر. وإذا لم تستطع الوفاء اليوم، فلا تضف إلى العجز وعدًا تعرف أنك لن تفي به. يكفي أن تبدأ من الحقيقة، وأن تطلب ما يمكن تحمله."}]},{"id":5,"title":"حين لا تجد مأوى تطمئن إليه","opening":"ليس البيت جدرانًا وسقفًا فحسب. قد يكون المكان الذي تنام فيه دون أن تراقب الباب، والذي تستطيع أن تضع فيه أغراضك وتعرف أنها ستبقى حين تعود. فإذا افتقدت هذا الأمان، فقد افتقدت شيئًا كبيرًا من راحة الحياة. وربما لا تبحث عن منزل تملكه، بل عن مكان آمن تقضي فيه ليلتك. هذا اختلاف مهم، ويستحق أن نبدأ منه.","verses":[{"text":"﴿رَبَّنَا آتِنَا مِنْ لَدُنْكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا﴾","reference":"الكهف: ١٠ — اقتباس من الآية","sura":"الكهف","number":"١٠","explanation":"دعا أصحاب الكهف ربهم بالرحمة وأن يهيئ لهم الرشد في أمرهم. ومن الجميل أن يسأل الإنسان ربه ذلك، مع البحث عن الأسباب المناسبة لظرفه، من غير تحويل القصة إلى وعد ببيت في زمن محدد."}],"prayer":"ربنا آتنا من لدنك رحمة وهيئ لنا من أمرنا رشدًا. اللهم هيئ لكل محتاج موضعًا آمنًا ومن يعينه.","closing":"إذا وجدت من يؤويك الليلة بأمان، فذلك أمر يستحق أن تهتم به قبل أي خطة بعيدة. ومن حقك أن تطلب السكن الكريم دون أن تشرح للناس كل تفاصيل محنتك. ليس طلب الأمان ترفًا، بل حاجة تستحق الاحترام.","content":[{"type":"paragraph","text":"ليس البيت جدرانًا وسقفًا فحسب. قد يكون المكان الذي تنام فيه دون أن تراقب الباب، والذي تستطيع أن تضع فيه أغراضك وتعرف أنها ستبقى حين تعود. فإذا افتقدت هذا الأمان، فقد افتقدت شيئًا كبيرًا من راحة الحياة. وربما لا تبحث عن منزل تملكه، بل عن مكان آمن تقضي فيه ليلتك. هذا اختلاف مهم، ويستحق أن نبدأ منه."},{"type":"paragraph","text":"أين تأمن هذه الليلة؟"},{"type":"paragraph","text":"من يخشى أن يبيت في العراء يحتاج حلًا عاجلًا يختلف عن شخص يريد تحسين سكنه بعد سنوات. ومن خرج من بيت بسبب تهديد يحتاج حماية، لا نصيحة بالعودة قبل فهم الخطر. لن نطلب منك أن تضع خطة طويلة وأنت لا تعرف أين تنام الليلة."},{"type":"heading","text":"دعاء الفتية في سورة الكهف"},{"type":"verse","text":"﴿رَبَّنَا آتِنَا مِنْ لَدُنْكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا﴾","ref":"الكهف: ١٠ — اقتباس من الآية"},{"type":"paragraph","text":"دعا أصحاب الكهف ربهم بالرحمة وأن يهيئ لهم الرشد في أمرهم. ومن الجميل أن يسأل الإنسان ربه ذلك، مع البحث عن الأسباب المناسبة لظرفه، من غير تحويل القصة إلى وعد ببيت في زمن محدد."},{"type":"heading","text":"دعاء في موضع خوف"},{"type":"paragraph","text":"لجأ الفتية إلى الكهف في ظرفهم الخاص، وسألوا ربهم الرحمة والرشد. نستطيع أن نقرأ دعاءهم ونرجو من الله الهداية إلى الصواب، لكن تفاصيل القصة لا تقدم طريقة جاهزة للحصول على مسكن. لكل قارئ ظروفه: إيجار، أو إخلاء، أو نزوح، أو حاجة إلى مأوى مهيأ."},{"type":"heading","text":"ابدأ بالأمان ثم رتب الأوراق"},{"type":"paragraph","text":"إذا لم يتوفر لك مكان آمن، فاطلب مساعدة جهة إيواء موثوقة أو شخص مأمون، وقدم السلامة على بقية الإجراءات. وإذا كانت المشكلة عقد إيجار أو قرار إخلاء، فاحتفظ بالإشعارات والمستندات واطلب مشورة تناسب بلدك قبل توقيع ما قد يضر بحقك."},{"type":"heading","text":"مناجاة ودعاء · بعض الألفاظ من القرآن، والباقي من صياغة المؤلف"},{"type":"paragraph","text":"ربنا آتنا من لدنك رحمة وهيئ لنا من أمرنا رشدًا. اللهم هيئ لكل محتاج موضعًا آمنًا ومن يعينه."},{"type":"heading","text":"إلى من يبحث عن باب آمن"},{"type":"paragraph","text":"إذا وجدت من يؤويك الليلة بأمان، فذلك أمر يستحق أن تهتم به قبل أي خطة بعيدة. ومن حقك أن تطلب السكن الكريم دون أن تشرح للناس كل تفاصيل محنتك. ليس طلب الأمان ترفًا، بل حاجة تستحق الاحترام."}]},{"id":6,"title":"حين يشتد الألم في جسدك","opening":"قد يستيقظ المرء وفي جسده ألم يعرفه جيدًا، ثم يسمع من حوله: لا يبدو عليك شيء. وربما يتعب من محاولة شرح وجعه أكثر مما يتعب من الألم نفسه. إذا كنت تمر بهذا، فلا تحتاج إلى إثبات أنك تتألم كي نستمع إليك. المرض ليس اختبارًا في القدرة على الابتسام، وطلب المساعدة ليس علامة ضعف في الإيمان.","verses":[{"text":"﴿أَنِّي مَسَّنِيَ الضُّرُّ وَأَنْتَ أَرْحَمُ الرَّاحِمِينَ﴾","reference":"الأنبياء: ٨٣ — اقتباس من الآية","sura":"الأنبياء","number":"٨٣","explanation":"هذا من دعاء أيوب عليه السلام حين أصابه الضر. تذكر الآية صدق الافتقار إلى الله والالتجاء إلى رحمته، دون تكلف كلمات طويلة."},{"text":"﴿فَاسْتَجَبْنَا لَهُ فَكَشَفْنَا مَا بِهِ مِنْ ضُرٍّ﴾","reference":"الأنبياء: ٨٤ — اقتباس من الآية","sura":"الأنبياء","number":"٨٤","explanation":"يخبرنا القرآن بأن الله كشف الضر عن أيوب. وهو خبر عن قصته، لا وعد طبيًا لكل مريض بأن يشفى في موعد معين."},{"text":"﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ﴾","reference":"البقرة: ١٥٣ — اقتباس من الآية","sura":"البقرة","number":"١٥٣","explanation":"في الآية أمر بالاستعانة بالصبر والصلاة. وهذه الاستعانة لا تمنع طلب العلاج، ولا تجعل الألم الذي يستمر دليلًا على قلة صبر صاحبه."}],"prayer":"أني مسني الضر وأنت أرحم الراحمين. اللهم ارزقني رعاية نافعة، وخفف عني وعن كل متألم.","closing":"ربما لا تقدر اليوم إلا على أخذ علاجك، أو طلب موعد، أو الراحة. لا تحقر ما تفعله لأنك اعتدت أن تكون أقوى. الإنسان لا يفقد منزلته حين يضعف جسده؛ وهو يستحق العناية في أيام قوته وفي أيام ألمه.","content":[{"type":"paragraph","text":"قد يستيقظ المرء وفي جسده ألم يعرفه جيدًا، ثم يسمع من حوله: لا يبدو عليك شيء. وربما يتعب من محاولة شرح وجعه أكثر مما يتعب من الألم نفسه. إذا كنت تمر بهذا، فلا تحتاج إلى إثبات أنك تتألم كي نستمع إليك. المرض ليس اختبارًا في القدرة على الابتسام، وطلب المساعدة ليس علامة ضعف في الإيمان."},{"type":"heading","text":"من حق ألمك أن يؤخذ بجدية"},{"type":"paragraph","text":"قد تحتاج إلى وصف ما تشعر به للطبيب أو من يرعاك، وقد تحتاج إلى أن تقول ببساطة: أنا متعب اليوم. لا يلزمك أن تخفي الألم حتى تريح غيرك من سماعه. وفي المقابل، لا تجعل روايات الناس وتشخيصاتهم بديلاً عن تقييم مختص يعرف حالتك."},{"type":"heading","text":"أيوب عليه السلام: دعاء ورجاء"},{"type":"verse","text":"﴿أَنِّي مَسَّنِيَ الضُّرُّ وَأَنْتَ أَرْحَمُ الرَّاحِمِينَ﴾","ref":"الأنبياء: ٨٣ — اقتباس من الآية"},{"type":"paragraph","text":"هذا من دعاء أيوب عليه السلام حين أصابه الضر. تذكر الآية صدق الافتقار إلى الله والالتجاء إلى رحمته، دون تكلف كلمات طويلة."},{"type":"verse","text":"﴿فَاسْتَجَبْنَا لَهُ فَكَشَفْنَا مَا بِهِ مِنْ ضُرٍّ﴾","ref":"الأنبياء: ٨٤ — اقتباس من الآية"},{"type":"paragraph","text":"يخبرنا القرآن بأن الله كشف الضر عن أيوب. وهو خبر عن قصته، لا وعد طبيًا لكل مريض بأن يشفى في موعد معين."},{"type":"verse","text":"﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ﴾","ref":"البقرة: ١٥٣ — اقتباس من الآية"},{"type":"paragraph","text":"في الآية أمر بالاستعانة بالصبر والصلاة. وهذه الاستعانة لا تمنع طلب العلاج، ولا تجعل الألم الذي يستمر دليلًا على قلة صبر صاحبه."},{"type":"heading","text":"في دعاء أيوب مساحة للصدق"},{"type":"paragraph","text":"ذكر أيوب عليه السلام الضر الذي أصابه، وتوجه إلى رحمة الله. ثم يخبر القرآن بأن الله كشف عنه الضر. تلك قصة عظيمة نقرؤها برجاء، لكنها لا تعني أن كل مريض ستتكرر معه التفاصيل نفسها. يمكن أن يجتمع الدعاء والصبر مع الفحص والعلاج وطلب الرعاية، ولا تناقض بين هذه الأمور."},{"type":"heading","text":"حين تحتاج إلى رعاية"},{"type":"paragraph","text":"إذا ظهرت أعراض خطيرة مثل صعوبة شديدة في التنفس أو فقدان الوعي، فاطلب المساعدة الطبية العاجلة. وفي غير ذلك، دوّن الأعراض التي تريد شرحها، واسأل عن الخطة العلاجية ومتى تعود للمراجعة. لا توقف دواءً موصوفًا من نفسك بسبب تجربة قرأتها أو سمعتها."},{"type":"heading","text":"إذا كنت تقرأ لأجل شخص آخر"},{"type":"paragraph","text":"لا تجعل ألم المريض موضوع جدل حول مقدار صبره. اسمع وصفه وساعده على الوصول إلى رعاية مناسبة."},{"type":"heading","text":"مناجاة ودعاء · بعض الألفاظ من القرآن، والباقي من صياغة المؤلف"},{"type":"paragraph","text":"أني مسني الضر وأنت أرحم الراحمين. اللهم ارزقني رعاية نافعة، وخفف عني وعن كل متألم."},{"type":"heading","text":"إلى الجسد الذي طال تعبه"},{"type":"paragraph","text":"ربما لا تقدر اليوم إلا على أخذ علاجك، أو طلب موعد، أو الراحة. لا تحقر ما تفعله لأنك اعتدت أن تكون أقوى. الإنسان لا يفقد منزلته حين يضعف جسده؛ وهو يستحق العناية في أيام قوته وفي أيام ألمه."}]},{"id":7,"title":"حين يصبح الطريق غير مهيأ لك","opening":"قد تصل إلى باب ثم تكتشف أن الدرج يحول بينك وبين الدخول. أو تجد نموذجًا لا يستطيع قارئ الشاشة قراءته، أو موعدًا لا تتوافر له وسيلة نقل مناسبة. وربما تسمع ممن لا يعرف تفاصيل يومك: لو حاولت أكثر لاستطعت. لكن المشكلة في كثير من الأحيان ليست نقص الإرادة، بل في الطريق الذي لم يُهيأ للجميع.","verses":[{"text":"﴿فَاتَّقُوا اللَّهَ مَا اسْتَطَعْتُمْ وَاسْمَعُوا وَأَطِيعُوا﴾","reference":"التغابن: ١٦ — اقتباس من الآية","sura":"التغابن","number":"١٦","explanation":"الأمر بتقوى الله بحسب الاستطاعة يقرر مراعاة قدرة الإنسان في التكليف، وليس مطالبةً له بأن يفعل ما يتعذر عليه."},{"text":"﴿لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا﴾","reference":"البقرة: ٢٨٦ — اقتباس من الآية","sura":"البقرة","number":"٢٨٦","explanation":"توضح الآية أن الله لا يكلف نفسًا إلا وسعها. نستفيد منها في فهم رحمة التكليف، ولا نجعلها وحدها نصًا يحدد المواصفات الهندسية أو النظامية للإتاحة."}],"prayer":"اللهم يسر لنا من يعيننا بالعدل، وألهم القادرين أن يفتحوا الطرق التي أغلقها الإهمال.","closing":"قد تتغير قدرتك على إنجاز الأمر حين يتغير المكان أو تتوافر الوسيلة المناسبة. لذلك لا تقبل أن يكون كل عائق في البيئة حكمًا على قدراتك. اطلب ما يتيح لك الوصول، ودع الجهة المسؤولة تتحمل نصيبها من العمل.","content":[{"type":"paragraph","text":"قد تصل إلى باب ثم تكتشف أن الدرج يحول بينك وبين الدخول. أو تجد نموذجًا لا يستطيع قارئ الشاشة قراءته، أو موعدًا لا تتوافر له وسيلة نقل مناسبة. وربما تسمع ممن لا يعرف تفاصيل يومك: لو حاولت أكثر لاستطعت. لكن المشكلة في كثير من الأحيان ليست نقص الإرادة، بل في الطريق الذي لم يُهيأ للجميع."},{"type":"heading","text":"أحيانًا يحتاج المكان إلى أن يتغير"},{"type":"paragraph","text":"ليس من العدل أن نجعل الإنسان يتوسل للحصول على خدمة كان يمكن تقديمها بصورة متاحة. المنحدر، والنص المقروء، والترجمة، والمساعدة المناسبة كلها وسائل تجعل المشاركة ممكنة. ويعرف أصحاب الإعاقة أنفسهم كثيرًا مما ينقص الأماكن والخدمات؛ فلنسمعهم قبل أن نقرر ما يحتاجونه."},{"type":"heading","text":"الوسع والاستطاعة"},{"type":"verse","text":"﴿فَاتَّقُوا اللَّهَ مَا اسْتَطَعْتُمْ وَاسْمَعُوا وَأَطِيعُوا﴾","ref":"التغابن: ١٦ — اقتباس من الآية"},{"type":"paragraph","text":"الأمر بتقوى الله بحسب الاستطاعة يقرر مراعاة قدرة الإنسان في التكليف، وليس مطالبةً له بأن يفعل ما يتعذر عليه."},{"type":"verse","text":"﴿لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا﴾","ref":"البقرة: ٢٨٦ — اقتباس من الآية"},{"type":"paragraph","text":"توضح الآية أن الله لا يكلف نفسًا إلا وسعها. نستفيد منها في فهم رحمة التكليف، ولا نجعلها وحدها نصًا يحدد المواصفات الهندسية أو النظامية للإتاحة."},{"type":"heading","text":"القدرة لا تتشابه بين الناس"},{"type":"paragraph","text":"تذكر الآيات أن التكليف مرتبط بالوسع والاستطاعة. وهذا معنى أصيل في بابه. ويمكن أن نستأنس به عند الحديث عن مراعاة القدرة في الحياة اليومية، مع التنبه إلى أن حقوق الإتاحة وإجراءاتها تحددها الأنظمة والخبرة المختصة، لا آية تتحدث عن تجهيز المباني على وجه الخصوص."},{"type":"heading","text":"سمِّ العائق بدل أن تلوم نفسك"},{"type":"paragraph","text":"هل المشكلة عند المدخل؟ في وسيلة النقل؟ في شاشة الخدمة؟ في غياب من يستطيع المساعدة؟ تحديد العائق هو بداية طلب تهيئة مناسبة من الجهة المسؤولة. ومن حقك أن تستعمل ما يعينك دون شعور بأن المساعدة تنتقص منك."},{"type":"heading","text":"دعاء من صياغة المؤلف"},{"type":"paragraph","text":"اللهم يسر لنا من يعيننا بالعدل، وألهم القادرين أن يفتحوا الطرق التي أغلقها الإهمال."},{"type":"heading","text":"إن كان العائق خارجك"},{"type":"paragraph","text":"قد تتغير قدرتك على إنجاز الأمر حين يتغير المكان أو تتوافر الوسيلة المناسبة. لذلك لا تقبل أن يكون كل عائق في البيئة حكمًا على قدراتك. اطلب ما يتيح لك الوصول، ودع الجهة المسؤولة تتحمل نصيبها من العمل."}]},{"id":8,"title":"حين يعلو الخوف مما سيأتي","opening":"هناك ليالٍ يكون فيها الغد حاضرًا أكثر من اليوم. تتخيل مكالمة لم تأتِ، أو نتيجة لم تصدر، أو خسارة تخشاها، فتجد نفسك تراجع الاحتمالات مرة بعد مرة. ربما تقول: أعرف أنني أكثر التفكير، لكنني لا أستطيع إيقافه. لا حاجة لأن نلومك على خوفك؛ الأهم أن نفصل بين ما وقع فعلًا وما تخشى أن يقع.","verses":[{"text":"﴿أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾","reference":"الرعد: ٢٨ — اقتباس من الآية","sura":"الرعد","number":"٢٨","explanation":"تذكر الآية اطمئنان القلوب بذكر الله. وهي تفتح باب الذكر والرجاء، ولا تصلح وحدها لتشخيص القلق أو الحكم على إيمان من بقي خائفًا."},{"text":"﴿وَشَاوِرْهُمْ فِي الْأَمْرِ فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ﴾","reference":"آل عمران: ١٥٩ — اقتباس من الآية","sura":"آل عمران","number":"١٥٩","explanation":"وردت المشاورة والعزم والتوكل معًا في سياق خطاب النبي صلى الله عليه وسلم. نستفيد منها معنى النظر في الأسباب قبل القرار، دون ضمان نتيجة بعينها."},{"text":"﴿وَمَا تَدْرِي نَفْسٌ مَاذَا تَكْسِبُ غَدًا﴾","reference":"لقمان: ٣٤ — اقتباس من الآية","sura":"لقمان","number":"٣٤","explanation":"تذكر الآية أن الإنسان لا يعلم ما سيكسب غدًا. جهل الغيب لا يمنع التخطيط الممكن، لكنه يذكّرنا بأن التوقع ليس يقينًا."}],"prayer":"اللهم اهدني لما ينفعني اليوم، واجعل لي من ذكرك سكينة، ومن حسن التدبير عونًا، واصرف عني ما أخشاه من السوء.","closing":"ربما لا تستطيع أن تجعل الغد واضحًا الآن، لكن بإمكانك أن تترك له مكانه: غدًا، لا هذه الدقيقة كلها. افعل ما تقدر عليه من استعداد، واسمح لنفسك بأن تعيش شيئًا من يومك دون مراقبة المستقبل في كل لحظة.","content":[{"type":"paragraph","text":"هناك ليالٍ يكون فيها الغد حاضرًا أكثر من اليوم. تتخيل مكالمة لم تأتِ، أو نتيجة لم تصدر، أو خسارة تخشاها، فتجد نفسك تراجع الاحتمالات مرة بعد مرة. ربما تقول: أعرف أنني أكثر التفكير، لكنني لا أستطيع إيقافه. لا حاجة لأن نلومك على خوفك؛ الأهم أن نفصل بين ما وقع فعلًا وما تخشى أن يقع."},{"type":"heading","text":"ليس كل احتمال خبرًا"},{"type":"paragraph","text":"الخوف قد يدفع الذهن إلى التعامل مع أسوأ احتمال كأنه حقيقة مكتملة. خذ ورقة إن رغبت: ما الأمر المؤكد؟ ما المعلومات التي تنقصك؟ ما الخطوة التي تستطيع فعلها اليوم؟ وما الشيء الذي لا تملك حسمه مهما أطلت التفكير؟ قد يخفف هذا التمييز قليلًا من ازدحام الأفكار."},{"type":"heading","text":"الذكر، والتوكل، وحدود علمنا بالغد"},{"type":"verse","text":"﴿أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾","ref":"الرعد: ٢٨ — اقتباس من الآية"},{"type":"paragraph","text":"تذكر الآية اطمئنان القلوب بذكر الله. وهي تفتح باب الذكر والرجاء، ولا تصلح وحدها لتشخيص القلق أو الحكم على إيمان من بقي خائفًا."},{"type":"verse","text":"﴿وَشَاوِرْهُمْ فِي الْأَمْرِ فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ﴾","ref":"آل عمران: ١٥٩ — اقتباس من الآية"},{"type":"paragraph","text":"وردت المشاورة والعزم والتوكل معًا في سياق خطاب النبي صلى الله عليه وسلم. نستفيد منها معنى النظر في الأسباب قبل القرار، دون ضمان نتيجة بعينها."},{"type":"verse","text":"﴿وَمَا تَدْرِي نَفْسٌ مَاذَا تَكْسِبُ غَدًا﴾","ref":"لقمان: ٣٤ — اقتباس من الآية"},{"type":"paragraph","text":"تذكر الآية أن الإنسان لا يعلم ما سيكسب غدًا. جهل الغيب لا يمنع التخطيط الممكن، لكنه يذكّرنا بأن التوقع ليس يقينًا."},{"type":"heading","text":"الذكر لا يلغي أسباب الحياة"},{"type":"paragraph","text":"تذكر الآيات طمأنينة القلوب بذكر الله، وتجمع بين المشاورة والعزم والتوكل، وتذكر أن علم الغد الكامل ليس عند الإنسان. نقرأ ذلك لنجد معنى للاستعانة والعمل، لا لنزعم أن كل قلق يزول بمجرد قراءة جملة. وإذا صار الخوف يعطل نومك أو حياتك باستمرار، فطلب مساعدة متخصصة أمر محمود."},{"type":"heading","text":"خفف مهمة هذا اليوم"},{"type":"paragraph","text":"إن كنت تنتظر خبرًا، فاختر وقتًا مناسبًا للتحقق منه بدل المراقبة المستمرة. وإن كان أمامك قرار، فاجمع المعلومات اللازمة واستشر من يعرف الأمر. وبعد فعل ما تقدر عليه، جرّب أن تترك بقية الساعات لأعمالك المعتادة أو لراحة تحتاجها."},{"type":"heading","text":"دعاء من صياغة المؤلف"},{"type":"paragraph","text":"اللهم اهدني لما ينفعني اليوم، واجعل لي من ذكرك سكينة، ومن حسن التدبير عونًا، واصرف عني ما أخشاه من السوء."},{"type":"heading","text":"إلى من أتعبه التفكير"},{"type":"paragraph","text":"ربما لا تستطيع أن تجعل الغد واضحًا الآن، لكن بإمكانك أن تترك له مكانه: غدًا، لا هذه الدقيقة كلها. افعل ما تقدر عليه من استعداد، واسمح لنفسك بأن تعيش شيئًا من يومك دون مراقبة المستقبل في كل لحظة."}]},{"id":9,"title":"حين تسمع خبرًا يكسر يومك","opening":"قد تتلقى خبرًا فيتغير شكل يومك كله. ينتهي صوت من أخبرك، لكن الجملة تبقى معك: تعود حين تحاول أن تأكل، وحين يسألك أحد عن حالك، وحين تنفرد بنفسك. وربما تتمنى أن تفهم ما حدث قبل أن يطلب منك أحد أن تتماسك. إذا كان الخبر قريبًا من قلبك إلى هذا الحد، فلا تعجل على نفسك. بعض الأخبار تحتاج وقتًا حتى يجد الإنسان الكلمات التي يصف بها أثرها.","verses":[{"text":"﴿وَتَوَلَّىٰ عَنْهُمْ وَقَالَ يَا أَسَفَىٰ عَلَىٰ يُوسُفَ وَابْيَضَّتْ عَيْنَاهُ مِنَ الْحُزْنِ فَهُوَ كَظِيمٌ﴾","reference":"يوسف: ٨٤ — اقتباس من الآية","sura":"يوسف","number":"٨٤","explanation":"يصف القرآن حزن يعقوب على يوسف حتى ظهر أثره في عينيه. لم يُخفِ النص هذا الألم، ولا يذكره ليُلام يعقوب عليه السلام عليه."},{"text":"﴿إِنَّمَا أَشْكُو بَثِّي وَحُزْنِي إِلَى اللَّهِ﴾","reference":"يوسف: ٨٦ — اقتباس من الآية","sura":"يوسف","number":"٨٦","explanation":"قال يعقوب إنه يشكو بثه وحزنه إلى الله. في هذا موضع للتوجه إلى الله حين يثقل القلب، دون إنكار الشعور أو الادعاء بأن الإنسان لا يتألم."},{"text":"﴿وَلَنَبْلُوَنَّكُمْ بِشَيْءٍ مِنَ الْخَوْفِ وَالْجُوعِ وَنَقْصٍ مِنَ الْأَمْوَالِ وَالْأَنْفُسِ وَالثَّمَرَاتِ ۗ وَبَشِّرِ الصَّابِرِينَ﴾","reference":"البقرة: ١٥٥ — اقتباس من الآية","sura":"البقرة","number":"١٥٥","explanation":"تذكر الآية أن الحياة قد تمر بالخوف والجوع والفقد، وتبشّر الصابرين. ولا ينبغي جعل الابتلاء نسخة واحدة تتشابه تفاصيلها عند كل إنسان."}],"prayer":"إنا لله وإنا إليه راجعون. اللهم ارحم قلبي في مصيبتي، وأعنّي على ما يلزمني اليوم، وارزقني السكينة والصحبة الأمينة.","closing":"إن لم تكن مستعدًا للكلام، فليس عليك أن تفسر صمتك. وإن بكيت، فلا تجعل الدموع سببًا لمحاسبة نفسك. الخبر قد يقع في لحظة، أما القلب فيحتاج إلى وقته حتى يستوعبه. امنحه شيئًا من الرفق الذي كنت ستمنحه لمن تحب.","content":[{"type":"paragraph","text":"قد تتلقى خبرًا فيتغير شكل يومك كله. ينتهي صوت من أخبرك، لكن الجملة تبقى معك: تعود حين تحاول أن تأكل، وحين يسألك أحد عن حالك، وحين تنفرد بنفسك. وربما تتمنى أن تفهم ما حدث قبل أن يطلب منك أحد أن تتماسك. إذا كان الخبر قريبًا من قلبك إلى هذا الحد، فلا تعجل على نفسك. بعض الأخبار تحتاج وقتًا حتى يجد الإنسان الكلمات التي يصف بها أثرها."},{"type":"heading","text":"حين يبقى صدى الخبر"},{"type":"paragraph","text":"قد تضحك في لحظة، ثم تتذكر فتسكت؛ وقد تنسى الأمر لدقائق ثم يعود الوجع كأنه جديد. لا تجعل اختلاف مشاعرك دليلًا على خلل فيك. ولا يلزمك أن تروي التفاصيل لمن لا تريد. يكفي أن يكون إلى جوارك شخص تحس معه بالأمان، أو أن تعرف من تستطيع الاتصال به إذا احتجت."},{"type":"heading","text":"حزن يعقوب وصدق الشكوى إلى الله"},{"type":"verse","text":"﴿وَتَوَلَّىٰ عَنْهُمْ وَقَالَ يَا أَسَفَىٰ عَلَىٰ يُوسُفَ وَابْيَضَّتْ عَيْنَاهُ مِنَ الْحُزْنِ فَهُوَ كَظِيمٌ﴾","ref":"يوسف: ٨٤ — اقتباس من الآية"},{"type":"paragraph","text":"يصف القرآن حزن يعقوب على يوسف حتى ظهر أثره في عينيه. لم يُخفِ النص هذا الألم، ولا يذكره ليُلام يعقوب عليه السلام عليه."},{"type":"verse","text":"﴿إِنَّمَا أَشْكُو بَثِّي وَحُزْنِي إِلَى اللَّهِ﴾","ref":"يوسف: ٨٦ — اقتباس من الآية"},{"type":"paragraph","text":"قال يعقوب إنه يشكو بثه وحزنه إلى الله. في هذا موضع للتوجه إلى الله حين يثقل القلب، دون إنكار الشعور أو الادعاء بأن الإنسان لا يتألم."},{"type":"verse","text":"﴿وَلَنَبْلُوَنَّكُمْ بِشَيْءٍ مِنَ الْخَوْفِ وَالْجُوعِ وَنَقْصٍ مِنَ الْأَمْوَالِ وَالْأَنْفُسِ وَالثَّمَرَاتِ ۗ وَبَشِّرِ الصَّابِرِينَ﴾","ref":"البقرة: ١٥٥ — اقتباس من الآية"},{"type":"paragraph","text":"تذكر الآية أن الحياة قد تمر بالخوف والجوع والفقد، وتبشّر الصابرين. ولا ينبغي جعل الابتلاء نسخة واحدة تتشابه تفاصيلها عند كل إنسان."},{"type":"heading","text":"الحزن لا ينفي الرجاء"},{"type":"paragraph","text":"حزن يعقوب عليه السلام حزنًا شديدًا، وذكر القرآن شكواه إلى الله. ثم واصل في قصته البحث والسؤال. نرى هنا قلبًا موجوعًا وقلبًا يرجو في الوقت نفسه. لا نستخرج من نهاية القصة وعدًا بأن كل غائب سيعود؛ لكننا نتعلم ألا نعد الحزن وحده نقصًا في الإيمان، وألا نطلب من الإنسان محو ما أصابه في لحظة."},{"type":"heading","text":"لهذه الساعة ما يناسبها"},{"type":"paragraph","text":"تحقق من الخبر من مصدر موثوق إن كانت تفاصيله لا تزال غامضة. وإذا كان هناك إجراء لا يحتمل التأخير، فاطلب العون من شخص تثق به. أما القرارات البعيدة فاترك لها وقتًا أفضل إن أمكن. اشرب ماءً، واجلس في موضع آمن، وخذ من الحديث أو الصمت ما تحتاج إليه."},{"type":"heading","text":"مناجاة ودعاء · بعض الألفاظ من القرآن، والباقي من صياغة المؤلف"},{"type":"paragraph","text":"إنا لله وإنا إليه راجعون. اللهم ارحم قلبي في مصيبتي، وأعنّي على ما يلزمني اليوم، وارزقني السكينة والصحبة الأمينة."},{"type":"heading","text":"حين لا تجد ما تقوله"},{"type":"paragraph","text":"إن لم تكن مستعدًا للكلام، فليس عليك أن تفسر صمتك. وإن بكيت، فلا تجعل الدموع سببًا لمحاسبة نفسك. الخبر قد يقع في لحظة، أما القلب فيحتاج إلى وقته حتى يستوعبه. امنحه شيئًا من الرفق الذي كنت ستمنحه لمن تحب."}]},{"id":10,"title":"حين تخاف ممن يفترض أن يطمئنك","opening":"من أصعب الخوف أن يأتيك من شخص كان ينبغي أن تشعر معه بالأمان. قد تراقب نبرة صوته قبل أن تتكلم، أو تخفي أمرًا صغيرًا خشية رد فعل يؤذيك. وربما تسمع ممن حولك أن ما يجري مجرد خلاف، بينما تعرف أنت مقدار الخوف الذي تعيشه. إذا كانت سلامتك مهددة، فهذه ليست مسألة يُطلب منك حلها بالمجاملة أو الصبر على المزيد من الأذى.","verses":[{"text":"﴿وَلَمَنِ انْتَصَرَ بَعْدَ ظُلْمِهِ فَأُولَئِكَ مَا عَلَيْهِمْ مِنْ سَبِيلٍ﴾","reference":"الشورى: ٤١ — اقتباس من الآية","sura":"الشورى","number":"٤١","explanation":"تقرر الآية مشروعية طلب المظلوم حقه في حدود العدل. وهي لا تبيح الاعتداء المضاد، لكنها ترفع الوهم بأن الصبر يعني قبول الظلم دون طلب حماية."},{"text":"﴿كُونُوا قَوَّامِينَ بِالْقِسْطِ شُهَدَاءَ لِلَّهِ وَلَوْ عَلَىٰ أَنْفُسِكُمْ﴾","reference":"النساء: ١٣٥ — اقتباس من الآية","sura":"النساء","number":"١٣٥","explanation":"الأمر بالقسط يتوجه إلى من يشهد أو يحكم أو يستطيع الإنصاف. لا ينبغي أن نحمّل المتضرر وحده مسؤولية إصلاح بيئة تؤذيه."}],"prayer":"اللهم احفظ من خاف في بيته أو بين أهله، وهيئ له عونًا مأمونًا، وأقم العدل بين عبادك.","closing":"أنت تستحق أن تعيش دون تهديد. ولا يحق لأحد أن يجعل خوفك ثمنًا للمحبة أو القرابة. اطلب مساعدة تحفظك، ولو كانت الخطوة الأولى مجرد حديث آمن مع شخص موثوق. ليس عليك أن تواجه كل هذا وحدك.","content":[{"type":"paragraph","text":"من أصعب الخوف أن يأتيك من شخص كان ينبغي أن تشعر معه بالأمان. قد تراقب نبرة صوته قبل أن تتكلم، أو تخفي أمرًا صغيرًا خشية رد فعل يؤذيك. وربما تسمع ممن حولك أن ما يجري مجرد خلاف، بينما تعرف أنت مقدار الخوف الذي تعيشه. إذا كانت سلامتك مهددة، فهذه ليست مسألة يُطلب منك حلها بالمجاملة أو الصبر على المزيد من الأذى."},{"type":"heading","text":"الأمان يسبق المصالحة"},{"type":"paragraph","text":"قد يحتاج الإنسان إلى الابتعاد عن موضع الخطر أو طلب حماية قبل أي حديث عن إصلاح العلاقة. ولا تكون المواجهة المباشرة آمنة في كل حال؛ فقد تزيد الخطر إذا كان الطرف الآخر عنيفًا. من المهم أن تعرف إلى من يمكنك اللجوء، وأن تضع سلامتك في المقدمة."},{"type":"heading","text":"حق المظلوم والأمر بالقسط"},{"type":"verse","text":"﴿وَلَمَنِ انْتَصَرَ بَعْدَ ظُلْمِهِ فَأُولَئِكَ مَا عَلَيْهِمْ مِنْ سَبِيلٍ﴾","ref":"الشورى: ٤١ — اقتباس من الآية"},{"type":"paragraph","text":"تقرر الآية مشروعية طلب المظلوم حقه في حدود العدل. وهي لا تبيح الاعتداء المضاد، لكنها ترفع الوهم بأن الصبر يعني قبول الظلم دون طلب حماية."},{"type":"verse","text":"﴿كُونُوا قَوَّامِينَ بِالْقِسْطِ شُهَدَاءَ لِلَّهِ وَلَوْ عَلَىٰ أَنْفُسِكُمْ﴾","ref":"النساء: ١٣٥ — اقتباس من الآية"},{"type":"paragraph","text":"الأمر بالقسط يتوجه إلى من يشهد أو يحكم أو يستطيع الإنصاف. لا ينبغي أن نحمّل المتضرر وحده مسؤولية إصلاح بيئة تؤذيه."},{"type":"heading","text":"العدل لا يتوقف عند باب البيت"},{"type":"paragraph","text":"تذكر الآيات حق المظلوم في طلب الإنصاف، وتأمر بالقسط. ولا يعني ذلك دعوة إلى الانتقام أو تجاوز الحق. كما لا تعني قيمة العفو أن يسقط حق الإنسان في الأمان. وإذا كنت تقرأ لأجل شخص يتعرض للأذى، فربما يحتاج إلى أن تصدّقه وتساعده على حماية نفسه أكثر مما يحتاج إلى نصيحة بالإصلاح السريع."},{"type":"heading","text":"اختر مساعدة لا تزيد الخطر"},{"type":"paragraph","text":"إذا كان الأذى قائمًا، تواصل مع جهة حماية مختصة أو إنسان مأمون يعرف كيف يقدم الدعم. لا تُخبر المعتدي بخطة خروج أو توثيق إن كان ذلك سيزيد الخطر. وتختلف إجراءات الحماية باختلاف المكان والظرف؛ لذلك خذ المشورة من جهة مؤهلة."},{"type":"heading","text":"إذا كنت تقرأ لأجل شخص آخر"},{"type":"paragraph","text":"إذا أخبرك شخص قريب بأنه يتعرض للأذى، فاستمع دون لوم أو استعجال قرار. اسأله أي نوع من الدعم آمن له، ولا تكشف خطته لمن قد يؤذيه."},{"type":"heading","text":"دعاء من صياغة المؤلف"},{"type":"paragraph","text":"اللهم احفظ من خاف في بيته أو بين أهله، وهيئ له عونًا مأمونًا، وأقم العدل بين عبادك."},{"type":"heading","text":"إذا كان الخوف في مكان يفترض أن يريحك"},{"type":"paragraph","text":"أنت تستحق أن تعيش دون تهديد. ولا يحق لأحد أن يجعل خوفك ثمنًا للمحبة أو القرابة. اطلب مساعدة تحفظك، ولو كانت الخطوة الأولى مجرد حديث آمن مع شخص موثوق. ليس عليك أن تواجه كل هذا وحدك."}]},{"id":11,"title":"حين لا يجد الطفل من يدافع عنه","opening":"قد لا يعرف الطفل اسم ما يحدث له. ربما يصبح صامتًا، أو يخاف مكانًا كان يحبه، أو يتردد قبل أن يقترب من شخص معين. وقد يبوح بجملة صغيرة لا يفهم الكبار معناها من المرة الأولى. الطفل لا يستطيع دائمًا أن يدافع عن نفسه أو يجمع أدلة ما وقع له؛ ولذلك فإن حماية الطفل مسؤولية الكبار أولًا، وليست مهمة نضعها على كتفيه.","verses":[{"text":"﴿وَلْيَخْشَ الَّذِينَ لَوْ تَرَكُوا مِنْ خَلْفِهِمْ ذُرِّيَّةً ضِعَافًا خَافُوا عَلَيْهِمْ﴾","reference":"النساء: ٩ — اقتباس من الآية","sura":"النساء","number":"٩","explanation":"وردت الآية في سياق حقوق من يتركون خلفهم ذرية ضعافًا وما يتصل بالوصايا. نستفيد من معناها وجوب رعاية الضعيف والعدل في شأنه، دون نسب إجراءات حماية الأطفال المعاصرة إليها نصًا."},{"text":"﴿لَا يَسْخَرْ قَوْمٌ مِنْ قَوْمٍ عَسَىٰ أَنْ يَكُونُوا خَيْرًا مِنْهُمْ﴾","reference":"الحجرات: ١١ — اقتباس من الآية","sura":"الحجرات","number":"١١","explanation":"تنهي الآية عن السخرية واللمز والتنابز بالألقاب. فالإهانة ليست أمرًا هينًا، سواء صدرت من كبير أو بين الصغار، ويحتاج الطفل إلى من يوقفها ويحميه."}],"prayer":"اللهم احفظ الأطفال من كل أذى، وارزقهم من يسمعهم ويحمي حقوقهم برحمة وعدل.","closing":"ليس على الطفل أن يصوغ شكواه بإتقان حتى نأخذها بجدية. وواجب الكبار أن يفتحوا له مكانًا آمنًا للكلام واللعب والتعلم، وأن يطلبوا له الحماية حين يحتاجها. إذا كان بوسعك أن تكون ذلك الكبير المأمون، فلا تؤخر دورك.","content":[{"type":"paragraph","text":"قد لا يعرف الطفل اسم ما يحدث له. ربما يصبح صامتًا، أو يخاف مكانًا كان يحبه، أو يتردد قبل أن يقترب من شخص معين. وقد يبوح بجملة صغيرة لا يفهم الكبار معناها من المرة الأولى. الطفل لا يستطيع دائمًا أن يدافع عن نفسه أو يجمع أدلة ما وقع له؛ ولذلك فإن حماية الطفل مسؤولية الكبار أولًا، وليست مهمة نضعها على كتفيه."},{"type":"heading","text":"اسمع الطفل دون أن تستجوبه"},{"type":"paragraph","text":"إن أخبرك طفل بما يخيفه، فدع له وقتًا للكلام، وأكد أنك تأخذ ما قاله بجدية. تجنب الأسئلة المتكررة أو توجيه روايته إلى إجابة بعينها، ولا تعده بسرية مطلقة إذا كانت سلامته تتطلب إبلاغ جهة حماية. الاستماع الهادئ بداية مهمة، ثم يأتي دور أهل الاختصاص."},{"type":"heading","text":"حقوق الضعفاء وحرمة الإهانة"},{"type":"verse","text":"﴿وَلْيَخْشَ الَّذِينَ لَوْ تَرَكُوا مِنْ خَلْفِهِمْ ذُرِّيَّةً ضِعَافًا خَافُوا عَلَيْهِمْ﴾","ref":"النساء: ٩ — اقتباس من الآية"},{"type":"paragraph","text":"وردت الآية في سياق حقوق من يتركون خلفهم ذرية ضعافًا وما يتصل بالوصايا. نستفيد من معناها وجوب رعاية الضعيف والعدل في شأنه، دون نسب إجراءات حماية الأطفال المعاصرة إليها نصًا."},{"type":"verse","text":"﴿لَا يَسْخَرْ قَوْمٌ مِنْ قَوْمٍ عَسَىٰ أَنْ يَكُونُوا خَيْرًا مِنْهُمْ﴾","ref":"الحجرات: ١١ — اقتباس من الآية"},{"type":"paragraph","text":"تنهي الآية عن السخرية واللمز والتنابز بالألقاب. فالإهانة ليست أمرًا هينًا، سواء صدرت من كبير أو بين الصغار، ويحتاج الطفل إلى من يوقفها ويحميه."},{"type":"heading","text":"الضعفاء أمانة في أعناق القادرين"},{"type":"paragraph","text":"تتحدث آية النساء عن خشية من يترك وراءه ذرية ضعافًا، وفيها دعوة إلى تقوى الله والقول السديد في سياق حفظ الحقوق والوصايا. وتنهى آية الحجرات عن السخرية والتنابز. لا تضع الآيتان نظام حماية أطفال حديثًا، ولكنهما تذكران بمسؤولية الكبار في حفظ الكرامة ومنع الأذى، بينما تُرجع خطوات الحماية إلى المختصين."},{"type":"heading","text":"حين تحتاج الحماية إلى تدخل"},{"type":"paragraph","text":"إذا كان الطفل في خطر، فالأولوية لسلامته والتواصل مع خدمة حماية الطفل أو جهة الطوارئ المناسبة. سجّل ما قاله بكلماته قدر الإمكان دون استجواب جديد، ولا تواجه مشتبهًا به بطريقة قد تعرض الطفل لمزيد من الخطر."},{"type":"heading","text":"إذا كنت تقرأ لأجل شخص آخر"},{"type":"paragraph","text":"إذا وجدت طفلًا خائفًا، صدّقه في وصف خوفه دون أن تتولى التحقيق بنفسك. استخدم جهة الحماية المختصة، وقدم سلامته على رغبة الجميع في إنهاء الحديث سريعًا."},{"type":"heading","text":"دعاء من صياغة المؤلف"},{"type":"paragraph","text":"اللهم احفظ الأطفال من كل أذى، وارزقهم من يسمعهم ويحمي حقوقهم برحمة وعدل."},{"type":"heading","text":"إلى الطفل الذي لا يجد الكلمات"},{"type":"paragraph","text":"ليس على الطفل أن يصوغ شكواه بإتقان حتى نأخذها بجدية. وواجب الكبار أن يفتحوا له مكانًا آمنًا للكلام واللعب والتعلم، وأن يطلبوا له الحماية حين يحتاجها. إذا كان بوسعك أن تكون ذلك الكبير المأمون، فلا تؤخر دورك."}]},{"id":12,"title":"حين تتعثر في التعلم","opening":"قد تجلس أمام صفحة فتقرأها مرة وثانية ولا يثبت معناها، ثم تسمع من يقول إن المسألة سهلة. وربما تنظر إلى نتيجة اختبار فتنسى الساعات التي بذلتها في الاستعداد. التعثر في التعلم مؤلم، خاصة حين يتحول في كلام الناس إلى حكم على ذكائك أو مستقبلك. لكن الدرجة تخبرنا عن أداء في وقت محدد، لا عن كل ما يمكن أن تتعلمه أو تكونه.","verses":[{"text":"﴿وَقُلْ رَبِّ زِدْنِي عِلْمًا﴾","reference":"طه: ١١٤ — اقتباس من الآية","sura":"طه","number":"١١٤","explanation":"في قوله تعالى «وقل رب زدني علمًا» توجيه إلى طلب المزيد من العلم. نستطيع أن نأخذ منه حب التعلم والدعاء به، مع مواصلة الأخذ بأسبابه الواقعية."}],"prayer":"رب زدني علمًا. اللهم افتح لي أبواب الفهم، وارزقني من يعلمني برفق وصبر.","closing":"قد تكون محبطًا من اختبار أو مادة أو طريق دراسة طويل. اسمح لنفسك بمراجعة الطريقة قبل الحكم على قدراتك. ما لم تفهمه اليوم قد تحتاج إليه من باب آخر، ومن حقك أن تسأل حتى تتضح الفكرة دون أن تخجل من السؤال.","content":[{"type":"paragraph","text":"قد تجلس أمام صفحة فتقرأها مرة وثانية ولا يثبت معناها، ثم تسمع من يقول إن المسألة سهلة. وربما تنظر إلى نتيجة اختبار فتنسى الساعات التي بذلتها في الاستعداد. التعثر في التعلم مؤلم، خاصة حين يتحول في كلام الناس إلى حكم على ذكائك أو مستقبلك. لكن الدرجة تخبرنا عن أداء في وقت محدد، لا عن كل ما يمكن أن تتعلمه أو تكونه."},{"type":"heading","text":"قد تكون طريقة التعلم هي المشكلة"},{"type":"paragraph","text":"هناك من يحتاج إلى شرح مسموع، ومن يفهم بالرسم، ومن يتطلب تعلمه وقتًا أطول أو تهيئة مناسبة. وقد يؤثر القلق أو المرض أو ظروف المنزل في القدرة على التركيز. بدل أن تبدأ بلوم نفسك، حاول أن تحدد ما يصعب عليك: فهم الفكرة، أو تذكرها، أو حل التمرين، أو الوقت المتاح للدراسة."},{"type":"heading","text":"الدعاء بزيادة العلم"},{"type":"verse","text":"﴿وَقُلْ رَبِّ زِدْنِي عِلْمًا﴾","ref":"طه: ١١٤ — اقتباس من الآية"},{"type":"paragraph","text":"في قوله تعالى «وقل رب زدني علمًا» توجيه إلى طلب المزيد من العلم. نستطيع أن نأخذ منه حب التعلم والدعاء به، مع مواصلة الأخذ بأسبابه الواقعية."},{"type":"heading","text":"دعاء العلم لا يختصر طريقه"},{"type":"paragraph","text":"علّم القرآن النبي صلى الله عليه وسلم أن يقول: رب زدني علمًا. من الجميل أن ندعو بهذا الدعاء، ثم نأخذ بأسباب التعلم: سؤال المعلم، والتدرج في الأمثلة، وإعادة المحاولة بطريقة مختلفة. وليس في الآية وعد بأن يصبح كل درس سهلًا بمجرد ترديد الدعاء."},{"type":"heading","text":"ابحث عن طريقة أقرب إليك"},{"type":"paragraph","text":"اختر درسًا صغيرًا وحدد موضع التعثر فيه. اطلب مثالًا محلولًا، ثم جرّب مسألة مشابهة، واستفسر عن الخطوة التي لم تفهمها. وإذا استمرت صعوبة واضحة في القراءة أو التركيز أو الإتاحة، فاستعن بجهة تعليمية متخصصة بدل الاكتفاء بتكرار النصيحة بالاجتهاد."},{"type":"heading","text":"مناجاة ودعاء · بعض الألفاظ من القرآن، والباقي من صياغة المؤلف"},{"type":"paragraph","text":"رب زدني علمًا. اللهم افتح لي أبواب الفهم، وارزقني من يعلمني برفق وصبر."},{"type":"heading","text":"حين لا تشبه نتيجتك جهدك"},{"type":"paragraph","text":"قد تكون محبطًا من اختبار أو مادة أو طريق دراسة طويل. اسمح لنفسك بمراجعة الطريقة قبل الحكم على قدراتك. ما لم تفهمه اليوم قد تحتاج إليه من باب آخر، ومن حقك أن تسأل حتى تتضح الفكرة دون أن تخجل من السؤال."}]},{"id":13,"title":"حين تتعقد علاقة قريبة","opening":"أحيانًا لا يتعبك البعد عن الناس، بل قرب شخص عزيز لا تعرف كيف تتفاهم معه. قد تحبه وتتأذى من بعض تصرفاته، أو ترغب في إصلاح العلاقة ولا تعرف أين تبدأ. وقد تصمت أيامًا حتى لا يكثر الخلاف، ثم تكتشف أن الصمت لم يزل المشكلة. العلاقات القريبة تحتاج مودة، لكنها تحتاج أيضًا احترامًا وحدودًا تحفظ كرامة الطرفين.","verses":[{"text":"﴿وَجَعَلَ بَيْنَكُمْ مَوَدَّةً وَرَحْمَةً﴾","reference":"الروم: ٢١ — اقتباس من الآية","sura":"الروم","number":"٢١","explanation":"تذكر الآية من آيات الله أن جعل بين الزوجين مودة ورحمة. هي في سياق الزواج، فلا نجعلها وعدًا بأن كل علاقة ستسير بلا خلاف."},{"text":"﴿وَعَاشِرُوهُنَّ بِالْمَعْرُوفِ﴾","reference":"النساء: ١٩ — اقتباس من الآية","sura":"النساء","number":"١٩","explanation":"الأمر بالمعاشرة بالمعروف يتناول حسن المعاملة وكف الأذى في الحياة الزوجية. فلا تصبح القسوة أمرًا مقبولًا لأنها تقع داخل بيت."},{"text":"﴿وَقُلْ لِعِبَادِي يَقُولُوا الَّتِي هِيَ أَحْسَنُ﴾","reference":"الإسراء: ٥٣ — اقتباس من الآية","sura":"الإسراء","number":"٥٣","explanation":"يدعو القرآن إلى اختيار الكلام الأحسن. وهذا يعين على تهدئة الخلافات الممكن حلها، لكنه لا يلزم المتضرر بمحادثة شخص يهدد سلامته."}],"prayer":"اللهم أصلح ما يمكن إصلاحه بيننا بالعدل والرحمة، وألهمنا قولًا كريمًا وحدودًا تحفظ الحقوق.","closing":"قد تختار الإصلاح، وقد تحتاج إلى مسافة، وقد لا يوافق الآخر على ما تأمله. لا تجعل كل نهاية دليلًا على أنك لم تحب بما يكفي. المودة الحقيقية لا تطلب منك أن تختفي حتى تبقى العلاقة قائمة.","content":[{"type":"paragraph","text":"أحيانًا لا يتعبك البعد عن الناس، بل قرب شخص عزيز لا تعرف كيف تتفاهم معه. قد تحبه وتتأذى من بعض تصرفاته، أو ترغب في إصلاح العلاقة ولا تعرف أين تبدأ. وقد تصمت أيامًا حتى لا يكثر الخلاف، ثم تكتشف أن الصمت لم يزل المشكلة. العلاقات القريبة تحتاج مودة، لكنها تحتاج أيضًا احترامًا وحدودًا تحفظ كرامة الطرفين."},{"type":"heading","text":"المودة لا تلغي الاختلاف"},{"type":"paragraph","text":"قد ترى في العلاقة أشياء جميلة وأخرى تؤلمك. ليس مطلوبًا أن تنكر إحداهما حتى تثبت الأخرى. حاول أن تذكر سلوكًا محددًا يحتاج إلى تغيير بدل الحكم على الشخص كله. والكلام الواضح الهادئ أنفع من تعبير جارح، ما دام الحديث ممكنًا وآمنًا."},{"type":"heading","text":"المودة والمعروف والكلمة الحسنة"},{"type":"verse","text":"﴿وَجَعَلَ بَيْنَكُمْ مَوَدَّةً وَرَحْمَةً﴾","ref":"الروم: ٢١ — اقتباس من الآية"},{"type":"paragraph","text":"تذكر الآية من آيات الله أن جعل بين الزوجين مودة ورحمة. هي في سياق الزواج، فلا نجعلها وعدًا بأن كل علاقة ستسير بلا خلاف."},{"type":"verse","text":"﴿وَعَاشِرُوهُنَّ بِالْمَعْرُوفِ﴾","ref":"النساء: ١٩ — اقتباس من الآية"},{"type":"paragraph","text":"الأمر بالمعاشرة بالمعروف يتناول حسن المعاملة وكف الأذى في الحياة الزوجية. فلا تصبح القسوة أمرًا مقبولًا لأنها تقع داخل بيت."},{"type":"verse","text":"﴿وَقُلْ لِعِبَادِي يَقُولُوا الَّتِي هِيَ أَحْسَنُ﴾","ref":"الإسراء: ٥٣ — اقتباس من الآية"},{"type":"paragraph","text":"يدعو القرآن إلى اختيار الكلام الأحسن. وهذا يعين على تهدئة الخلافات الممكن حلها، لكنه لا يلزم المتضرر بمحادثة شخص يهدد سلامته."},{"type":"heading","text":"المعروف في القول والفعل"},{"type":"paragraph","text":"تذكر آية الروم المودة والرحمة بين الزوجين، وتأمر آية النساء بالعشرة بالمعروف، وتدعو آية الإسراء إلى اختيار القول الأحسن. هذه معانٍ تخص سياقاتها، ونستفيد منها في أن القرب لا يبرر الإهانة. ولا ينبغي أن نطلب من طرف متضرر بقاءً في علاقة مؤذية لمجرد أن العفو خلق كريم."},{"type":"heading","text":"قبل أن تطلب الصلح"},{"type":"paragraph","text":"اسأل نفسك: ما الذي أريد تغييره تحديدًا؟ وهل يستطيع الطرفان الحديث بأمان؟ وهل هناك اعتداء يحتاج إلى حماية قبل النقاش؟ قد تكون الخطوة المناسبة مصارحة قصيرة، وقد تكون وساطة موثوقة، وقد يكون الابتعاد المؤقت لحفظ الأمان."},{"type":"heading","text":"حدود تحفظ القرب ولا تفسده"},{"type":"paragraph","text":"إذا كررت طلبًا واضحًا ولم يُحترم، فيحق لك أن تحدد ما تقبله وما لا تقبله. قول «هذا يؤلمني، ولن أستمر في الحديث بهذه الطريقة» قد يكون أصدق من عتاب طويل. وفي العلاقات التي تتضمن تهديدًا أو عنفًا، تكون السلامة أولًا."},{"type":"heading","text":"إذا كنت تقرأ لأجل شخص آخر"},{"type":"paragraph","text":"إن كنت طرفًا في خلاف مع شخص تحبه، فاسأله عمّا يحتاجه ليسمعك بأمان. وقد تكون البداية اعتذارًا واضحًا عن فعل محدد، لا تبريرًا لما جرى."},{"type":"heading","text":"دعاء من صياغة المؤلف"},{"type":"paragraph","text":"اللهم أصلح ما يمكن إصلاحه بيننا بالعدل والرحمة، وألهمنا قولًا كريمًا وحدودًا تحفظ الحقوق."},{"type":"heading","text":"إذا أحببت ولم ترتح"},{"type":"paragraph","text":"قد تختار الإصلاح، وقد تحتاج إلى مسافة، وقد لا يوافق الآخر على ما تأمله. لا تجعل كل نهاية دليلًا على أنك لم تحب بما يكفي. المودة الحقيقية لا تطلب منك أن تختفي حتى تبقى العلاقة قائمة."}]},{"id":14,"title":"حين تنهكك رعاية من تحب","opening":"قد تحب إنسانًا حتى تتمنى لو استطعت أن تحمل عنه ألمه. تتابع دواءه، وتسهر إلى جواره، وتنتبه لصوته حين يتحرك في غرفته. ثم يأتي يوم تتمنى فيه ساعة لنفسك، فتشعر بالذنب لمجرد أنك تعبت. لكن المحبة لا تلغي حاجة الجسد إلى النوم، ولا تمنح إنسانًا واحدًا قدرة على فعل كل شيء. من يرعى غيره يحتاج هو أيضًا إلى من يرفق به.","verses":[{"text":"﴿وَبِالْوَالِدَيْنِ إِحْسَانًا﴾","reference":"الإسراء: ٢٣ — اقتباس من الآية","sura":"الإسراء","number":"٢٣","explanation":"تأمر الآية بالإحسان إلى الوالدين، وتؤكد حسن الخطاب عند كبرهما. ومن حسن الرعاية أن تحفظ كرامتهما، وأن يسعى الأبناء إلى ما يحتاجان إليه من عون بحسب القدرة والحال."},{"text":"﴿وَقُلْ رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا﴾","reference":"الإسراء: ٢٤ — اقتباس من الآية","sura":"الإسراء","number":"٢٤","explanation":"يرشد الدعاء القرآني إلى سؤال الله الرحمة للوالدين. يمكن أن يرافق الدعاءُ الرعايةَ العملية دون أن يحل محلها."}],"prayer":"رب ارحمهما كما ربياني صغيرًا. اللهم أعن كل من يرعى أحبته، وارزقه من يقاسمه المسؤولية برحمة.","closing":"إذا احتجت إلى أن تستريح اليوم، فافعل ما تستطيع لترتب رعاية آمنة ثم خذ راحتك. لا تحتاج المحبة إلى شاهد اسمه الإنهاك. وربما كان من أحسن ما تقدمه لمن تحب أن تحفظ بعض قوتك حتى تستطيع أن تعود إليه بقلب أهدأ.","content":[{"type":"paragraph","text":"قد تحب إنسانًا حتى تتمنى لو استطعت أن تحمل عنه ألمه. تتابع دواءه، وتسهر إلى جواره، وتنتبه لصوته حين يتحرك في غرفته. ثم يأتي يوم تتمنى فيه ساعة لنفسك، فتشعر بالذنب لمجرد أنك تعبت. لكن المحبة لا تلغي حاجة الجسد إلى النوم، ولا تمنح إنسانًا واحدًا قدرة على فعل كل شيء. من يرعى غيره يحتاج هو أيضًا إلى من يرفق به."},{"type":"heading","text":"لا يكفي أن نقول للمُعتني: اصبر"},{"type":"paragraph","text":"الرعاية أعمال حقيقية: طعام ودواء ومواعيد وتنظيف ومرافقة وقرارات صعبة. وقد تضيق بها طاقة شخص واحد مهما كانت محبته. من الإنصاف أن يتعاون القادرون في الأسرة، وأن تُطلب الخدمات المتخصصة حين تحتاج الحالة إلى خبرة لا تتوافر في المنزل."},{"type":"heading","text":"الإحسان والقول الكريم للوالدين"},{"type":"verse","text":"﴿وَبِالْوَالِدَيْنِ إِحْسَانًا﴾","ref":"الإسراء: ٢٣ — اقتباس من الآية"},{"type":"paragraph","text":"تأمر الآية بالإحسان إلى الوالدين، وتؤكد حسن الخطاب عند كبرهما. ومن حسن الرعاية أن تحفظ كرامتهما، وأن يسعى الأبناء إلى ما يحتاجان إليه من عون بحسب القدرة والحال."},{"type":"verse","text":"﴿وَقُلْ رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا﴾","ref":"الإسراء: ٢٤ — اقتباس من الآية"},{"type":"paragraph","text":"يرشد الدعاء القرآني إلى سؤال الله الرحمة للوالدين. يمكن أن يرافق الدعاءُ الرعايةَ العملية دون أن يحل محلها."},{"type":"heading","text":"الإحسان لا يعني الإنهاك الدائم"},{"type":"paragraph","text":"تأمر آيات الإسراء بالإحسان إلى الوالدين والقول الكريم لهما والدعاء لهما. وهذا حق عظيم. لكن تفاصيل الرعاية قد تتطلب توزيع الأعباء ومعرفة خيارات العلاج وحفظ رغبة الشخص الذي يُرعى ما أمكن. العناية الجيدة ليست أن يمرض القائم بها في صمت حتى يُثبت بره."},{"type":"heading","text":"اطلب مشاركة واضحة"},{"type":"paragraph","text":"بدل قول «أنا متعب» وحده، يمكنك أن تطلب أمرًا محددًا: من يذهب إلى الموعد؟ من يشتري الدواء؟ من يبقى مع المريض ساعتين؟ وإذا كنت وحيدًا، فاسأل خدمة رعاية أو شخصًا موثوقًا عما يمكن توفيره. أخذ قسط من الراحة جزء من الاستمرار، وليس تخليًا عن المحبة."},{"type":"heading","text":"إذا كنت تقرأ لأجل شخص آخر"},{"type":"paragraph","text":"إذا كان في أسرتك من يحمل معظم الرعاية، فلا تنتظر حتى ينهار ليطلب المساعدة. اعرض مهمة محددة تستطيع الوفاء بها، ثم نفذها دون أن تزيد عليه عبء التذكير."},{"type":"heading","text":"مناجاة ودعاء · بعض الألفاظ من القرآن، والباقي من صياغة المؤلف"},{"type":"paragraph","text":"رب ارحمهما كما ربياني صغيرًا. اللهم أعن كل من يرعى أحبته، وارزقه من يقاسمه المسؤولية برحمة."},{"type":"heading","text":"إلى من يسهر لأجل من يحب"},{"type":"paragraph","text":"إذا احتجت إلى أن تستريح اليوم، فافعل ما تستطيع لترتب رعاية آمنة ثم خذ راحتك. لا تحتاج المحبة إلى شاهد اسمه الإنهاك. وربما كان من أحسن ما تقدمه لمن تحب أن تحفظ بعض قوتك حتى تستطيع أن تعود إليه بقلب أهدأ."}]},{"id":15,"title":"حين يطول صمت العالم حولك","opening":"قد تمر أيام لا يرن فيها هاتفك إلا لأمر عابر، ولا يسألك أحد كيف مضى يومك. وربما تكون بين الناس وتشعر مع ذلك أنك بعيد عنهم. الوحدة لا تأتي على صورة واحدة: قد تكون بعد فقد، أو انتقال إلى مكان جديد، أو مرض، أو خلاف، أو مجرد ابتعاد طويل. وإذا أثقلتك، فليس معنى ذلك أنك لا تعرف كيف تعيش وحدك؛ فالصحبة حاجة إنسانية مفهومة.","verses":[{"text":"﴿وَالْجَارِ ذِي الْقُرْبَىٰ وَالْجَارِ الْجُنُبِ وَالصَّاحِبِ بِالْجَنْبِ﴾","reference":"النساء: ٣٦ — اقتباس من الآية","sura":"النساء","number":"٣٦","explanation":"تجمع الآية أصنافًا من الناس أُمر المسلم بالإحسان إليهم، ومنهم الجار والصاحب. وفيها تذكير بأن المبادرة إلى السؤال والرعاية مسؤولية من يستطيع، لا عبء من يشعر بالوحدة وحده."}],"prayer":"اللهم ارزقني صحبة صالحة ومودة صادقة، وألهمني أن أكون عونًا لمن طال وحده.","closing":"لا تقِس مكانتك بعدد الرسائل التي وصلتك اليوم. ابدأ باتصال صغير يحفظ كرامتك، ودع العلاقة تنمو بما يناسب الطرفين. ولك أن تحتاج إلى الناس من غير أن تعتذر عن حاجتك إلى كلمة طيبة أو مجلس مأمون.","content":[{"type":"paragraph","text":"قد تمر أيام لا يرن فيها هاتفك إلا لأمر عابر، ولا يسألك أحد كيف مضى يومك. وربما تكون بين الناس وتشعر مع ذلك أنك بعيد عنهم. الوحدة لا تأتي على صورة واحدة: قد تكون بعد فقد، أو انتقال إلى مكان جديد، أو مرض، أو خلاف، أو مجرد ابتعاد طويل. وإذا أثقلتك، فليس معنى ذلك أنك لا تعرف كيف تعيش وحدك؛ فالصحبة حاجة إنسانية مفهومة."},{"type":"heading","text":"حين يحتاج الإنسان إلى من يسمعه"},{"type":"paragraph","text":"ليس المطلوب أن تصبح محاطًا بالناس طوال الوقت. قد يكفي شخص تستطيع أن تتحدث معه دون أن تخشى السخرية، أو مكان تشارك فيه الآخرين أمرًا تحبه. وبعض الناس يحتاجون أولًا إلى إزالة عائق يمنعهم من التواصل، كصعوبة النقل أو ضعف السمع أو القلق الشديد."},{"type":"heading","text":"الإحسان إلى من حولنا"},{"type":"verse","text":"﴿وَالْجَارِ ذِي الْقُرْبَىٰ وَالْجَارِ الْجُنُبِ وَالصَّاحِبِ بِالْجَنْبِ﴾","ref":"النساء: ٣٦ — اقتباس من الآية"},{"type":"paragraph","text":"تجمع الآية أصنافًا من الناس أُمر المسلم بالإحسان إليهم، ومنهم الجار والصاحب. وفيها تذكير بأن المبادرة إلى السؤال والرعاية مسؤولية من يستطيع، لا عبء من يشعر بالوحدة وحده."},{"type":"heading","text":"الإحسان يصل إلى الجار والصاحب"},{"type":"paragraph","text":"تذكر آية النساء الإحسان إلى الوالدين والأقارب والجار والصاحب. فهي تخاطب من يستطيع أن يبادر بالخير أيضًا، لا الشخص الوحيد الذي ينتظر اتصالًا. وفي حياتنا قد تكون مكالمة لطيفة، أو زيارة مناسبة، أو السؤال عن جار مسن فعلًا كبيرًا في يوم صاحبه."},{"type":"heading","text":"ابدأ بباب واحد"},{"type":"paragraph","text":"فكر في إنسان مأمون ترتاح إلى حديثه، وأرسل إليه رسالة قصيرة أو اقترح لقاء يناسبكما. وإن لم يتيسر، فابحث عن نشاط مجتمعي أو مكان تتكرر فيه الوجوه المألوفة. وإذا صارت الوحدة مرتبطة بيأس شديد أو انقطاع كامل عن الحياة، فاطلب دعمًا متخصصًا."},{"type":"heading","text":"دعاء من صياغة المؤلف"},{"type":"paragraph","text":"اللهم ارزقني صحبة صالحة ومودة صادقة، وألهمني أن أكون عونًا لمن طال وحده."},{"type":"heading","text":"إذا طال الصمت حولك"},{"type":"paragraph","text":"لا تقِس مكانتك بعدد الرسائل التي وصلتك اليوم. ابدأ باتصال صغير يحفظ كرامتك، ودع العلاقة تنمو بما يناسب الطرفين. ولك أن تحتاج إلى الناس من غير أن تعتذر عن حاجتك إلى كلمة طيبة أو مجلس مأمون."}]},{"id":16,"title":"حين يتأخر الإنصاف","opening":"قد تعرف أن لك حقًا، وتملك ما يثبته، ثم تمر الشهور وأنت تنتظر جوابًا. يصعب أحيانًا أن يكون الألم في الظلم نفسه وفي بطء إنصافه معًا. وربما تتعب من شرح قصتك كل مرة، أو تشعر بأن الناس يريدون منك أن تسكت حتى تنتهي الإجراءات. لا أريد أن أعطيك وعدًا بأن الأمر سيُحسم سريعًا، لكن من المهم ألا يتحول تأخر الإنصاف إلى حكم على قيمة حقك.","verses":[{"text":"﴿كُونُوا قَوَّامِينَ بِالْقِسْطِ شُهَدَاءَ لِلَّهِ وَلَوْ عَلَىٰ أَنْفُسِكُمْ﴾","reference":"النساء: ١٣٥ — اقتباس من الآية","sura":"النساء","number":"١٣٥","explanation":"يأمر القرآن بالعدل حتى حين يتعلق الأمر بالنفس أو القريب. وهذا خطاب لمن يشهد ويملك القرار، وليس مطالبةً لصاحب الحق بأن يثبت كل شيء وحده."},{"text":"﴿وَلَمَنِ انْتَصَرَ بَعْدَ ظُلْمِهِ فَأُولَٰئِكَ مَا عَلَيْهِمْ مِنْ سَبِيلٍ﴾","reference":"الشورى: ٤١ — اقتباس من الآية","sura":"الشورى","number":"٤١","explanation":"تذكر الآية حق المظلوم في الانتصاف ضمن حدود العدل. فالمطالبة بالحق ليست اعتداء، كما أن شدة الظلم لا تبيح تجاوز حدود الحق."}],"prayer":"اللهم أظهر الحق، وارزقني الصبر والحكمة في طلبه، واحفظني من الظلم ومن أن أظلم أحدًا.","closing":"لا توبخ نفسك لأنك تعبت من الانتظار. اجمع ما تحتاج إليه من قوة ومساندة، واتبع طريقًا واضحًا ما استطعت. وتأخر القرار لا يغيّر حقيقة أن الإنسان يستحق أن يُسمع كلامه وأن يُنظر في حقه بعدل.","content":[{"type":"paragraph","text":"قد تعرف أن لك حقًا، وتملك ما يثبته، ثم تمر الشهور وأنت تنتظر جوابًا. يصعب أحيانًا أن يكون الألم في الظلم نفسه وفي بطء إنصافه معًا. وربما تتعب من شرح قصتك كل مرة، أو تشعر بأن الناس يريدون منك أن تسكت حتى تنتهي الإجراءات. لا أريد أن أعطيك وعدًا بأن الأمر سيُحسم سريعًا، لكن من المهم ألا يتحول تأخر الإنصاف إلى حكم على قيمة حقك."},{"type":"heading","text":"حين يطول انتظار العدل"},{"type":"paragraph","text":"في النزاع قد تكون الوقائع واضحة لصاحبها، لكنها تحتاج إلى مستندات وشهادة وإجراء مختص حتى تُفهم على وجهها. قد يساعدك ترتيب التواريخ والأدلة والطلبات على حماية قضيتك من الضياع، وقد تحتاج إلى من يفهم النظام في بلدك. هذا عمل مرهق، ومن الطبيعي أن تحتاج إلى من يساندك فيه."},{"type":"heading","text":"القسط وحق طلب الإنصاف"},{"type":"verse","text":"﴿كُونُوا قَوَّامِينَ بِالْقِسْطِ شُهَدَاءَ لِلَّهِ وَلَوْ عَلَىٰ أَنْفُسِكُمْ﴾","ref":"النساء: ١٣٥ — اقتباس من الآية"},{"type":"paragraph","text":"يأمر القرآن بالعدل حتى حين يتعلق الأمر بالنفس أو القريب. وهذا خطاب لمن يشهد ويملك القرار، وليس مطالبةً لصاحب الحق بأن يثبت كل شيء وحده."},{"type":"verse","text":"﴿وَلَمَنِ انْتَصَرَ بَعْدَ ظُلْمِهِ فَأُولَٰئِكَ مَا عَلَيْهِمْ مِنْ سَبِيلٍ﴾","ref":"الشورى: ٤١ — اقتباس من الآية"},{"type":"paragraph","text":"تذكر الآية حق المظلوم في الانتصاف ضمن حدود العدل. فالمطالبة بالحق ليست اعتداء، كما أن شدة الظلم لا تبيح تجاوز حدود الحق."},{"type":"heading","text":"القسط يحمي الجميع"},{"type":"paragraph","text":"يأمر القرآن بالقيام بالقسط، ويقرر للمظلوم حق طلب الانتصاف. والعدل لا يسمح لنا كذلك أن ننسب إلى الآخرين ما لم يثبت أو أن نؤذي بريئًا في أثناء المطالبة بحقنا. في هذا توازن يحمي صاحب المظلمة، ويحفظ الحقوق من أن تضيع في غضب اللحظة."},{"type":"heading","text":"خطوة تحفظ القضية"},{"type":"paragraph","text":"دوّن ما حدث بترتيب واضح، واحتفظ بما تملك من أدلة، وحدد الجهة المختصة والمطلب الذي تريد الوصول إليه. إذا صاحب النزاع تهديد فاطلب الحماية المناسبة. وربما تحتاج إلى استراحة من متابعة الملف دون أن تتخلى عن حقك؛ تستطيع أن تنيب من تثق به في بعض الإجراءات حين يكون ذلك ممكنًا."},{"type":"heading","text":"إذا كنت تقرأ لأجل شخص آخر"},{"type":"paragraph","text":"إن كنت تملك قراراً أو شاهداً أو وثيقة، فقد تكون عليك مسؤولية في رفع الظلم لا يجوز إلقاؤها على من وقع عليه وحده."},{"type":"heading","text":"دعاء من صياغة المؤلف"},{"type":"paragraph","text":"اللهم أظهر الحق، وارزقني الصبر والحكمة في طلبه، واحفظني من الظلم ومن أن أظلم أحدًا."},{"type":"heading","text":"إن كان الحق يتأخر"},{"type":"paragraph","text":"لا توبخ نفسك لأنك تعبت من الانتظار. اجمع ما تحتاج إليه من قوة ومساندة، واتبع طريقًا واضحًا ما استطعت. وتأخر القرار لا يغيّر حقيقة أن الإنسان يستحق أن يُسمع كلامه وأن يُنظر في حقه بعدل."}]},{"id":17,"title":"حين يتعثر مشروع تعول عليه","opening":"قد تبدأ مشروعًا وأنت تحمل له من الأمل أكثر مما تتسع له الأرقام. ثم تمر أشهر تتزايد فيها الفواتير، ويصعب أن تنظر إلى حسابك دون أن تفكر في أهلك أو موظفيك أو ثقة من ساعدك. تعثر المشروع ليس مبلغًا خسرته فحسب؛ قد يكون معه تعب ووعود ومسؤوليات. ومع هذا، فإن رغبتك في إنقاذه لا تعني أن كل قرار للاستمرار هو القرار الصحيح.","verses":[{"text":"﴿أَوْفُوا الْكَيْلَ وَلَا تَكُونُوا مِنَ الْمُخْسِرِينَ﴾","reference":"الشعراء: ١٨١ — اقتباس من الآية","sura":"الشعراء","number":"١٨١","explanation":"جاء الأمر بإيفاء الكيل في خطاب شعيب لقومه، في سياق منع بخس الناس حقوقهم. نستفيد منه وجوب الأمانة، ولا نحوله إلى ضمان لنجاح كل مشروع."},{"text":"﴿لَا تَأْكُلُوا أَمْوَالَكُمْ بَيْنَكُمْ بِالْبَاطِلِ إِلَّا أَنْ تَكُونَ تِجَارَةً عَنْ تَرَاضٍ مِنْكُمْ﴾","reference":"النساء: ٢٩ — اقتباس من الآية","sura":"النساء","number":"٢٩","explanation":"تنهى الآية عن أخذ أموال الناس بالباطل، وتذكر التجارة عن تراضٍ. وهي أصل أخلاقي وفقهي في المعاملات، أما تقدير الربح والخسارة فيحتاج إلى حساب ومعرفة بالسوق."}],"prayer":"اللهم بارك لنا في الحلال، وأعنّا على أداء حقوق الناس، وألهمنا قرارًا فيه عدل وحكمة.","closing":"ربما لا تستطيع إبقاء المشروع على الصورة التي تمنيتها له. ليس في تغيير الخطة عيب إذا كان مبنيًا على معرفة وحفظ للحقوق. ما تعلمته من تجربة صعبة قد يبقى معك، حتى إن لم تبقَ التجارة نفسها.","content":[{"type":"paragraph","text":"قد تبدأ مشروعًا وأنت تحمل له من الأمل أكثر مما تتسع له الأرقام. ثم تمر أشهر تتزايد فيها الفواتير، ويصعب أن تنظر إلى حسابك دون أن تفكر في أهلك أو موظفيك أو ثقة من ساعدك. تعثر المشروع ليس مبلغًا خسرته فحسب؛ قد يكون معه تعب ووعود ومسؤوليات. ومع هذا، فإن رغبتك في إنقاذه لا تعني أن كل قرار للاستمرار هو القرار الصحيح."},{"type":"heading","text":"حين تحتاج الأرقام إلى أن تُقال بوضوح"},{"type":"paragraph","text":"قد تتمنى أن تأتي مبيعات الغد فتعوض ما فات. لكن القرار التجاري يحتاج أن تعرف ما يدخل وما يخرج، وما تدين به للعمال والموردين، وكم يستطيع المشروع أن يستمر بأمان. النظر إلى الحقيقة مؤلم أحيانًا، لكنه أرحم من زيادة خسارة لا تعرف أين تنتهي."},{"type":"heading","text":"العدل والتراضي في المعاملات"},{"type":"verse","text":"﴿أَوْفُوا الْكَيْلَ وَلَا تَكُونُوا مِنَ الْمُخْسِرِينَ﴾","ref":"الشعراء: ١٨١ — اقتباس من الآية"},{"type":"paragraph","text":"جاء الأمر بإيفاء الكيل في خطاب شعيب لقومه، في سياق منع بخس الناس حقوقهم. نستفيد منه وجوب الأمانة، ولا نحوله إلى ضمان لنجاح كل مشروع."},{"type":"verse","text":"﴿لَا تَأْكُلُوا أَمْوَالَكُمْ بَيْنَكُمْ بِالْبَاطِلِ إِلَّا أَنْ تَكُونَ تِجَارَةً عَنْ تَرَاضٍ مِنْكُمْ﴾","ref":"النساء: ٢٩ — اقتباس من الآية"},{"type":"paragraph","text":"تنهى الآية عن أخذ أموال الناس بالباطل، وتذكر التجارة عن تراضٍ. وهي أصل أخلاقي وفقهي في المعاملات، أما تقدير الربح والخسارة فيحتاج إلى حساب ومعرفة بالسوق."},{"type":"heading","text":"الأمانة في التجارة شيء والربح شيء آخر"},{"type":"paragraph","text":"تذكر الآيات وجوب العدل في الكيل وحرمة أخذ المال بالباطل، وتذكر التجارة عن تراضٍ. هذه مبادئ تضبط المعاملة، لكنها لا تقدم وحدها حساب التكاليف أو توقع الطلب. يمكنك أن تكون أمينًا وتتعثر لأسباب السوق، كما يمكنك أن تحتاج إلى تصحيح خطأ في الإدارة دون أن تجعل خسارتك حكمًا على أخلاقك كلها."},{"type":"heading","text":"قرار يحفظ ما بقي"},{"type":"paragraph","text":"اكتب مصروفاتك الثابتة، وكلفة كل منتج، وما يبقى بعد البيع، والالتزامات القريبة. اسأل شخصًا يفهم النشاط عن الخيارات: تعديل السعر، أو خفض الكلفة، أو تقليص العمل، أو إيقاف خسارة لا تحتمل. واحفظ حقوق العاملين والدائنين، ولا تُنقذ صورة المشروع بوعود تعلم أنك لا تقدر عليها."},{"type":"heading","text":"دعاء من صياغة المؤلف"},{"type":"paragraph","text":"اللهم بارك لنا في الحلال، وأعنّا على أداء حقوق الناس، وألهمنا قرارًا فيه عدل وحكمة."},{"type":"heading","text":"حين يتغير شكل الحلم"},{"type":"paragraph","text":"ربما لا تستطيع إبقاء المشروع على الصورة التي تمنيتها له. ليس في تغيير الخطة عيب إذا كان مبنيًا على معرفة وحفظ للحقوق. ما تعلمته من تجربة صعبة قد يبقى معك، حتى إن لم تبقَ التجارة نفسها."}]},{"id":18,"title":"حين تتعدد الطرق ولا تعرف أيها تختار","opening":"قد تقف بين خيارين وتخشى أن يكون أحدهما بداية ندم طويل. تسأل هذا وذاك، ثم تعود إلى المكان نفسه: ماذا لو اخترت الطريق الخطأ؟ ليس من السهل أن تقرر حين تتعلق بالقرار دراسة أو عمل أو أسرة أو مال. لكن لا يُطلب منك أن تعرف المستقبل حتى تتخذ قرارًا مسؤولًا؛ يكفي أن تبحث عما تستطيع معرفته وتستعين بمن يحسن المشورة.","verses":[{"text":"﴿وَشَاوِرْهُمْ فِي الْأَمْرِ فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ﴾","reference":"آل عمران: ١٥٩ — اقتباس من الآية","sura":"آل عمران","number":"١٥٩","explanation":"تجمع الآية بين المشاورة والعزم والتوكل في سياقها. يمكن أن نتعلم منها حسن الاستعداد للقرار، ولا نستخرج منها ضمانًا بأن كل اختيار سيحقق ما نحب."},{"text":"﴿وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ﴾","reference":"الإسراء: ٣٦ — اقتباس من الآية","sura":"الإسراء","number":"٣٦","explanation":"النهي عن اتباع ما ليس لنا به علم يدعونا إلى التثبت. في القرارات المعاصرة يعني ذلك ألا نبني أمرًا كبيرًا على خبر غير موثوق أو افتراض لم نفحصه."}],"prayer":"اللهم ألهمني الرشد، وأعنّي على طلب المشورة الصادقة، واهدني إلى قرار لا ظلم فيه.","closing":"ليس كل طريق تتركه خسارة، ولا كل نتيجة لا تحبها دليلًا على أنك أخطأت منذ البداية. اختر بقدر ما عرفت وبما راعيت من حقوق، ثم امنح نفسك فرصة أن تعيش قرارك بدل محاكمته كل يوم قبل أن تتضح آثاره.","content":[{"type":"paragraph","text":"قد تقف بين خيارين وتخشى أن يكون أحدهما بداية ندم طويل. تسأل هذا وذاك، ثم تعود إلى المكان نفسه: ماذا لو اخترت الطريق الخطأ؟ ليس من السهل أن تقرر حين تتعلق بالقرار دراسة أو عمل أو أسرة أو مال. لكن لا يُطلب منك أن تعرف المستقبل حتى تتخذ قرارًا مسؤولًا؛ يكفي أن تبحث عما تستطيع معرفته وتستعين بمن يحسن المشورة."},{"type":"paragraph","text":"ما الذي ينقصك لتختار؟"},{"type":"paragraph","text":"تبدأ الحيرة أحيانًا من كثرة الاحتمالات لا من نقص الشجاعة. اكتب الخيارات الحقيقية، ثم اسأل عن المعلومة التي قد تغير قرارك. وقد تكتشف أن هناك طريقًا ثالثًا، أو أن بعض القرارات قابلة للتجربة قبل الالتزام الطويل بها. لا تحمل نفسك عبء توقع كل نتيجة ممكنة."},{"type":"heading","text":"المشاورة والاعتماد على معرفة"},{"type":"verse","text":"﴿وَشَاوِرْهُمْ فِي الْأَمْرِ فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ﴾","ref":"آل عمران: ١٥٩ — اقتباس من الآية"},{"type":"paragraph","text":"تجمع الآية بين المشاورة والعزم والتوكل في سياقها. يمكن أن نتعلم منها حسن الاستعداد للقرار، ولا نستخرج منها ضمانًا بأن كل اختيار سيحقق ما نحب."},{"type":"verse","text":"﴿وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ﴾","ref":"الإسراء: ٣٦ — اقتباس من الآية"},{"type":"paragraph","text":"النهي عن اتباع ما ليس لنا به علم يدعونا إلى التثبت. في القرارات المعاصرة يعني ذلك ألا نبني أمرًا كبيرًا على خبر غير موثوق أو افتراض لم نفحصه."},{"type":"heading","text":"الشورى والتوكل في موضعهما"},{"type":"paragraph","text":"جاء الأمر بالشورى ثم
